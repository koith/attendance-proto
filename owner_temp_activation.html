<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>백억커피 점주 최초 비밀번호 설정</title>
<link rel="stylesheet" href="owner_onboarding_v1.css?v=20261028v374">
</head>
<body>
<main><header class="owner-brand"><img src="logo_combine.jpg" width="218" height="71" alt="백억커피"><span>백억커피 업무자동화 · 지점 관리자</span></header><div class="owner-content"><span class="owner-eyebrow">지점 관리자 계정</span>
<h1>새 비밀번호 설정</h1><ol class="owner-steps" aria-label="계정 설정 순서"><li><span>1</span>메일 확인</li><li><span>2</span>비밀번호 설정</li><li><span>3</span>매장 입장</li></ol>
<p>이메일 인증과 개인 비밀번호 설정 후 대표 관리자로 등록됩니다. 본사가 개통까지 승인한 초대는 바로 해당 지점 관리 화면으로 이동합니다.</p>
<p id="storeDescription" aria-live="polite"></p>
<form id="firstLoginForm" hidden>
<label for="password">새 비밀번호 (12자 이상)
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<p class="owner-field-note">기존 계정을 다시 초대받았다면 이전에 사용하던 것과 다른 새 비밀번호를 입력해 주세요.</p>
<label for="repeat">새 비밀번호 확인
<input id="repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<button id="confirm" type="submit">비밀번호 변경하고 관리자 활성화</button>
</form>
<p id="status" role="status" aria-live="polite">점주 계정 인증 중…</p>

</div><footer class="owner-footer"><span>백억커피 업무자동화</span><a href="./index.html#dashboard">로그인 화면으로</a></footer></main>
<script src="owner_temp_activation.js?v=20261028password1" defer></script>
</body>
</html>
