<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>백억커피 점주 최초 비밀번호 설정</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#172019;background:#f4f7f5}*{box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}
main{background:white;border:1px solid #dbe4de;border-radius:18px;padding:24px;width:100%;max-width:440px;box-shadow:0 5px 18px #183a2310}
h1{font-size:1.3rem;margin:0 0 12px;color:#16482d}p{font-size:.93rem;color:#536258;line-height:1.55}
label{display:block;margin:16px 0 7px;font-size:.9rem;font-weight:600}
input{display:block;width:100%;margin-top:6px;border:1px solid #becfc3;border-radius:9px;padding:13px;font-size:16px}
button{width:100%;background:#1d5d3a;color:white;font-weight:700;border:0;border-radius:9px;padding:14px;margin-top:18px;font-size:1rem}
button:disabled{opacity:.55}a{color:#165d3c}#status{margin-top:14px;font-size:.9rem;white-space:pre-wrap;line-height:1.55}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>점주 최초 비밀번호 설정</h1>
<p>점주 이메일 인증이 확인되면 새 비밀번호를 설정할 수 있습니다. 대표 권한 등록 후에도 지점 운영 개통은 본사 승인이 필요합니다.</p>
<p id="storeDescription" aria-live="polite"></p>
<form id="firstLoginForm" hidden>
<label for="password">새 비밀번호 (12자 이상)
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<label for="repeat">새 비밀번호 확인
<input id="repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<button id="confirm" type="submit">비밀번호 변경하고 관리자 활성화</button>
</form>
<p id="status" role="status" aria-live="polite">점주 계정 인증 중…</p>
<p><a href="./index.html#dashboard">로그인 화면으로 돌아가기</a></p>
</main>
<script src="owner_temp_activation.js?v=20261026resume1" defer></script>
</body>
</html>
