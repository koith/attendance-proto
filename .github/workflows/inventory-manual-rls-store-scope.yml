name: inventory-manual-rls-store-scope
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261012172500_inventory_manual_rls_store_scope.sql'
      - 'qa_inventory_manual_rls_store_scope.sql'
      - '.github/workflows/inventory-manual-rls-store-scope.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012172500_inventory_manual_rls_store_scope.sql'
      - 'qa_inventory_manual_rls_store_scope.sql'
      - '.github/workflows/inventory-manual-rls-store-scope.yml'
jobs:
  synthetic-postgres:
    name: Prove store-isolated inventory CRUD with RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: inventory_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_fixture_only
      PGDATABASE: inventory_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Run actual migration against isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f qa_inventory_manual_rls_store_scope.sql
