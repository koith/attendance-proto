name: audit-v090
on:
  pull_request:
  push:
    branches: [main]
# Cancel only outdated PR checks; main pushes and deployments are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-focus-correction-fields-v090:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node qa_v090_recipe_focus.mjs
