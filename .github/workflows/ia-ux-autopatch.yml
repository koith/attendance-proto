name: ia-ux-autopatch
on:
  push:
    branches: [chatgpt-ia-ux-polish-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ia-ux-polish-v1
          fetch-depth: 1
      - name: Patch large legacy shell safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='if(h==="admin"){ setTab("admin"); requireAuth(renderAdmin); }'
          new='if(h==="admin"){ const q=new URLSearchParams(location.search); if(!q.has("legacyAdmin")){ location.replace("admin_hub.html"); return; } setTab("admin"); requireAuth(async()=>{ await renderAdmin(); if(q.get("openSchedule")==="1") openScheduleModal(); }); }'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('admin route anchor not found')
          old='<select class="sch-st" style="height:44px">'
          new='<select class="sch-st" style="height:44px;min-width:132px;flex:1 1 132px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)">'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('schedule select anchor not found')
          p.write_text(s)
          p=Path('monthly_schedule.js'); s=p.read_text()
          old="document.getElementById('back').onclick=()=>location.href='index.html#admin';"
          new="document.getElementById('back').onclick=()=>location.href='admin_hub.html';"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('monthly back anchor not found')
          p.write_text(s)
          PY
      - name: Verify patched anchors
        run: |
          grep -n 'admin_hub.html' index.html
          grep -n 'min-width:132px' index.html
          grep -n "admin_hub.html" monthly_schedule.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html monthly_schedule.js
          git commit -m 'fix: polish admin routing and schedule controls'
          git push
