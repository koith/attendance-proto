name: ia-ux-autopatch
on:
  push:
    branches: [chatgpt-ia-ux-polish-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ia-ux-polish-v1
          fetch-depth: 1
      - name: Patch legacy shell and editor safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='if(h==="admin"){ const q=new URLSearchParams(location.search); if(!q.has("legacyAdmin")){ location.replace("admin_hub.html"); return; } setTab("admin"); requireAuth(async()=>{ await renderAdmin(); if(q.get("openSchedule")==="1") openScheduleModal(); }); }'
          new='if(h==="admin"){ const q=new URLSearchParams(location.search); if(!q.has("legacyAdmin")){ location.replace("admin_hub.html"); return; } setTab("admin"); requireAuth(async()=>{ if(q.get("returnHub")==="1"){ location.replace("admin_hub.html"); return; } await renderAdmin(); if(q.get("openSchedule")==="1") openScheduleModal(); else if(q.get("task")==="employees"||q.get("task")==="docs") document.getElementById("adEmps")?.scrollIntoView({block:"start"}); else if(q.get("task")==="today") document.getElementById("adList")?.scrollIntoView({block:"start"}); }); }'
          if old in s: s=s.replace(old,new,1)
          elif new not in s:
            old0='if(h==="admin"){ setTab("admin"); requireAuth(renderAdmin); }'
            if old0 in s: s=s.replace(old0,new,1)
            else: raise SystemExit('admin route anchor not found')
          old='<select class="sch-st" style="height:44px">'
          wide='<select class="sch-st" style="height:44px;min-width:132px;flex:1 1 132px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)">'
          if old in s: s=s.replace(old,wide,1)
          elif wide not in s: raise SystemExit('schedule select anchor not found')
          p.write_text(s)
          p=Path('monthly_schedule.js'); s=p.read_text()
          old="document.getElementById('back').onclick=()=>location.href='index.html#admin';"
          new="document.getElementById('back').onclick=()=>location.href='admin_hub.html';"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('monthly back anchor not found')
          p.write_text(s)

          p=Path('employment_contracts_v3.js'); s=p.read_text()
          reps=[
          ("loadedContractId:null,busy:false", "loadedContractId:null,creatingContract:false,busy:false"),
          ("function currentContract(){return periodContracts().find(x=>Number(x.id)===Number(S.contractId))||null}", "function currentContract(){if(S.creatingContract)return null;return periodContracts().find(x=>Number(x.id)===Number(S.contractId))||null}"),
          ("const cs=periodContracts();if(!S.contractId||!cs.some(x=>Number(x.id)===Number(S.contractId)))S.contractId=cs[0]?.id?Number(cs[0].id):null;const c=currentContract();", "const cs=periodContracts();if(S.creatingContract)S.contractId=null;else if(!S.contractId||!cs.some(x=>Number(x.id)===Number(S.contractId)))S.contractId=cs[0]?.id?Number(cs[0].id):null;const c=currentContract();"),
          ("if(cs)cs.onchange=()=>{S.contractId=Number(cs.value);S.loadedContractId=null;render()}", "if(cs)cs.onchange=()=>{S.creatingContract=false;S.contractId=Number(cs.value);S.loadedContractId=null;render()}"),
          ("if(nc)nc.onclick=()=>{S.contractId=null;hydrate(null);render();const d=el('history');if(d)d.open=true}", "if(nc)nc.onclick=()=>{S.creatingContract=true;S.contractId=null;hydrate(null);render();const d=el('history');if(d)d.open=true}"),
          ("p_id:c?.id||null", "p_id:S.creatingContract?null:(c?.id||null)"),
          ("S.contractId=Number(r.id);S.loadedContractId=null;await loadBundle();toast('계약·급여조건을 저장했습니다.')", "S.creatingContract=false;S.contractId=Number(r.id);S.loadedContractId=null;await loadBundle();toast('계약·급여조건을 저장했습니다.')"),
          ("S.periodId=Number(ps.value);S.contractId=null;S.loadedContractId=null;render()", "S.creatingContract=false;S.periodId=Number(ps.value);S.contractId=null;S.loadedContractId=null;render()"),
          ("S.employeeId=Number(el('employee').value)||null;S.bundle={periods:[],contracts:[],workdays:[]};S.periodId=null;S.contractId=null;hydrate(null);", "S.employeeId=Number(el('employee').value)||null;S.bundle={periods:[],contracts:[],workdays:[]};S.periodId=null;S.contractId=null;S.creatingContract=false;hydrate(null);")]
          for a,b in reps:
            if a in s: s=s.replace(a,b,1)
            elif b not in s: raise SystemExit('contract editor anchor not found: '+a[:50])
          p.write_text(s)
          PY
      - name: Verify patched anchors
        run: |
          grep -n 'returnHub' index.html
          grep -n 'min-width:132px' index.html
          grep -n "admin_hub.html" monthly_schedule.js
          grep -n 'creatingContract' employment_contracts_v3.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html monthly_schedule.js employment_contracts_v3.js
          git commit -m 'fix: preserve IA routes and new contract editor state'
          git push
