name: employee-identity-ux-v1-regression
on:
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check employee_identity_ux_v1.js
          node --check actual_attendance_identity_v2.js
          node --check employment_contract_employee_number_v1.js
          node --check payroll_senior_ux_v2.js
          node --check qa_employee_identity_ux_v1.mjs
      - name: Employee identity and senior IA QA
        run: node qa_employee_identity_ux_v1.mjs
