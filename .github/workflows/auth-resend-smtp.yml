# AUTH-01: GitHub Actions operator-gated Supabase Auth SMTP activation.
# No production changes occur on push/PR. Domain verification is required at runtime.
name: AUTH-01 Resend SMTP and Korean invitation setup
on:
  pull_request:
    paths:
      - 'scripts/qa1243_resend_smtp_setup.mjs'
      - 'scripts/qa1243_resend_smtp_setup.test.mjs'
      - '.github/workflows/auth-resend-smtp.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Review existing SMTP/Resend domain or apply verified SMTP and invitation'
        required: true
        default: review
        type: choice
        options: [review, apply]
      sending_domain:
        description: 'Resend verified domain ONLY, e.g. auth.company.example (not sender email)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/qa1243_resend_smtp_setup.test.mjs
  operator-requested-configuration:
    needs: isolated-qa
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_SENDING_DOMAIN: ${{ inputs.sending_domain }}
      RESEND_SMTP_MODE: ${{ inputs.operation }}
      RESEND_SMTP_APPLY_APPROVED: ${{ inputs.operation == 'apply' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resend verified sending domain and Hosted Supabase Auth read/optional apply
        run: node scripts/qa1243_resend_smtp_setup.mjs
      - name: Deployment boundary reminder
        if: always()
        run: |
          echo 'This workflow never creates Auth users or sends emails.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not claim AUTH-01 done until actual invite arrives and activation/login passes.' >> "$GITHUB_STEP_SUMMARY"