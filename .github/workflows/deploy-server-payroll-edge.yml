name: Production payroll Edge deployment

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - '.github/workflows/deploy-server-payroll-edge.yml'
  pull_request:
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - '.github/workflows/deploy-server-payroll-edge.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-payroll-edge
  cancel-in-progress: false

jobs:
  payroll-qa:
    name: Payroll acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core payroll and Edge authorization tests
        run: |
          node qa_payroll_policy_adjustment_v1.mjs
          node qa_payroll_policy_scenarios_v1.mjs
          node qa_payroll_approval_engine_fixture_v1.mjs
          node qa_payroll_weekly_integration_v1.mjs
          node qa_weekly_approval_rpc_guard_v1.mjs
          node qa_weekly_approval_service_boundary_v1.mjs
          node qa_payroll_month_boundary_v1.mjs
          node qa_payroll_week_boundary_behavior_v1.mjs
          node qa_server_payroll_fixture_parity_v1.mjs
          node qa_server_night_single_premium_v1.mjs
          node qa_actual_attendance_store_scope_v1.mjs

  deploy:
    name: Deploy server-sync-sheet to production
    needs: payroll-qa
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Supabase Management API token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret. No production function was deployed."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy canonical checked-in Edge source (retain custom authentication)
        run: supabase functions deploy server-sync-sheet --project-ref waluhdgqhwjjwmflhrle --no-verify-jwt --use-api
      - name: Verify anonymous payroll calls are rejected
        run: |
          endpoint="https://waluhdgqhwjjwmflhrle.supabase.co/functions/v1/server-sync-sheet"
          status=$(curl -sS -o /tmp/payroll-probe.json -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' --data '{"mode":"payroll","ym":"2026-09","store_id":1}')
          if [ "$status" != '401' ] && [ "$status" != '403' ]; then
            echo "::error::Unauthenticated payroll probe expected 401/403, got $status"
            exit 1
          fi

      - name: Publish successful production deployment receipt
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,sha:context.sha,
              state:'success',context:'edge/server-sync-sheet-deploy',
              description:'Production Edge payroll deployed; anonymous access rejected'
            });
      - name: Publish failed production deployment receipt
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,sha:context.sha,
              state:'failure',context:'edge/server-sync-sheet-deploy',
              description:'Production payroll deployment failed; see Actions logs'
            });
