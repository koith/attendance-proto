name: Production payroll Edge deployment

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - 'payroll_contract_authority_v1.js'
      - 'qa_payroll_snapshot_components_v1.mjs'
      - '.github/workflows/deploy-server-payroll-edge.yml'
  pull_request:
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - 'payroll_contract_authority_v1.js'
      - 'qa_payroll_snapshot_components_v1.mjs'
      - '.github/workflows/deploy-server-payroll-edge.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-payroll-edge
  cancel-in-progress: false

jobs:
  payroll-qa:
    name: Payroll acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core payroll and Edge authorization tests
        run: |
          node qa_payroll_policy_adjustment_v1.mjs
          node qa_payroll_policy_scenarios_v1.mjs
          node qa_payroll_approval_engine_fixture_v1.mjs
          node qa_payroll_close_server_authority_v1.mjs
          node qa_payroll_snapshot_components_v1.mjs
          node qa_payroll_no_local_punch_close_v1.mjs
          node qa_monthly_segments_report_parity_v1.mjs
          node qa_monthly_contract_unpaid_segment_v1.mjs
          node qa_hourly_segments_sheet_parity_v1.mjs
          node qa_payroll_contract_transition_fail_closed_v1.mjs
          node qa_weekly_decision_end_to_end_v1.mjs
          node qa_payroll_won_truncation_v1.mjs
          node qa_payroll_weekly_substitution_boundary_v1.mjs
          node qa_payroll_weekly_integration_v1.mjs
          node qa_weekly_approval_rpc_guard_v1.mjs
          node qa_weekly_approval_service_boundary_v1.mjs
          node qa_weekly_cross_month_close_guard_v1.mjs
          node qa_weekly_scoped_close_lock_v1.mjs
          node qa_weekly_store_isolation_close_guard_v1.mjs
          node qa_payroll_month_boundary_v1.mjs
          node qa_monthly_contract_salary_authority_v1.mjs
          node qa_payroll_no_future_month_salary_v1.mjs
          node qa_payroll_week_boundary_behavior_v1.mjs
          node qa_server_payroll_fixture_parity_v1.mjs
          node qa_attendance_correction_tiebreak_v1.mjs
          node qa_sheet_working_payable_parity_v1.mjs
          node qa_sheet_monthly_minute_carry_v1.mjs
          node qa_sheet_snapshot_store_scope_v1.mjs
          node qa_server_night_single_premium_v1.mjs
          node qa_night_completed_only_allowance_v1.mjs
          node qa_night_pay_seconds_v1.mjs
          node qa_actual_attendance_store_scope_v1.mjs

  deploy:
    name: Attest Supabase native production deployment
    needs: payroll-qa
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require canonical and native Edge sources to match exactly
        run: node scripts/sync_supabase_native_edge_release.mjs --check
      - name: Await official Supabase GitHub App deployment of this commit
        uses: actions/github-script@v7
        with:
          script: |
            const attest = require('./ci_native_supabase_receipt.cjs');
            await attest({github,context,core});
      - name: Verify unauthenticated payroll calls are rejected
        run: |
          endpoint="https://waluhdgqhwjjwmflhrle.supabase.co/functions/v1/server-sync-sheet"
          status=$(curl -sS -o /tmp/payroll-probe.json -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' --data '{"mode":"payroll","ym":"2026-09","store_id":1}')
          if [ "$status" != '401' ] && [ "$status" != '403' ]; then
            echo "::error::Unauthenticated payroll probe expected 401/403, got $status"
            exit 1
          fi
      - name: Publish successful production deployment receipt
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,sha:context.sha,
              state:'success',context:'edge/server-sync-sheet-deploy',
              target_url:'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              description:'Official Supabase GitHub deploy succeeded; anonymous payroll rejected'
            });
      - name: Publish failed production deployment receipt
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,sha:context.sha,
              state:'failure',context:'edge/server-sync-sheet-deploy',
              target_url:'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              description:'Native Supabase Edge attestation failed; review release job'
            });
