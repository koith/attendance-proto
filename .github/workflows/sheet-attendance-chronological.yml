name: sheet-attendance-chronological
on:
  pull_request:
    paths: ['apps_script.gs','qa_sheet_attendance_chronological.mjs','.github/workflows/sheet-attendance-chronological.yml']
  push:
    branches: [main]
    paths: ['apps_script.gs','qa_sheet_attendance_chronological.mjs','.github/workflows/sheet-attendance-chronological.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa_sheet_attendance_chronological.mjs
