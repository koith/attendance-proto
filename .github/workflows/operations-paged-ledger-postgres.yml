name: operations-paged-ledger-postgres
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261015150500_operations_paged_real_demo_v1.sql'
      - 'qa_operations_paged_postgres.sql'
      - '.github/workflows/operations-paged-ledger-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261015150500_operations_paged_real_demo_v1.sql'
      - 'qa_operations_paged_postgres.sql'
      - '.github/workflows/operations-paged-ledger-postgres.yml'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: operations_paged_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_paged_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture_only
      PGDATABASE: operations_paged_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Exercise SQL pagination with 2505 fake rows and denied access
        run: psql -v ON_ERROR_STOP=1 -f qa_operations_paged_postgres.sql
