# One-off, read-only secret binding visibility check. Prints booleans only.
# No credentials are read by JavaScript, transmitted, or printed.
name: SEC credential bindings preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sec-backup-credential-presence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_PG_PASSWORD: ${{ secrets.PGPASSWORD != '' }}
      HAS_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN != '' }}
      HAS_SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN != '' }}
      HAS_SUPABASE_DB_CONNECTION_URL: ${{ secrets.SUPABASE_DB_CONNECTION_URL != '' }}
      HAS_SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL != '' }}
      HAS_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN != '' }}
      HAS_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' }}
      HAS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
      HAS_GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN != '' }}
      HAS_QA_GOOGLE_CLIENT_ID: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_ID != '' }}
      HAS_QA_GOOGLE_CLIENT_SECRET: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_SECRET != '' }}
      HAS_QA_GOOGLE_REFRESH_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_REFRESH_TOKEN != '' }}
    steps:
      - name: Report binding presence only, never values
        shell: bash
        run: |
          set -euo pipefail
          for key in ${!HAS_@}; do
            case "${!key}" in
              true|false) printf '%s=%s\n' "$key" "${!key}" ;;
              *) echo "INVALID_BOOLEAN_SENTINEL"; exit 1;;
            esac
          done | sort
          # All values are strictly boolean; never print the secret values.
          if [[ "$HAS_DB_URL" == true && "$HAS_SERVICE_ROLE_KEY" == true && "$HAS_SUPABASE_ACCESS_TOKEN" == true ]]; then
            echo 'BACKUP_REPO_BINDINGS_COMPLETE=true'
          else
            echo 'BACKUP_REPO_BINDINGS_COMPLETE=false'
          fi
          if [[ "$HAS_DATABASE_URL" == true || "$HAS_DB_PASSWORD" == true || "$HAS_PG_PASSWORD" == true || "$HAS_SUPABASE_DB_CONNECTION_URL" == true || "$HAS_SUPABASE_POOLER_URL" == true ]]; then
            echo 'DB_ALTERNATIVE_BINDING_CANDIDATE=true'
          else
            echo 'DB_ALTERNATIVE_BINDING_CANDIDATE=false'
          fi
          echo 'TRUE means repository-level binding accessible in this job; FALSE may be absent or environment-scoped. No environment secret names or secret contents were queried.' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe existing scoped Supabase PAT against read-only SQL API, HTTP status only
        shell: bash
        env:
          SEC_PROBE_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
        run: |
          set -euo pipefail
          if test -z "$SEC_PROBE_READ_TOKEN"; then
            echo 'MANAGEMENT_DB_READ_ONLY_HTTP=NO_TOKEN'
            exit 0
          fi
          # One SELECT constant only. Response body goes to /dev/null, never to logs or artifact.
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --retry 0 \
            --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SEC_PROBE_READ_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"query":"SELECT 1 AS probe"}' \
            'https://api.supabase.com/v1/projects/waluhdgqhwjjwmflhrle/database/query/read-only' 2>/dev/null || true)"
          case "$status" in
            201) echo 'MANAGEMENT_DB_READ_ONLY_HTTP=201';;
            401|403|404|429|500|000) echo "MANAGEMENT_DB_READ_ONLY_HTTP=$status";;
            *) echo 'MANAGEMENT_DB_READ_ONLY_HTTP=OTHER';;
          esac
