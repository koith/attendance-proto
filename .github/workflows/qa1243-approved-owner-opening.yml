name: QA1243 HQ-approved owner acceptance opens its store atomically
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261027070217_approved_owner_auto_opening.sql'
      - 'qa_store_owner_approved_opening.sql'
      - 'qa_store_owner_approved_opening.mjs'
      - 'scripts/qa1243_approved_opening_release.mjs'
      - 'tests/qa1243_approved_opening_release.test.mjs'
      - 'hq_owner_console.js'
      - 'hq_store_onboarding_ui.js'
      - 'owner_activation.js'
      - 'owner_temp_activation.js'
      - 'supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-approved-owner-opening.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261027070217_approved_owner_auto_opening.sql'
      - 'qa_store_owner_approved_opening.sql'
      - 'qa_store_owner_approved_opening.mjs'
      - 'scripts/qa1243_approved_opening_release.mjs'
      - 'tests/qa1243_approved_opening_release.test.mjs'
      - '.github/workflows/qa1243-approved-owner-opening.yml'
permissions:
  contents: read
jobs:
  approved-opening-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-fixture-password
          POSTGRES_DB: approved_owner_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: approved_owner_fixture
      PGUSER: postgres
      PGPASSWORD: isolated-fixture-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HQ approval, owner issue and read-only resend contracts
        run: node qa_store_owner_approved_opening.mjs
      - name: Strict owner-only release and no operating data mutation boundary
        run: node tests/qa1243_approved_opening_release.test.mjs
      - name: Execute actual migration and acceptance/cancel/revoke/retry cases in disposable PostgreSQL
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = approved_owner_fixture
          psql -X -v ON_ERROR_STOP=1 \
            -v opening_migration=supabase/migrations/20261027070217_approved_owner_auto_opening.sql \
            -f qa_store_owner_approved_opening.sql
      - name: Operating safety boundary
        if: always()
        run: echo 'Disposable local PostgreSQL only; no production Supabase credentials, mail, store activation, Google or Sheets requests.' >> "$GITHUB_STEP_SUMMARY"
