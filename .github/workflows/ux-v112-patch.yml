name: ux-v112-patch
on:
  push:
    branches: [chatgpt-ux-v1.1.2-iphone-final-repair]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1.2-iphone-final-repair
          fetch-depth: 1
      - name: Apply targeted repair
        run: python scripts/ux_v112_patch.py
      - name: Verify targeted repair
        run: |
          node --check daily_schedule.js
          node --check monthly_schedule.js
          node --check employment_contracts_v3.js
          node --check qa_ux_v111.mjs
          node --check qa_ux_v112.mjs
          node qa_ux_v112.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+koith@users.noreply.github.com
          git add index.html employment_contracts_v3.js daily_schedule.js daily_schedule.css monthly_schedule.js monthly_schedule.css qa_ux_v111.mjs qa_ux_v112.mjs .github/workflows/ia-ux-regression.yml
          git commit -m 'fix: repair final iPhone UX V1.1.2 issues'
          git push
