name: quick-fix-pack-3-patch
on:
  push:
    branches: [chatgpt-quick-fix-pack-3]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[qf3-patched]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-quick-fix-pack-3
      - name: Patch admin schedule order and employee numbering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps=[
          ('''    <button class="addbtn" id="adSched" style="margin-top:8px">📅 근무 스케줄 관리</button>\n    <button class="addbtn" id="adSchedMonth" style="margin-top:8px">🗓️ 월간 근무 스케줄</button>''',
           '''    <button class="addbtn" id="adSchedMonth" style="margin-top:8px">🗓️ 월간 근무 스케줄</button>\n    <button class="addbtn" id="adSched" style="margin-top:8px">📅 일별 근무 스케줄</button>'''),
          ('''  document.getElementById("quickSchedule").onclick=()=>{ location.href="daily_schedule.html"; };''',
           '''  document.getElementById("quickSchedule").onclick=()=>{ location.href="monthly_schedule.html"; };'''),
          ('''  const active=emps.filter(e=>e.is_active!==false && e.active!==false);''',
           '''  const active=emps.filter(e=>e.is_active!==false && e.active!==false).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ko-KR"));'''),
          ('''  // 직원 관리 목록\n  const empsEl=document.getElementById("adEmps"); empsEl.innerHTML="";\n  for(const e of active){\n    const div=document.createElement("div"); div.className="row";\n    div.innerHTML=`<div class="nm" style="flex:1">${e.name}</div>''',
           '''  // 직원 관리 목록\n  const empsEl=document.getElementById("adEmps"); empsEl.innerHTML="";\n  for(const [i,e] of active.entries()){\n    const div=document.createElement("div"); div.className="row";\n    const seq=String(i+1).padStart(2,"0");\n    div.innerHTML=`<div class="nm" style="flex:1"><span style="display:inline-block;min-width:30px;color:var(--text-muted);font-size:.78rem;font-variant-numeric:tabular-nums">${seq}</span>${e.name}</div>''')]
          for old,new in reps:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'expected exactly 1 match, got {count}: {old[:80]!r}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/quick-fix-pack-3-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html .github/workflows/quick-fix-pack-3-patch.yml
          git commit -m "Prioritize monthly schedule and number employees [qf3-patched]"
          git push origin HEAD:chatgpt-quick-fix-pack-3
