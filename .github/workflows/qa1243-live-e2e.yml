name: QA1243 isolated live production Edge GAS Sheets E2E
on:
  pull_request:
    paths:
      - 'scripts/qa1243_live_edge_gas_sheets.mjs'
      - 'scripts/qa1243_build_isolated_gas.mjs'
      - 'scripts/qa1243_oauth_scopes.mjs'
      - 'scripts/qa1243_mobile_token_contract.mjs'
      - 'qa1243_mobile_token_contract.test.mjs'
      - 'qa1243_mobile_safari_vm.test.mjs'
      - 'scripts/qa1243_mobile_http_smoke.mjs'
      - 'scripts/qa1243_safari_static_build.mjs'
      - 'scripts/qa1243_safari_static_build.test.mjs'
      - 'scripts/qa1243_safari_pages_smoke.mjs'
      - 'supabase/functions/qa1243-mobile-auth/**'
      - 'supabase/migrations/20261021221500_qa1243_mobile_one_time_session.sql'
      - 'scripts/qa1243_oauth_bootstrap.mjs'
      - 'scripts/qa1243_oauth_bootstrap.test.mjs'
      - 'QA1243_OAuth_Start.cmd'
      - 'qa1243_gas_foreign_workbook_guard.mjs'
      - '.github/workflows/verified-pages-deployment-notification.yml'
      - '.github/workflows/p0-pages-deploy.yml'
      - 'qa1243_pages_no_operating_write_guard.mjs'
      - 'qa1243_live_edge_gas_contract.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - 'supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-live-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa1243_live_edge_gas_sheets.mjs'
      - 'scripts/qa1243_build_isolated_gas.mjs'
      - 'scripts/qa1243_oauth_scopes.mjs'
      - 'scripts/qa1243_mobile_token_contract.mjs'
      - 'qa1243_mobile_token_contract.test.mjs'
      - 'qa1243_mobile_safari_vm.test.mjs'
      - 'scripts/qa1243_mobile_http_smoke.mjs'
      - 'scripts/qa1243_safari_static_build.mjs'
      - 'scripts/qa1243_safari_static_build.test.mjs'
      - 'scripts/qa1243_safari_pages_smoke.mjs'
      - 'supabase/functions/qa1243-mobile-auth/**'
      - 'supabase/migrations/20261021221500_qa1243_mobile_one_time_session.sql'
      - 'scripts/qa1243_oauth_bootstrap.mjs'
      - 'scripts/qa1243_oauth_bootstrap.test.mjs'
      - 'QA1243_OAuth_Start.cmd'
      - 'qa1243_gas_foreign_workbook_guard.mjs'
      - '.github/workflows/verified-pages-deployment-notification.yml'
      - '.github/workflows/p0-pages-deploy.yml'
      - 'qa1243_pages_no_operating_write_guard.mjs'
      - 'qa1243_live_edge_gas_contract.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - 'supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-live-e2e.yml'
permissions:
  contents: read
  statuses: read
  id-token: write
jobs:
  execution-scope:
    name: Verify explicit Auth-only Google reuse scope
    runs-on: ubuntu-latest
    outputs:
      run_live: ${{ steps.scope.outputs.run_live }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove Google reuse guard rejects operating changes
        run: node qa1243_google_rerun_guard.mjs
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const message=String(context.payload.head_commit?.message||'');
            let runLive=context.eventName==='push';
            if(runLive && message.includes('[QA1243-NO-GOOGLE-RERUN]')){
              if(!message.includes('[QA1243-NO-OPERATING-WRITE]'))throw Error('GOOGLE_REUSE_REQUIRES_NO_WRITE');
              const before=context.payload.before;
              if(!/^[a-f0-9]{40}$/.test(String(before||'')) || /^0{40}$/.test(before))throw Error('GOOGLE_REUSE_BASE_REQUIRED');
              const {data}=await github.rest.repos.compareCommits({...context.repo,base:before,head:context.sha,per_page:100});
              const allowed=new Set([
                'qa_auth_role_journey_1243.mjs','qa_auth_role_journey_1243.sql',
                '.github/workflows/qa1243-auth-role-journey.yml',
                'qa1243_pages_no_operating_write_guard.mjs','qa1243_google_rerun_guard.mjs',
                '.github/workflows/p0-pages-deploy.yml','.github/workflows/qa1243-live-e2e.yml',
                'PROJECT_BACKLOG_20261017.md'
              ]);
              const files=data.files||[];
              if(!files.length || files.length>=100 || files.some(f=>!allowed.has(f.filename)||f.status==='renamed'||f.status==='removed'))throw Error('GOOGLE_REUSE_SCOPE_REJECTED');
              runLive=false;
              core.info('Existing Google E2E proof reused; no OAuth/Edge/GAS/Sheets call for verified Auth-only change.');
            }
            core.setOutput('run_live',String(runLive));
  qa1243-mobile-safari-public-http:
    name: Supabase shared-domain HTML rewrite diagnostic GET POST query
    needs: execution-scope
    if: needs.execution-scope.outputs.run_live == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real credentialless HTTPS smoke - QA only, no DB or operating Sheets
        run: node scripts/qa1243_mobile_http_smoke.mjs
  qa1243-isolated-e2e:
    needs: execution-scope
    name: Trusted production Edge to a new independent GAS project and Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate integration runner and OIDC isolation contract
        run: |
          node --check scripts/qa1243_live_edge_gas_sheets.mjs
          node qa1243_live_edge_gas_contract.mjs
          node qa1243_gas_foreign_workbook_guard.mjs
          node qa1243_pages_no_operating_write_guard.mjs
          node scripts/qa1243_oauth_bootstrap.test.mjs
          node qa1243_mobile_token_contract.test.mjs
          node qa1243_mobile_safari_vm.test.mjs
          node scripts/qa1243_safari_static_build.test.mjs
      - name: Await verified native production Edge deployment of this exact revision
        if: github.event_name == 'push' && needs.execution-scope.outputs.run_live == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const contextName='edge/server-sync-sheet-deploy';
            // A docs/test-only follow-up SHA does not redeploy Edge. Resolve
            // the most recent ancestor commit that changed the native Edge
            // source and require its official production receipt to succeed.
            const {data:edgeCommits}=await github.rest.repos.listCommits({
              ...context.repo,sha:context.sha,path:'edge-release/supabase/functions/server-sync-sheet/index.ts',per_page:1
            });
            const edgeSha=edgeCommits[0]?.sha;
            if(!edgeSha)throw new Error('Could not resolve deployed Edge source ancestor');
            for(let attempt=0;attempt<35;attempt++){
              const {data}=await github.rest.repos.listCommitStatusesForRef({
                ...context.repo,ref:edgeSha,per_page:100
              });
              const receipt=data.find(x=>x.context===contextName);
              if(receipt?.state==='success'){
                core.info('PASS official Edge deployment attested at source SHA '+edgeSha+
                  ' (workflow SHA '+context.sha+')');
                return;
              }
              if(receipt?.state==='failure'||receipt?.state==='error'){
                throw new Error('Production Edge deployment receipt FAILED');
              }
              core.info('Production Edge deployment receipt not ready; checking again');
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Production Edge deployment not attested at this SHA');
      - name: Execute real new GAS project and production Edge service-to-service QA
        if: github.event_name == 'push' && needs.execution-scope.outputs.run_live == 'true'
        env:
          QA1243_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_ID }}
          QA1243_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_SECRET }}
          QA1243_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_REFRESH_TOKEN }}
          # QA Safari access-token path: short-lived, no refresh token, never logged.
          QA1243_GOOGLE_OAUTH_ACCESS_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_ACCESS_TOKEN }}
          # Optional. If empty, discover exact pre-created QA-only script from
          # verified QA OAuth Drive metadata. Never use the operating Script ID.
          QA1243_GAS_SCRIPT_ID: ${{ vars.QA1243_GAS_SCRIPT_ID }}
        run: |
          node scripts/qa1243_live_edge_gas_sheets.mjs
      - name: Explicit evidence limitation
        if: always()
        run: |
          echo 'No production test store or Auth account was created by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is live Edge→independent GAS→real Sheets synthetic-path QA, not real app user login or hosted SMTP delivery.' >> "$GITHUB_STEP_SUMMARY"
