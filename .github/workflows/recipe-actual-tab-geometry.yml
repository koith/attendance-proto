name: recipe actual tab geometry
on:
  pull_request:
    paths:
      - 'index.html'
      - 'recipe_access_v220.css'
      - 'recipe_access_v220.js'
      - 'qa_recipe_actual_tab_geometry.mjs'
      - 'qa_recipe_live_route_geometry.mjs'
      - 'qa_recipe_cross_page_desktop_geometry.mjs'
      - 'actual_attendance.css'
      - '.github/workflows/recipe-actual-tab-geometry.yml'
  workflow_dispatch:
jobs:
  geometry:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
        timeout-minutes: 4
      - run: npx playwright install chromium
        timeout-minutes: 5
      # GitHub Ubuntu images already carry Chrome's shared libraries. Probe the
      # actual browser first; apt is needed only when the probe proves otherwise.
      - name: Verify Linux browser libraries; bounded repair if missing
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'require("playwright").chromium.launch({headless:true}).then(b=>b.close()).catch(()=>process.exit(1))'; then
            echo 'Actual Chromium launch passed; system dependency update unnecessary.'
          else
            timeout 240 npx playwright install-deps chromium
            node -e 'require("playwright").chromium.launch({headless:true}).then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})'
          fi
      - run: node qa_recipe_actual_tab_geometry.mjs
      - run: node qa_recipe_live_route_geometry.mjs
      - run: node qa_recipe_cross_page_desktop_geometry.mjs
