name: juhyu-future-guard-v1-regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt-juhyu-future-guard-v1]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check qa_juhyu_future_guard_v1.mjs
      - name: Future juhyu guard QA
        run: node qa_juhyu_future_guard_v1.mjs
