name: ia-ux-regression
on:
  push:
    branches: [chatgpt-ux-v1.1-mobile-repair, chatgpt-ux-v1.1.1-mobile-polish, chatgpt-ux-v1.1.2-iphone-final-repair, chatgpt-ux-v1.1.2-abc-repair, chatgpt-ux-v1.1.2-iphone-smoke-repair, chatgpt-ux-v1.1.2-period-time-row-repair, chatgpt-senior-requirements-audit-contract-ia, chatgpt-contract-return-schedule-guard, chatgpt-ios-network-resume-schedule-repair, chatgpt-schedule-buttons-hotfix, chatgpt-monthly-date-select-hotfix, chatgpt-admin-monthly-ux-cleanup, chatgpt-schedule-visual-ux-repair, chatgpt-monthly-calendar-state-design, chatgpt-schedule-auth-badge-final]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check daily_schedule.js
          node --check employment_contracts_v3.js
          node --check employment_contracts_ia_v4.js
          node --check attendance_review.js
          node --check monthly_schedule.js
          node --check monthly_schedule_core.js
          node --check monthly_schedule_contract_guard.js
          node --check monthly_calendar_state_v1.js
          node --check schedule_admin_preflight.js
          node --check ios_navigation_resilience.js
          node --check no_double_tap_zoom.js
          node --check qa_ux_v11.mjs
          node --check qa_ux_v111.mjs
          node --check qa_ux_v112.mjs
          node --check qa_ux_v112_abc.mjs
          node --check qa_ux_v112_smoke.mjs
          node --check qa_ux_v112_period_time.mjs
          node --check qa_senior_audit_contract_ia.mjs
          node --check qa_contract_return_schedule_guard.mjs
          node --check qa_ios_network_resume_schedule.mjs
          node --check qa_schedule_buttons_hotfix.mjs
          node --check qa_monthly_date_select_hotfix.mjs
          node --check qa_admin_monthly_ux_cleanup.mjs
          node --check qa_schedule_visual_ux_repair.mjs
          node --check qa_monthly_calendar_state_v1.mjs
          node --check qa_schedule_auth_contract_badge.mjs
          node --check qa_employment_contract_v1.mjs
          node --check qa_extract_logic.mjs
      - name: UX V1.1 QA
        run: node qa_ux_v11.mjs
      - name: UX V1.1.1 QA
        run: node qa_ux_v111.mjs
      - name: UX V1.1.2 QA
        run: node qa_ux_v112.mjs
      - name: UX V1.1.2 ABC repair QA
        run: node qa_ux_v112_abc.mjs
      - name: UX V1.1.2 iPhone smoke QA
        run: node qa_ux_v112_smoke.mjs
      - name: UX V1.1.2 period/time-row repair QA
        run: node qa_ux_v112_period_time.mjs
      - name: Senior requirements audit and contract IA QA
        run: node qa_senior_audit_contract_ia.mjs
      - name: Contract return and schedule guard QA
        run: node qa_contract_return_schedule_guard.mjs
      - name: iOS network resume schedule QA
        run: node qa_ios_network_resume_schedule.mjs
      - name: Schedule button hotfix QA
        run: node qa_schedule_buttons_hotfix.mjs
      - name: Monthly date-select hotfix QA
        run: node qa_monthly_date_select_hotfix.mjs
      - name: Admin/monthly UX cleanup QA
        run: node qa_admin_monthly_ux_cleanup.mjs
      - name: Schedule visual UX repair QA
        run: node qa_schedule_visual_ux_repair.mjs
      - name: Monthly calendar state QA
        run: node qa_monthly_calendar_state_v1.mjs
      - name: Schedule auth + contract badge QA
        run: node qa_schedule_auth_contract_badge.mjs
      - name: Contract V1 QA
        run: node qa_employment_contract_v1.mjs
      - name: Monthly V1 QA
        run: node qa_month_schedule_v1.mjs
      - name: Monthly V1.1 QA
        run: node qa_month_schedule_v1_1.mjs
      - name: WorkSchedule QA
        run: node qa_work_schedule.mjs
      - name: Timezone QA
        run: node qa_timezone_v62.mjs
      - name: Overnight QA
        run: node qa_overnight.mjs
      - name: Extract current index logic
        run: node qa_extract_logic.mjs
      - name: Correction QA
        run: node qa_correction.js
      - name: Payroll Golden and regression
        run: |
          node qa_m85.js
          node qa_m85b.js
