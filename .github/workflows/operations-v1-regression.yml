name: operations-v1-regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node qa_boot_syntax.mjs
      - run: node qa_operations_v1.mjs
      - run: node qa_operations_sales_quick_filters_v1.mjs
      - run: node qa_operations_no_source_not_zero_v1.mjs
