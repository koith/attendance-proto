name: QA1243 owner first-login recovery regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'store_limited_manager.js'
      - 'store_manager_ui_v376.css'
      - 'qa_assistant_ux_v376.mjs'
      - 'store_manager_tab.js'
      - 'qa_assistant_permissions_browser_v375.mjs'
      - 'qa_assistant_attendance_browser_v375.mjs'
      - 'owner_temp_activation.js'
      - 'qa_owner_password_feedback_browser_1243.mjs'
      - 'qa_staff_stocktake_dialog_v374.mjs'
      - 'operations_staff_stocktake_v1.js'
      - 'operations_staff_stocktake_v1.css'
      - 'owner_activation.js'
      - 'owner_activation.html'
      - 'tests/qa1243_owner_recovery_paste.test.mjs'
      - 'owner_temp_activation.html'
      - 'tests/qa1243_owner_temp_retry.test.mjs'
      - 'tests/qa1243_owner_temp_session.test.mjs'
      - 'tests/qa1243_temp_owner_release.test.mjs'
      - 'scripts/qa1243_temp_owner_release.mjs'
      - '.github/workflows/qa1243-owner-temp-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-first-login-retry:
    name: Test password recovery retry and server preflight contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qa1243_owner_temp_retry.test.mjs tests/qa1243_owner_temp_session.test.mjs tests/qa1243_temp_owner_release.test.mjs tests/qa1243_owner_recovery_paste.test.mjs
      - name: Install pinned browser runtime
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Same password, new password and saved-response recovery on mobile and desktop
        run: node qa_owner_password_feedback_browser_1243.mjs
      - name: Staff inventory dialog layout and PIN isolation
        run: node qa_staff_stocktake_dialog_v374.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-password-feedback-browser
          path: |
            qa-results/owner-password-feedback-browser.json
            qa-results/staff-stocktake-dialog
            qa-results/owner-onboarding


  assistant-permissions-browser:
    name: Assistant management popup, grants, revocation and no payroll
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - run: node qa_admin_account_menu_v222.mjs
      - run: node qa_store_admin_tabs_policy_v1.mjs
      - run: node qa_assistant_permissions_browser_v375.mjs
      - run: node qa_assistant_ux_v376.mjs
      - run: node qa_assistant_attendance_browser_v375.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-permissions-browser
          path: |
            qa-results/assistant-permissions
            qa-results/assistant-ux-v376
            qa-results/assistant-attendance
