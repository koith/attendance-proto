name: qf7-elapsed-weeks-patch
on:
  push:
    branches: [chatgpt-payroll-elapsed-weeks-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-payroll-elapsed-weeks-v1
      - name: Patch current payroll week basis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function weeksInMonth(ym){\n  // 해당 월에 걸친 주(월요일 시작) 수를 근사 — 엑셀 관행상 보통 4주 사용\n  return 4; // V0.1: 매장 관행(4주 기준). 추후 실제 근무주 계산으로 확장.\n}'''
          new='''function weeksInMonth(ym){\n  // 과거월의 기존 4주 기준은 보존하되, 현재/미래월은 아직 끝나지 않은 주를 선반영하지 않는다.\n  return window.__payrollElapsedWeeksV1.completedWeeksInMonth(ym,kstNow());\n}'''
          if s.count(old)!=1:
              raise SystemExit(f'weeksInMonth marker count={s.count(old)}')
          s=s.replace(old,new,1)
          head='</head>'
          tag='<script src="payroll_elapsed_weeks_v1.js"></script>\n</head>'
          if 'payroll_elapsed_weeks_v1.js' not in s:
              if s.count(head)!=1: raise SystemExit(f'head marker count={s.count(head)}')
              s=s.replace(head,tag,1)
          p.write_text(s)
          PY
          rm .github/workflows/qf7_elapsed_weeks_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/qf7_elapsed_weeks_patch.yml
          git commit -m "Stop pre-booking future weekly allowance weeks"
          git push origin HEAD:chatgpt-payroll-elapsed-weeks-v1
