name: Invitation dispatch and activation preflight (#1243)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261020121000_invitation_dispatch_activation_preflight_1243.sql'
      - 'qa_invitation_preflight_1243.sql'
      - '.github/workflows/invitation-preflight-1243.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261020121000_invitation_dispatch_activation_preflight_1243.sql'
      - 'qa_invitation_preflight_1243.sql'
      - '.github/workflows/invitation-preflight-1243.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: invitation_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invitation_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: invitation_qa
    steps:
      - uses: actions/checkout@v4
      - name: Run real SQL functions with 100% disposable Auth/branch fixtures
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql -v ON_ERROR_STOP=1 -f qa_invitation_preflight_1243.sql
