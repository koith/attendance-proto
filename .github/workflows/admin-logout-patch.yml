name: admin-logout-patch
on:
  push:
    branches: [chatgpt-admin-logout]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-admin-logout
      - name: Patch admin logout control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="admin-quick-title"><b>빠른 메뉴</b></div>'
          new='<div class="admin-quick-title" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><b>빠른 메뉴</b><button type="button" class="btn btn-secondary" style="min-height:36px;padding:7px 12px" onclick="Auth.clear();location.reload()">로그아웃</button></div>'
          if old not in s:
              raise SystemExit('target not found')
          if s.count(old)!=1:
              raise SystemExit(f'unexpected target count: {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Self-remove patch workflow and commit
        run: |
          git rm .github/workflows/admin-logout-patch.yml
          git config user.name koith
          git config user.email 48688331+koith@users.noreply.github.com
          git add index.html
          git commit -m "Add admin logout control"
          git push origin HEAD:chatgpt-admin-logout
