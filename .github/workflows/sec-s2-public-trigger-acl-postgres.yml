name: SEC-S2 internal trigger anonymous EXECUTE restriction (PG16/17)
on:
  pull_request:
    paths:
      - 'security/sec_s2_anon_trigger_execute_hardening.sql'
      - 'qa/sec_s2_anon_trigger_execute_postgres.sql'
      - '.github/workflows/sec-s2-public-trigger-acl-postgres.yml'
      - 'scripts/security/no_operating_write_scope.mjs'
      - 'scripts/security/no_operating_write_scope.test.mjs'
  push:
    branches: [main]
    paths:
      - 'security/sec_s2_anon_trigger_execute_hardening.sql'
      - 'qa/sec_s2_anon_trigger_execute_postgres.sql'
      - '.github/workflows/sec-s2-public-trigger-acl-postgres.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Actual PostgreSQL ${{ matrix.pg }} anonymous ACL + trigger execution
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec_s2_synthetic_ci_only
          POSTGRES_DB: sec_s2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sec_s2_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: sec_s2_synthetic_ci_only
      PGDATABASE: sec_s2_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if absent
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: SEC-S2 exact grants removal, trigger survival, idempotency and unrelated public RPC
        run: psql -X -v ON_ERROR_STOP=1 -f qa/sec_s2_anon_trigger_execute_postgres.sql
      - name: Pure no-operating-write exact scope tests
        run: node --test scripts/security/no_operating_write_scope.test.mjs
