name: Release version guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove all public assets and badge are guarded
        run: node --test tests/release_version_guard.test.mjs
      - name: Reject unversioned published UI changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git diff --name-only "origin/$BASE_REF" HEAD > "$RUNNER_TEMP/changed-public-files.txt"
          git show "origin/$BASE_REF:index.html" > "$RUNNER_TEMP/base-release-index.html"
          node scripts/release_version_guard.mjs \
            "$RUNNER_TEMP/base-release-index.html" \
            index.html \
            "$RUNNER_TEMP/changed-public-files.txt"
