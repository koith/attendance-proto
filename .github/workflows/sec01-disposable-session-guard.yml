name: SEC-01 disposable session-guard integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261017050000_single_admin_session_guard_prepare.sql'
      - 'qa_admin_single_session_postgres.sql'
      - 'qa_admin_session_postgrest_setup.sql'
      - 'qa_admin_session_postgrest_http_v1.mjs'
      - '.github/workflows/sec01-disposable-session-guard.yml'
  push:
    branches: [feat/admin-single-device-session-992]
    paths:
      - 'supabase/migrations/20261017050000_single_admin_session_guard_prepare.sql'
      - 'qa_admin_single_session_postgres.sql'
      - 'qa_admin_session_postgrest_setup.sql'
      - 'qa_admin_session_postgrest_http_v1.mjs'
      - '.github/workflows/sec01-disposable-session-guard.yml'
permissions:
  contents: read
jobs:
  isolated-postgrest-session-guard:
    name: PostgREST pre-request sessions, POS guest, safe rollback
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Execute migration and synthetic auth claims in throwaway DB
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -f qa_admin_single_session_postgres.sql > /tmp/session-guard-fixture.log 2>&1 || {
            tail -n 100 /tmp/session-guard-fixture.log
            exit 1
          }
          tail -n 10 /tmp/session-guard-fixture.log
      - name: Preserve anonymous/admin session test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec01-disposable-postgres
          path: /tmp/session-guard-fixture.log
          if-no-files-found: warn

  http-pre-request:
    name: Real HTTP anonymous, admin and stale JWT revocation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare fresh PostgreSQL with purely synthetic sessions
        run: psql -d postgres -v ON_ERROR_STOP=1 -f qa_admin_session_postgrest_setup.sql
      - name: Start official PostgREST isolated HTTP server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sec01-postgrest --network host \
            -e PGRST_DB_URI='postgres://authenticator:synthetic-http-fixture-only@127.0.0.1:5432/postgres' \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_DB_PRE_REQUEST=session_guard.require_latest_session \
            -e PGRST_JWT_SECRET='synthetic-fixture-jwt-signing-secret-with-at-least-32-chars-2026' \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:3000/rpc/qa_session_http_probe' >/dev/null; then
              echo 'PostgREST ready with anon pre-request access'
              exit 0
            fi
            sleep 1
          done
          docker logs sec01-postgrest --tail 100
          exit 1
      - name: Exercise signed admin JWT rollover over actual HTTP
        run: node qa_admin_session_postgrest_http_v1.mjs
      - name: Show isolated server diagnostics only on failure
        if: failure()
        run: docker logs sec01-postgrest --tail 120
