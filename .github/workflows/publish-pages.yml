name: Publish GitHub Pages
# Recovery publisher only; main commits use the P0 Pages release workflow.
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  browser-qa:
    name: Browser QA before Pages publication
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate startup and runtime JavaScript
        run: |
          node qa_boot_syntax.mjs
          node qa_runtime_asset_syntax_v1.mjs
          node --check version_test_toggle_982.js
          node --check test_mode_ui_v1.js
      - name: Install real Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Gate Pages publishing on store-opening end-to-end regression (#1000)
        run: |
          node qa_store_opening_matrix_v1.mjs
          node qa_store_opening_browser_v1.mjs
      - name: Verify real test UI toggle on mobile and desktop
        run: node qa_version_test_controls_browser_v1.mjs
  publish:
    needs: browser-qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Require matching successful P0 gate for manual release
        uses: actions/github-script@v7
        with:
          script: |
            const main=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(main.data.object.sha!==context.sha)throw Error('STALE_MANUAL_RELEASE');
            const runs=await github.rest.actions.listWorkflowRuns({
              ...context.repo,workflow_id:'p0-pages-deploy.yml',head_sha:context.sha,per_page:50
            });
            let verified=false;
            for(const run of runs.data.workflow_runs){
              if(run.head_sha!==context.sha||run.event!=='push')continue;
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
                ...context.repo,run_id:run.id,per_page:100
              });
              const pass=name=>jobs.some(j=>j.name===name&&j.conclusion==='success');
              if(pass('P0 deployment gate')&&pass('Build Pages artifact'))verified=true;
            }
            if(!verified)throw Error('MANUAL_PAGES_P0_GATE_MISSING');
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'const APP_VERSION="v[0-9]+\.[0-9]+";' index.html
          echo "Publishing $(grep -oE 'const APP_VERSION="v[0-9]+\.[0-9]+";' index.html | head -1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages version (not merely artifact)
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected=$(sed -n 's/.*const APP_VERSION="\(v[0-9][0-9.]*\)".*/\1/p' index.html | head -1)
          test -n "$expected"
          url="${PAGES_URL%/}/index.html"
          echo "Expected version: $expected"
          echo "Live URL: $url"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$url?release=${GITHUB_SHA}&attempt=$attempt" -o /tmp/live-pages.html; then
              actual=$(sed -n 's/.*const APP_VERSION="\(v[0-9][0-9.]*\)".*/\1/p' /tmp/live-pages.html | head -1)
              echo "Attempt $attempt: live=${actual:-missing} expected=$expected"
              if [[ "$actual" == "$expected" ]]; then
                echo "Verified deployed version $expected at $url"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::GitHub Pages did not serve expected version $expected after 10 minutes"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for actual published-page acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify live published test controls by real pointer clicks
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_live_version_test_controls_v1.mjs

