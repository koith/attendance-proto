name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'const APP_VERSION="v[0-9]+\.[0-9]+";' index.html
          echo "Publishing $(grep -oE 'const APP_VERSION="v[0-9]+\.[0-9]+";' index.html | head -1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
