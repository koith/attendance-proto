# QA1243 release sentinel: isolated synthetic tests; never production mail/Sheets writes.
name: QA1243 isolated Google mail bridge (synthetic QA + GAS provisioning)
on:
  workflow_dispatch:
    inputs:
      provision:
        description: 'Deploy existing QA-only GAS source (requires valid Google OAuth secrets; never sends email)'
        required: true
        type: boolean
        default: false
  # Live network probe also runs automatically on main after synthetic tests.
  # Invalid JSON cannot send email; no OAuth or Supabase credentials needed.
  pull_request:
    paths:
      - 'supabase/functions/qa1243-google-mail-bridge/**'
      - 'gas/qa1243-auth-mail/**'
      - 'qa/qa1243_google_mail_bridge.test.mjs'
      - 'qa/qa1243_mail_connectivity.test.mjs'
      - 'supabase/functions/qa1243-mobile-auth/**'
      - 'qa/qa1243_mobile_oauth_prefill.test.mjs'
      - '.github/workflows/qa1243-google-mail-bridge.yml'
      - 'scripts/qa1243_gas_post_connectivity.mjs'
      - 'scripts/qa1243_repair_mail_gas.mjs'
      - 'qa/qa1243_repair_mail_gas.test.mjs'
      - 'qa/fixtures/qa1243_mail_gas_v1.json'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/qa1243-google-mail-bridge/**'
      - 'gas/qa1243-auth-mail/**'
      - 'qa/qa1243_google_mail_bridge.test.mjs'
      - 'qa/qa1243_mail_connectivity.test.mjs'
      - 'supabase/functions/qa1243-mobile-auth/**'
      - 'qa/qa1243_mobile_oauth_prefill.test.mjs'
      - '.github/workflows/qa1243-google-mail-bridge.yml'
      - 'scripts/qa1243_gas_post_connectivity.mjs'
      - 'scripts/qa1243_repair_mail_gas.mjs'
      - 'qa/qa1243_repair_mail_gas.test.mjs'
      - 'qa/fixtures/qa1243_mail_gas_v1.json'
permissions:
  contents: read
jobs:
  synthetic-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed-hook, exact Korean HTML, secure email-change and GAS dedup
        run: node --test qa/qa1243_google_mail_bridge.test.mjs
      - name: Verify no-mail HMAC, redirect isolation and GitHub identity
        run: node qa/qa1243_mail_connectivity.test.mjs
      - name: Verify existing QA deployment upgrade, readback and drift protection
        run: node qa/qa1243_repair_mail_gas.test.mjs
      - name: Verify isolated Safari OAuth helper security and client ID defaults
        run: node --test qa/qa1243_mobile_oauth_prefill.test.mjs
      - name: Proof of zero operating writes
        run: |
          echo 'This synthetic test job makes no production writes. A separate main-only job may provision the standalone QA GAS source; it never enables Auth Hook or sends email.' >> "$GITHUB_STEP_SUMMARY"

  isolated-gas-post-connectivity:
    name: QA1243 isolated GAS POST connectivity (no mail)
    needs: synthetic-security-tests
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.provision == false)))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm malformed POST reaches isolated GAS doPost without sending mail
        run: node scripts/qa1243_gas_post_connectivity.mjs
      - name: Verify signed no-mail request and duplicate through isolated Edge
        if: github.ref == 'refs/heads/main' || github.event.pull_request.number == 1361
        env:
          QA1243_VERIFY_SIGNED_CONNECTIVITY: 'true'
        run: node scripts/qa1243_gas_post_connectivity.mjs
  isolated-gas-provision:
    name: QA1243 isolated Google MailApp script provisioning (no email)
    needs: synthetic-security-tests
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[QA1243-MAIL-GAS-DEPLOY]')) || (github.event_name == 'workflow_dispatch' && inputs.provision == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa1243/probe-pr-merge-gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      QA1243_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_ID }}
      QA1243_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_SECRET }}
      QA1243_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_REFRESH_TOKEN }}
      QA1243_GOOGLE_OAUTH_ACCESS_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade the exact existing QA GAS deployment and verify immutable readback
        run: |
          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';
          import {repairExistingMailGas} from './scripts/qa1243_repair_mail_gas.mjs';
          import {QA1243_RUNNER_SCOPES,assertQa1243RunnerScopes} from './scripts/qa1243_oauth_scopes.mjs';
          
          // Exact QA-only name. Never share or overwrite the existing payroll GAS project.
          const title='QA1243 isolated Auth MailApp 2026-10-24';
          const owner='webuielf@gmail.com';
          const expectedScriptId='1fOm-aIyhbqv5SkCkLoJNdFIlBxdGUUhHy8wO7Ft_SF-KF5iQWTvGChNT';
          const req=['QA1243_GOOGLE_OAUTH_CLIENT_ID','QA1243_GOOGLE_OAUTH_CLIENT_SECRET','QA1243_GOOGLE_OAUTH_REFRESH_TOKEN'];
          const desktopReady=req.every(k=>Boolean(process.env[k]));
          const mobileAccess=String(process.env.QA1243_GOOGLE_OAUTH_ACCESS_TOKEN||'').trim();
          if(!desktopReady&&!mobileAccess)throw Error('QA1243_MAIL_GAS_GOOGLE_OAUTH_CREDENTIAL_ABSENT');
          const badPrefix='QA1243_MAIL_GAS_';
          async function call(url,opt={}){
            let response;
            try{response=await fetch(url,{...opt,redirect:'error',signal:AbortSignal.timeout(30000)});}
            catch{throw Error(badPrefix+'NETWORK_FAILURE');}
            if(!response.ok)throw Error(badPrefix+'API_HTTP_'+response.status);
            try{return await response.json();}
            catch{throw Error(badPrefix+'INVALID_API_JSON');}
          }
          let access;
          if(desktopReady){
           const refreshed=await call('https://oauth2.googleapis.com/token',{
            method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({
             client_id:process.env.QA1243_GOOGLE_OAUTH_CLIENT_ID,
             client_secret:process.env.QA1243_GOOGLE_OAUTH_CLIENT_SECRET,
             refresh_token:process.env.QA1243_GOOGLE_OAUTH_REFRESH_TOKEN,grant_type:'refresh_token'
            })
           });
           access=refreshed.access_token;
           console.log('QA1243_MAIL_GAS_OAUTH_DESKTOP_REFRESH');
          }else{
           access=mobileAccess;
           console.log('QA1243_MAIL_GAS_OAUTH_EPHEMERAL_FALLBACK');
          }
          assert.ok(access,badPrefix+'ACCESS_TOKEN_ABSENT');
          const authHeader={Authorization:'Bearer '+access};
          const headers={...authHeader,'content-type':'application/json'};
          let identity;
          try{identity=await call('https://www.googleapis.com/oauth2/v3/userinfo',{headers:authHeader});}
          catch(err){
           if(!desktopReady)throw Error(badPrefix+'EPHEMERAL_TOKEN_EXPIRED_OR_INVALID');
           throw err;
          }
          if(String(identity.email||'').toLowerCase()!==owner||identity.email_verified!==true)
           throw Error(badPrefix+'OWNER_MISMATCH');
          let granted;
          try{
           granted=await call('https://www.googleapis.com/oauth2/v2/tokeninfo',{
            method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({access_token:access})
           });
          }catch(err){
           if(!desktopReady)throw Error(badPrefix+'EPHEMERAL_TOKEN_EXPIRED_OR_INVALID');
           throw err;
          }
          assertQa1243RunnerScopes(granted.scope);
          if(!desktopReady && (!Number.isFinite(Number(granted.expires_in))||Number(granted.expires_in)<360))
           throw Error(badPrefix+'EPHEMERAL_TOKEN_EXPIRED_OR_SHORT_LIVED');
          assert.equal(QA1243_RUNNER_SCOPES.length,5);
          console.log('QA1243_MAIL_GAS_OWNER_AND_SCOPES_VERIFIED');
          
          const result=await repairExistingMailGas({call,authHeader,headers});
          console.log('QA1243_MAIL_GAS_DEPLOYMENT_READBACK '+JSON.stringify(result));
          NODE
