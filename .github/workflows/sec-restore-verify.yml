name: SEC restore verify (isolated, synthetic)
on:
  pull_request:
    paths:
      - 'scripts/security/**'
      - 'qa/security/fake_storage_server.mjs'
      - '.github/workflows/sec-restore-verify.yml'
      - '.github/workflows/sec-backup-capture.yml'
      - 'qa/security/backup_dispatch_guard.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic capture -> sealed -> disposable-cluster restore -> inventory compare; key drill; plan order
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          RESTORE_VERIFY_EVIDENCE: ${{ runner.temp }}/restore-verify-report.json
        run: |
          test -x "$PG_BIN/initdb"
          node --test scripts/security/recovery/restore_verify.test.mjs \
            scripts/security/recovery/key_custody.test.mjs \
            scripts/security/recovery/recovery_plan.test.mjs \
            scripts/security/recovery/verify_backup_completeness.test.mjs \
            qa/security/backup_dispatch_guard.test.mjs
          node -e "const r=require(process.argv[1]);if(r.result!=='PASS')process.exit(1);console.log('restore_verify',r.result,r.stages.map(s=>s.stage+':'+s.ok).join(' '))" "$RESTORE_VERIFY_EVIDENCE"
      - name: Repository key custody check (names/fingerprints only)
        run: node scripts/security/recovery/key_custody.mjs check .

  restore-verify-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated PG17 plus Node runtime from official container images
        shell: bash
        run: |
          set -euo pipefail
          docker build -t attendance-pg17-restore-qa -f - . <<'DOCKERFILE'
          FROM node:22-trixie-slim AS node
          FROM postgres:17-trixie
          COPY --from=node /usr/local/bin/node /usr/local/bin/node
          RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/* \
              && git --version && node --version && /usr/lib/postgresql/17/bin/pg_dump --version
          DOCKERFILE
      - name: Synthetic capture, sealed archive, disposable restore, source-snapshot comparison (PG17)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user postgres --pids-limit 256 --memory 1g \
            --tmpfs /tmp:rw,nosuid,size=512m \
            -v "$PWD":/src:ro -w /src \
            -e PG_BIN=/usr/lib/postgresql/17/bin \
            -e RESTORE_VERIFY_EVIDENCE=/tmp/restore-verify-pg17-report.json \
            --entrypoint /bin/bash attendance-pg17-restore-qa -ec '
              node --test scripts/security/recovery/restore_verify.test.mjs \
                scripts/security/recovery/key_custody.test.mjs \
                scripts/security/recovery/recovery_plan.test.mjs \
                scripts/security/recovery/verify_backup_completeness.test.mjs \
                qa/security/backup_dispatch_guard.test.mjs
              node -e "const r=require(process.argv[1]);if(r.result!==String.fromCharCode(80,65,83,83))process.exit(1);console.log(r.result,r.stages.length)" "$RESTORE_VERIFY_EVIDENCE"
            '
