name: QA1243 SEC01 real-session preactivation proof
on:
  pull_request:
    paths:
      - 'scripts/qa1243_sec01/**'
      - '.github/workflows/qa1243-sec01-preactivation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa1243_sec01/**'
      - '.github/workflows/qa1243-sec01-preactivation.yml'
permissions:
  contents: read
jobs:
  isolated-real-sessions:
    name: New SEC01 login rollover, logout, staff and real config rollback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec01-local-only
          POSTGRES_DB: qa1243_sec01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa1243_sec01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QA_SEC01_JWT_SECRET: 'sec01-ephemeral-local-runner-only-signing-fixture-20261023'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: qa1243_sec01
      PGPASSWORD: sec01-local-only
      PGOPTIONS: '-c qa1243.local_fixture=SEC01_LOCAL_CI_ONLY'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local-only real Auth session test
        run: node --check scripts/qa1243_sec01/real_auth.mjs
      - name: Start new disposable official Auth JWT issuer without SMTP
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA auth;'
          psql -X -v ON_ERROR_STOP=1 -c 'ALTER DATABASE qa1243_sec01 SET search_path=auth,public;'
          docker run -d --name qa1243-sec01-auth --network host \
            -e GOTRUE_API_HOST=0.0.0.0 -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_SITE_URL=http://127.0.0.1:3000 \
            -e GOTRUE_DB_DRIVER=postgres -e GOTRUE_DB_NAMESPACE=auth \
            -e GOTRUE_DB_DATABASE_URL=postgres://postgres:sec01-local-only@127.0.0.1:5432/qa1243_sec01 \
            -e GOTRUE_JWT_SECRET="$QA_SEC01_JWT_SECRET" \
            -e GOTRUE_JWT_ADMIN_ROLES=service_role -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_DISABLE_SIGNUP=true -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            supabase/gotrue:v2.197.0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9999/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install staged guard into localhost-only disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/qa1243_sec01/setup.sql
      - name: Start PostgREST with role-sourced config, no pre-request environment override
        run: |
          set -euo pipefail
          docker run -d --name qa1243-sec01-rest --network host \
            -e PGRST_DB_URI=postgres://authenticator:sec01-local-only@127.0.0.1:5432/qa1243_sec01 \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon -e PGRST_DB_CONFIG=true \
            -e PGRST_JWT_SECRET="$QA_SEC01_JWT_SECRET" -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.12
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify new-device JWT rejection, logout and actual rollback over HTTP
        run: node scripts/qa1243_sec01/real_auth.mjs
      - name: Preserve individual new security scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec01-real-session-preactivation
          path: qa-results/sec01-preactivation.json
          if-no-files-found: warn
      - name: Destroy local containers and record production boundary
        if: always()
        run: |
          docker rm -f qa1243-sec01-auth qa1243-sec01-rest || true
          echo 'Only new SEC01 local login/refresh/logout/config rollback scenarios. No prior owner/SMTP E2E or Google replay. No production activation.' >> "$GITHUB_STEP_SUMMARY"
