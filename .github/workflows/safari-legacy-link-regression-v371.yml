name: Safari legacy link browser regression v0.371
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app_release_probe_v1.js'
      - 'qa_legacy_entry_browser_v372.mjs'
      - 'tests/qa1243_release_probe.test.mjs'
      - 'tests/qa1243_legacy_entry_release.test.mjs'
      - 'scripts/qa1243_legacy_entry_release.mjs'
      - 'qa_safari_legacy_links_webkit_v371.mjs'
      - 'qa_safari_existing_link_stale_session_v371.test.mjs'
      - '.github/workflows/safari-legacy-link-regression-v371.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app_release_probe_v1.js'
      - 'qa_legacy_entry_browser_v372.mjs'
      - 'tests/qa1243_release_probe.test.mjs'
      - 'tests/qa1243_legacy_entry_release.test.mjs'
      - 'scripts/qa1243_legacy_entry_release.mjs'
      - 'qa_safari_legacy_links_webkit_v371.mjs'
      - 'qa_safari_existing_link_stale_session_v371.test.mjs'
      - '.github/workflows/safari-legacy-link-regression-v371.yml'
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser harness
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Rehydrate immutable historic legacy release fixture
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin db1897424683
          python3 - <<'PYFIXTURE'
          import json,re,subprocess
          from pathlib import Path
          source=Path('scripts/qa1243_legacy_entry_release.mjs').read_text()
          m=re.search(r'export const LEGACY_BYTES=Object\.freeze\((\{[^;]+\})\);',source)
          if not m: raise RuntimeError('FROZEN_LEGACY_RELEASE_MANIFEST_MISSING')
          paths=json.loads(m.group(1))
          historic={p:subprocess.check_output(['git','show','db1897424683:'+p]).decode() for p in paths}
          Path('/tmp/qa1243-legacy-release-fixture.json').write_text(json.dumps(historic))
          PYFIXTURE
      - name: Node startup and Auth isolation tests
        run: |
          node qa_index_startup_smoke_v1.mjs
          node --test qa_safari_existing_link_stale_session_v371.test.mjs tests/qa1243_release_probe.test.mjs tests/qa1243_legacy_entry_release.test.mjs
      - name: Reproduce actual iPhone-sized WebKit legacy bookmark after expired admin login
        run: node qa_safari_legacy_links_webkit_v371.mjs
      - name: Legacy HQ and Inha recovery on both browser engines
        run: node qa_legacy_entry_browser_v372.mjs
      # One-time evidence correction: pinned existing Pages release, no app deployment.
      - name: Actual Hosted rejected-refresh recovery on the already deployed v0.373
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/qa1243-live-refresh-fixture'
        run: |
          GITHUB_SHA=7087f7c1c9ffaa3f1e09e91ebc0f4a57d7383265 node scripts/qa1243_legacy_pages_readback.mjs
          QA1243_HARNESS_SHA="${{ github.event.pull_request.head.sha }}" GITHUB_SHA=7087f7c1c9ffaa3f1e09e91ebc0f4a57d7383265 node qa_legacy_entry_browser_v372.mjs --live
      - name: Retain exact case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-entry-fixture-proof
          path: |
            qa-results/legacy-entry-v372-fixture.json
            qa-results/legacy-entry-v372-live.json
            qa-results/legacy-entry-public-readback.json
      - name: Operate without access to production data
        if: always()
        run: echo 'The WebKit harness serves local Pages files and intercepts all external network. Production Auth and store database are not accessed or written.' >> "$GITHUB_STEP_SUMMARY"
