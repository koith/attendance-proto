name: operations-real-ledger-export-integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261012200500_operations_real_ledger_export.sql'
      - 'qa_operations_real_ledger_export_integration.sql'
      - '.github/workflows/operations-real-ledger-export-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012200500_operations_real_ledger_export.sql'
      - 'qa_operations_real_ledger_export_integration.sql'
      - '.github/workflows/operations-real-ledger-export-integration.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: operations_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_fixture_only
      PGDATABASE: operations_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Test actual finance export RPC with synthetic store and HQ roles
        run: psql -v ON_ERROR_STOP=1 -f qa_operations_real_ledger_export_integration.sql
