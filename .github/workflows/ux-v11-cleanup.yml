name: ux-v11-cleanup
on:
  push:
    branches: [chatgpt-ux-v1.1-mobile-repair]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1-mobile-repair
          fetch-depth: 1
      - name: Normalize targeted patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          quick='''    <section class="admin-quick" aria-label="빠른 메뉴">\n      <div class="admin-quick-title"><b>빠른 메뉴</b></div>\n      <div class="admin-quick-grid">\n        <button type="button" id="quickSchedule"><span>📅</span><b>스케줄</b></button>\n        <button type="button" id="quickEmployees"><span>👤</span><b>직원</b></button>\n        <button type="button" id="quickContracts"><span>💼</span><b>계약</b></button>\n        <button type="button" id="quickDocs"><span>📄</span><b>계약서</b></button>\n      </div>\n      <a class="admin-review-link" href="attendance_review.html">근태 확인 <span>›</span></a>\n    </section>\n'''
          pattern=r'(?:    <section class="admin-quick" aria-label="빠른 메뉴">.*?    </section>\n)+    <div id="adReqSection"></div>\n'
          s,n=re.subn(pattern,quick+'    <div id="adReqSection"></div>\n',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('quick menu normalization anchor missing')
          p.write_text(s)
          p=Path('employment_contracts.css'); s=p.read_text()
          old='button,input,select,textarea{font:inherit;box-sizing:border-box;max-width:100%;min-width:0}'
          new='button,input,select,textarea{font:inherit;box-sizing:border-box;max-width:100%;min-width:0;touch-action:manipulation}'
          if old in s:s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('employment touch anchor missing')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          test "$(grep -o 'id="quickSchedule"' index.html | wc -l)" -eq 1
          grep -n 'touch-action:manipulation' employment_contracts.css
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+koith@users.noreply.github.com
          git add index.html employment_contracts.css
          git commit -m 'fix: normalize admin quick menu and touch policy'
          git push
