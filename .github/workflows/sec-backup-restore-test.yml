name: SEC backup envelope and isolated PostgreSQL restore
on:
  pull_request:
    paths:
      - 'scripts/security/seal.mjs'
      - 'scripts/security/unseal.mjs'
      - 'security/recipient_20261103.pub.pem'
      - '.github/workflows/sec-backup-restore-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/security/seal.mjs'
      - 'scripts/security/unseal.mjs'
      - 'security/recipient_20261103.pub.pem'
      - '.github/workflows/sec-backup-restore-test.yml'
permissions:
  contents: read
jobs:
  isolated-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert standalone encrypted envelope scripts parse
        run: |
          node --check scripts/security/seal.mjs
          node --check scripts/security/unseal.mjs
      - name: Synthetic complete PostgreSQL 17 dump and isolated re-creation
        run: |
          set -euo pipefail
          docker run -d --name sec-restore-pg17 -p 55432:5432 -e POSTGRES_PASSWORD=synthetic_qa_only postgres:17-alpine
          for i in {1..40}; do
            if docker exec sec-restore-pg17 pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec sec-restore-pg17 psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS backup_fixture;'
          docker exec sec-restore-pg17 psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_fixture.sample(id integer PRIMARY KEY, payload text NOT NULL);"
          docker exec sec-restore-pg17 psql -U postgres -v ON_ERROR_STOP=1 -c "INSERT INTO backup_fixture.sample VALUES (1,'synthetic'),(2,'private-fixture');"
          docker exec sec-restore-pg17 pg_dump -U postgres -Fc -f /tmp/qa.dump -d postgres
          docker cp sec-restore-pg17:/tmp/qa.dump qa.dump
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out qa-private.pem 2>/dev/null
          openssl pkey -in qa-private.pem -pubout -out qa-public.pem
          node scripts/security/seal.mjs qa.dump qa-public.pem qa.dump.sealed
          test -f qa.dump.sealed
          node scripts/security/unseal.mjs qa.dump.sealed qa-private.pem qa-restored.dump
          cmp qa.dump qa-restored.dump
          docker exec sec-restore-pg17 psql -U postgres -c 'CREATE DATABASE sec_restore_qa;'
          docker cp qa-restored.dump sec-restore-pg17:/tmp/qa-restored.dump
          docker exec sec-restore-pg17 pg_restore -U postgres -d sec_restore_qa --no-owner --no-acl --exit-on-error /tmp/qa-restored.dump
          test "$(docker exec sec-restore-pg17 psql -U postgres -d sec_restore_qa -Atc 'select count(*) from backup_fixture.sample;')" = '2'
          node -e "const fs=require('fs');const p='qa.dump.sealed';const b=fs.readFileSync(p);b[b.length-20]^=1;fs.writeFileSync('qa-tampered.sealed',b);"
          if node scripts/security/unseal.mjs qa-tampered.sealed qa-private.pem qa-tampered.dump; then
            echo 'CRITICAL: modified ciphertext passed authentication'; exit 1;
          fi
          test ! -f qa-tampered.dump
          echo 'PASS isolated dump/restore; AES-GCM integrity rejects tampered ciphertext; no production data used'
      - name: End-to-end source DB and private Storage object archive, then isolated restore
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          docker exec sec-restore-pg17 psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA auth; CREATE SCHEMA storage; CREATE TABLE auth.users(id uuid PRIMARY KEY,email text); CREATE TABLE storage.objects(bucket_id text,name text,metadata jsonb,updated_at timestamptz);'
          docker exec sec-restore-pg17 psql -U postgres -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users VALUES ('11111111-1111-1111-1111-111111111111','test@example.invalid'); INSERT INTO storage.objects VALUES ('fixture','one.txt','{\"size\":14}',now());"
          node qa/security/fake_storage_server.mjs > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          export SUPABASE_DB_URL='postgresql://postgres:synthetic_qa_only@127.0.0.1:55432/postgres?sslmode=disable'
          export SUPABASE_URL='http://127.0.0.1:4100'
          export SUPABASE_SERVICE_ROLE_KEY='synthetic-storage-only'
          export SEC_BACKUP_RECIPIENT_PEM='qa-public.pem'
          export SEC_BACKUP_OUT='qa-end-to-end.sealed'
          node --check scripts/security/capture.mjs
          node scripts/security/capture.mjs
          node scripts/security/unseal.mjs qa-end-to-end.sealed qa-private.pem qa-end-to-end.tar.gz
          mkdir -p qa-unpacked
          tar -xzf qa-end-to-end.tar.gz -C qa-unpacked
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const meta=JSON.parse(readFileSync('qa-unpacked/manifest.json'));
          if(meta.storage.length!==1||meta.full_storage_count!==1)throw Error('STORAGE_OBJECT_COUNT_MISMATCH');
          const stored=readFileSync('qa-unpacked/'+meta.storage[0].file);
          if(stored.toString()!=='synthetic-only')throw Error('STORAGE_BYTE_MISMATCH');
          if(createHash('sha256').update(stored).digest('hex')!==meta.storage[0].sha256)throw Error('STORAGE_HASH_MISMATCH');
          NODE
          docker exec sec-restore-pg17 psql -U postgres -c 'CREATE DATABASE sec_capture_restore;'
          docker cp qa-unpacked/database.dump sec-restore-pg17:/tmp/captured.dump
          docker exec sec-restore-pg17 pg_restore -U postgres -d sec_capture_restore --no-owner --no-acl --exit-on-error /tmp/captured.dump
          test "$(docker exec sec-restore-pg17 psql -U postgres -d sec_capture_restore -Atc 'SELECT count(*) FROM auth.users;')" = '1'
          test "$(docker exec sec-restore-pg17 psql -U postgres -d sec_capture_restore -Atc 'SELECT count(*) FROM storage.objects;')" = '1'
          echo 'PASS synthetic DB/Auth rows + Storage bytes/hash, sealed archive and isolated restore'
      - name: Verify release never includes test secrets
        run: |
          test ! -f security/recipient_20261103.private.pem
          test -s security/recipient_20261103.pub.pem
