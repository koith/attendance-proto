name: juhyu-future-guard-patch
on:
  push:
    branches: [chatgpt-juhyu-future-guard-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-juhyu-future-guard-v1
      - name: Patch elapsed payroll weeks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function weeksInMonth(ym){\n  // 해당 월에 걸친 주(월요일 시작) 수를 근사 — 엑셀 관행상 보통 4주 사용\n  return 4; // V0.1: 매장 관행(4주 기준). 추후 실제 근무주 계산으로 확장.\n}'''
          new='''function weeksInMonth(ym){\n  // Quick Fix: 기존 4주 관행은 과거월에 유지하되, 현재/미래월의 미경과 주휴를 선반영하지 않는다.\n  const now=kstNow(); const p=n=>String(n).padStart(2,"0");\n  const currentYm=`${now.getFullYear()}-${p(now.getMonth()+1)}`;\n  if(ym<currentYm) return 4;\n  if(ym>currentYm) return 0;\n  const [y,m]=ym.split("-").map(Number);\n  let completed=0;\n  for(let d=1; d<now.getDate(); d++){\n    if(new Date(y,m-1,d).getDay()===0) completed++;\n  }\n  return Math.min(4,completed);\n}'''
          if old not in s:
              raise SystemExit('weeksInMonth target not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/juhyu-future-guard-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html .github/workflows/juhyu-future-guard-patch.yml
          git commit -m "Guard payroll against future juhyu weeks"
          git push
