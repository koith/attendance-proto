name: SEC offline PostgreSQL WASM recovery runtime
on:
  pull_request:
    paths:
      - 'scripts/security/offline_pglite_restore.mjs'
      - '.github/workflows/sec-offline-pglite-runtime.yml'
permissions:
  contents: read
jobs:
  package-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free isolated PG runtime (no operating secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg-offline-runtime
          cd /tmp/pg-offline-runtime
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @electric-sql/pglite
          node --input-type=module -e "import('@electric-sql/pglite').then(x=>console.log('PGLITE_RUNTIME_FOUND='+Boolean(x.PGlite)))"
          tar -czf "$GITHUB_WORKSPACE/pglite-runtime.tgz" package.json package-lock.json node_modules
      - name: Test PostgreSQL version and fixture DDL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PGlite} from '/tmp/pg-offline-runtime/node_modules/@electric-sql/pglite/dist/index.js';
          const db = new PGlite();
          await db.waitReady;
          const a=await db.query('select version() as version');
          console.log('EMBEDDED_POSTGRES_VERSION='+a.rows[0].version);
          await db.exec("CREATE SCHEMA auth; CREATE TABLE auth.users(id uuid primary key,email text); INSERT INTO auth.users VALUES ('11111111-1111-1111-1111-111111111111','synthetic.invalid');");
          const b=await db.query('select count(*)::int as n from auth.users');
          if(b.rows[0].n!==1)throw Error('POSTGRES_WASM_FIXTURE_FAILED');
          console.log('PASS_POSTGRESQL_WASM_ISOLATED_AUTH_FIXTURE');
          await db.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sec-offline-postgres-wasm-runtime
          path: pglite-runtime.tgz
          retention-days: 1
          if-no-files-found: error
