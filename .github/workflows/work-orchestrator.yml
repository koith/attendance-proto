name: Work orchestration guard
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Canonical issue to resume'
        type: string
        default: '1331'
      checkpoint:
        description: 'Optional checkpoint JSON; empty performs read-only resume'
        type: string
        default: ''
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'scripts/ai-dev/**'
      - 'scripts/autonomous_dev_agent.sh'
      - 'docs/ai-dev-workflow/**'
      - '.github/workflows/work-orchestrator.yml'
      - '.github/workflows/p0-pages-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'scripts/ai-dev/**'
      - 'docs/ai-dev-workflow/**'
      - 'scripts/autonomous_dev_agent.sh'
      - 'scripts/work-orchestrator.mjs'
      - 'scripts/orchestrator.test.mjs'
      - '.github/workflows/work-orchestrator.yml'
permissions:
  contents: read
concurrency:
  group: ai-dev-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ai-dev/*.test.mjs
      - run: node scripts/orchestrator.test.mjs
      - id: state
        run: |
          node scripts/work-orchestrator.mjs next > next.json
          echo "json=$(cat next.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NEXT_JSON: ${{ steps.state.outputs.json }}
        with:
          script: |
            const state=JSON.parse(process.env.NEXT_JSON);
            // Do not publish a false unfinished-work alert from in-memory example tasks.
            // Only an explicitly initialized and persisted work-state is actionable.
            if(state.status==='complete'||state.status==='uninitialized')return;
            const title='[자동 작업 추적] 미완료 개발 작업';
            const body=`미완료 작업: ${state.task}\n남은 검증: ${state.missing.join(', ')}\n\n이 워크플로는 작업을 추적하지만 AI 코드를 자동 생성하거나 배포하지 않습니다.`;
            const issues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            if(existing)await github.rest.issues.update({...context.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({...context.repo,title,body});

  issue-resume:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct task from canonical issue, independent of chat history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '1331' }}
        run: node scripts/ai-dev/cli.mjs resume "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" > issue-resume.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue-resume-${{ github.run_id }}
          path: issue-resume.json
          retention-days: 14
  checkpoint:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.checkpoint != ''
    needs: [guard, issue-resume]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Persist append-only checkpoint with revision and branch-SHA checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CHECKPOINT_JSON: ${{ inputs.checkpoint }}
        run: |
          node -e 'require("fs").writeFileSync("checkpoint-input.json",process.env.CHECKPOINT_JSON)'
          node scripts/ai-dev/cli.mjs checkpoint "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" checkpoint-input.json
