name: Inventory mobile task navigation regression
on:
  pull_request:
    paths:
      - 'operations_reference_ui_v208.js'
      - 'operations_v1.css'
      - 'index.html'
      - 'qa_inventory_nav_mobile_browser_v331.mjs'
      - '.github/workflows/inventory-navigation-mobile-v331.yml'
  push:
    branches: [main]
    paths:
      - 'operations_reference_ui_v208.js'
      - 'operations_v1.css'
      - 'index.html'
      - 'qa_inventory_nav_mobile_browser_v331.mjs'
      - '.github/workflows/inventory-navigation-mobile-v331.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-shortcuts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
        timeout-minutes: 4
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: Verify Chromium launch and repair missing system libraries
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if node -e 'require("playwright").chromium.launch({headless:true}).then(b=>b.close()).catch(()=>process.exit(1))'; then
            echo 'Actual Chromium launch passed.'
          else
            timeout --kill-after=15s 240s npx playwright install-deps chromium
            node -e 'require("playwright").chromium.launch({headless:true}).then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})'
          fi
      - name: Execute actual inventory renderer across six viewports
        run: node qa_inventory_nav_mobile_browser_v331.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-nav-390px
          path: qa-results/inventory-shortcuts-390.png
          if-no-files-found: warn
