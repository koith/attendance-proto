name: payroll-policy-approval-v1-regression
on:
  pull_request:
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - 'qa_payroll_policy_adjustment_v1.mjs'
      - 'qa_payroll_policy_scenarios_v1.mjs'
      - 'qa_payroll_monday_month_no_local_work_v1.mjs'
      - 'qa_payroll_inactive_monday_month_v1.mjs'
      - 'qa_payroll_approval_engine_fixture_v1.mjs'
      - 'qa_payroll_weekly_verified_source_v1.mjs'
      - 'qa_payroll_weekly_source_ui_v1.mjs'
      - 'payroll_weekly_source_ui_v1.js'
      - 'qa_payroll_close_server_authority_v1.mjs'
      - 'qa_payroll_close_nonnull_snapshot_fields_v1.mjs'
      - 'supabase/migrations/20261012063000_payroll_close_require_nonnull_amounts.sql'
      - 'qa_payroll_no_local_punch_close_v1.mjs'
      - 'qa_monthly_segments_report_parity_v1.mjs'
      - 'qa_monthly_contract_unpaid_segment_v1.mjs'
      - 'qa_hourly_segments_sheet_parity_v1.mjs'
      - 'qa_payroll_contract_transition_fail_closed_v1.mjs'
      - 'qa_weekly_decision_end_to_end_v1.mjs'
      - 'qa_weekly_only_payroll_ui_v1.mjs'
      - 'index.html'
      - 'qa_payroll_weekly_substitution_boundary_v1.mjs'
      - 'qa_payroll_week_approval_boundary_source_v1.mjs'
      - 'qa_weekly_only_payroll_ui_v1.mjs'
      - 'qa_weekly_approval_rpc_guard_v1.mjs'
      - 'supabase/migrations/20261010013000_weekly_approval_rpc_closed_week.sql'
      - 'qa_payroll_weekly_integration_v1.mjs'
      - 'qa_payroll_month_boundary_v1.mjs'
      - 'qa_payroll_week_boundary_behavior_v1.mjs'
      - 'qa_server_payroll_parity_fixtures.mjs'
      - 'supabase/migrations/20261010100000_sheet_payroll_week_boundary.sql'
      - '.github/workflows/payroll-policy-approval-v1-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/server-sync-sheet/**'
      - 'qa_payroll_policy_adjustment_v1.mjs'
      - 'qa_payroll_week_approval_boundary_source_v1.mjs'
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa_payroll_policy_adjustment_v1.mjs
      - run: node qa_payroll_policy_scenarios_v1.mjs
      - run: node qa_payroll_monday_month_no_local_work_v1.mjs
      - run: node qa_payroll_inactive_monday_month_v1.mjs
      - run: node qa_payroll_approval_engine_fixture_v1.mjs
      - run: node qa_payroll_weekly_verified_source_v1.mjs
      - run: node qa_payroll_weekly_source_ui_v1.mjs
      - run: node qa_payroll_close_server_authority_v1.mjs
      - run: node qa_payroll_close_nonnull_snapshot_fields_v1.mjs
      - run: node qa_payroll_no_local_punch_close_v1.mjs
      - run: node qa_monthly_segments_report_parity_v1.mjs
      - run: node qa_monthly_contract_unpaid_segment_v1.mjs
      - run: node qa_hourly_segments_sheet_parity_v1.mjs
      - run: node qa_payroll_contract_transition_fail_closed_v1.mjs
      - run: node qa_weekly_decision_end_to_end_v1.mjs
      - run: node qa_weekly_only_payroll_ui_v1.mjs
      - run: node qa_payroll_weekly_substitution_boundary_v1.mjs
      - run: node qa_payroll_week_approval_boundary_source_v1.mjs
      - run: node qa_weekly_approval_rpc_guard_v1.mjs
      - run: node qa_payroll_weekly_integration_v1.mjs
      - run: node qa_payroll_month_boundary_v1.mjs
      - run: node qa_payroll_week_boundary_behavior_v1.mjs
      - run: node qa_server_payroll_parity_fixtures.mjs
      - run: node qa_server_payroll_fixture_parity_v1.mjs
