name: app-version-badge-v1
on:
  pull_request:
    paths:
      - 'index.html'
      - 'qa_app_version_badge_v1.mjs'
      - '.github/workflows/app-version-badge-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa_app_version_badge_v1.mjs'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node qa_app_version_badge_v1.mjs
