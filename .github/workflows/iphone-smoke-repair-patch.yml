name: iphone-smoke-repair-patch
on:
  push:
    branches: [chatgpt-ux-v1.1.2-iphone-smoke-repair]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1.2-iphone-smoke-repair
      - name: Apply deterministic iPhone smoke repair
        run: python tools/iphone_smoke_repair_patch.py
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html employment_contracts.html employment_contracts.css employment_contracts_v3.js daily_schedule.html monthly_schedule.html attendance_review.html
          git commit -m "fix: close iPhone smoke issues"
          git push
