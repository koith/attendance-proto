name: ux-v111-polish-patch
on:
  push:
    branches: [chatgpt-ux-v1.1.1-mobile-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1.1-mobile-polish
          fetch-depth: 1
      - name: Apply targeted mobile polish
        run: |
          python - <<'PY'
          from pathlib import Path

          # daily schedule: grouped period navigator + clearer time separator
          p=Path('daily_schedule.html'); s=p.read_text()
          old='<div class="datebar"><button class="btn" id="prevDay">‹</button><input id="date" type="date"><button class="btn" id="nextDay">›</button><button class="btn" id="today">오늘</button></div>'
          new='<div class="datebar"><div class="period-nav"><button class="btn" id="prevDay">‹</button><input id="date" type="date"><button class="btn" id="nextDay">›</button></div><button class="btn" id="today">오늘</button></div>'
          if old not in s: raise SystemExit('daily navigator anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('daily_schedule.css'); s=p.read_text()
          s=s.replace('.datebar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;margin-top:10px}.datebar input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 8px;font-size:16px}',
          '.datebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.period-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.period-nav .btn{border:0;border-radius:0;padding:8px 6px}.period-nav input{width:100%;height:44px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:#fff;padding:0 8px;font-size:16px}',1)
          s=s.replace('.time-range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px;align-items:center;margin-top:10px;min-width:0}',
          '.time-range{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;min-width:0}.time-range>span{display:flex;align-items:center;justify-content:center;width:20px;color:var(--muted);font-weight:700;line-height:1}',1)
          s=s.replace('@media(max-width:520px){.wrap{padding-left:12px;padding-right:12px}.datebar{grid-template-columns:auto minmax(0,1fr) auto}.datebar #today{grid-column:1/-1;min-height:38px}',
          '@media(max-width:520px){.wrap{padding-left:12px;padding-right:12px}.datebar{grid-template-columns:minmax(0,1fr)}.datebar #today{grid-column:1/-1;min-height:38px}',1)
          p.write_text(s)

          # monthly schedule: same grouped navigator + same time range grammar
          p=Path('monthly_schedule.html'); s=p.read_text()
          old='<div class="monthbar"><button class="btn" id="prevMonth">‹</button><input id="month" type="month"><button class="btn" id="nextMonth">›</button><button class="btn" id="thisMonth">이번 달</button></div>'
          new='<div class="monthbar"><div class="period-nav"><button class="btn" id="prevMonth">‹</button><input id="month" type="month"><button class="btn" id="nextMonth">›</button></div><button class="btn" id="thisMonth">이번 달</button></div>'
          if old not in s: raise SystemExit('monthly navigator anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('monthly_schedule.css'); s=p.read_text()
          s=s.replace('.monthbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;margin-top:8px}.monthbar input,select,input[type=time]{min-width:0;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px}',
          '.monthbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}.period-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.period-nav .btn{border:0;border-radius:0;padding:8px 6px}.period-nav #month{min-width:0;width:100%;height:44px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:#fff;padding:0 8px}.monthbar select,.monthbar input[type=time],select,input[type=time]{min-width:0;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px}',1)
          s=s.replace('.time-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px;align-items:center;margin:12px 0}',
          '.time-row{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:10px;align-items:center;margin:12px 0}.time-row>span{display:flex;align-items:center;justify-content:center;width:20px;color:var(--muted);font-weight:700;line-height:1}',1)
          s=s.replace('@media(max-width:768px){.head h1{font-size:1rem}.monthbar{grid-template-columns:auto minmax(0,1fr) auto}.monthbar #thisMonth{grid-column:1/-1;min-height:36px}',
          '@media(max-width:768px){.head h1{font-size:1rem}.monthbar{grid-template-columns:minmax(0,1fr)}.monthbar #thisMonth{grid-column:1/-1;min-height:36px}',1)
          p.write_text(s)

          # Employment period memo only: compact 2-row textarea; contract memo untouched
          p=Path('employment_contracts_v3.js'); s=p.read_text()
          old='<div class="field"><label>메모</label><input id="periodNote" value="${escapeHtml(p?.note||\'\')}"></div>'
          new='<div class="field"><label>메모</label><textarea id="periodNote" rows="2" placeholder="필요한 내용만 기록">${escapeHtml(p?.note||\'\')}</textarea></div>'
          if old not in s: raise SystemExit('periodNote anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('employment_contracts.css'); s=p.read_text()
          marker='.field textarea{min-height:96px;resize:vertical}'
          if marker not in s: raise SystemExit('textarea css anchor missing')
          s=s.replace(marker,marker+'#periodNote{min-height:58px;height:58px;resize:vertical}',1)
          p.write_text(s)

          # Admin: turn standalone attendance text shortcut into operational alert fed by existing pendingRequests source
          p=Path('index.html'); s=p.read_text()
          old='<a class="admin-review-link" href="attendance_review.html">근태 확인 <span>›</span></a>'
          new='<a class="admin-attendance-alert" id="attendanceAlert" href="attendance_review.html"><span id="attendanceAlertText">근태 확인</span><span>›</span></a>'
          if old not in s: raise SystemExit('attendance quick anchor missing')
          s=s.replace(old,new,1)
          oldcss='.admin-review-link{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:8px;padding:0 4px;color:var(--brand-700);text-decoration:none;font-size:.84rem;}'
          newcss='.admin-attendance-alert{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--surface-muted);color:var(--brand-700);text-decoration:none;font-size:.84rem;font-weight:650;}.admin-attendance-alert.quiet{color:var(--text-muted);font-weight:500;}'
          if oldcss not in s: raise SystemExit('attendance quick css anchor missing')
          s=s.replace(oldcss,newcss,1)
          oldfn='''async function renderPendingRequests(){
  const sec=document.getElementById("adReqSection");
  let reqs=[];
  try{ reqs=await BE.pendingRequests(); }catch(e){ return; }
  if(!reqs||!reqs.length){ sec.innerHTML=""; return; }
  const kindLabel={MISSING_OUT:"퇴근 누락 보완",MISSING_IN:"출근 누락 보완",WRONG_TIME:"시각 정정",OTHER:"기타"};'''
          newfn='''async function renderPendingRequests(){
  const sec=document.getElementById("adReqSection"), alert=document.getElementById("attendanceAlert"), alertText=document.getElementById("attendanceAlertText");
  let reqs=[];
  try{ reqs=await BE.pendingRequests(); }catch(e){ if(alertText) alertText.textContent="근태 확인"; return; }
  if(alertText) alertText.textContent=reqs.length?`⚠ 확인할 근태 ${reqs.length}건`:"확인할 근태 없음";
  if(alert) alert.classList.toggle("quiet",!reqs.length);
  if(!reqs||!reqs.length){ sec.innerHTML=""; return; }
  const kindLabel={MISSING_OUT:"퇴근 누락 보완",MISSING_IN:"출근 누락 보완",WRONG_TIME:"시각 정정",OTHER:"기타"};'''
          if oldfn not in s: raise SystemExit('pending function anchor missing')
          s=s.replace(oldfn,newfn,1)
          s=s.replace('sec.innerHTML=`<div class="section-t">⚠ 정정요청 ${reqs.length}건 대기</div>`;','sec.innerHTML=`<div class="section-t">직원 정정요청</div>`;',1)
          p.write_text(s)
          PY
      - name: Verify targeted changes
        run: |
          node --check employment_contracts_v3.js
          node --check daily_schedule.js
          node --check monthly_schedule.js
          node --check qa_ux_v111.mjs
          node qa_ux_v111.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+koith@users.noreply.github.com
          git add daily_schedule.html daily_schedule.css monthly_schedule.html monthly_schedule.css employment_contracts_v3.js employment_contracts.css index.html
          git commit -m 'fix: polish iPhone schedule and admin operational UI'
          git push
