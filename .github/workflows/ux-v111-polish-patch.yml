name: ux-v111-polish-patch
on:
  push:
    branches: [chatgpt-ux-v1.1.1-mobile-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1.1-mobile-polish
          fetch-depth: 1
      - name: Apply targeted mobile polish
        run: python scripts/ux_v111_patch.py
      - name: Verify targeted changes
        run: |
          node --check employment_contracts_v3.js
          node --check daily_schedule.js
          node --check monthly_schedule.js
          node --check qa_ux_v111.mjs
          node qa_ux_v111.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+koith@users.noreply.github.com
          git add daily_schedule.html daily_schedule.css monthly_schedule.html monthly_schedule.css employment_contracts_v3.js employment_contracts.css index.html
          git commit -m 'fix: polish iPhone schedule and admin operational UI'
          git push
