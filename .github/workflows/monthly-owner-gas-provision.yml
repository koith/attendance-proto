name: Monthly Owner isolated Google Apps Script provisioning (no email)
on:
  # Token-restricted GitHub API merge may not fire a downstream push workflow.
  # A maintainer's explicit label on the EXACT existing work item is a
  # one-shot, auditable dispatch for disabled source-only provisioning.
  issues:
    types: [labeled]
  pull_request:
    paths:
      - 'scripts/provision_monthly_owner_gas.mjs'
      - 'scripts/monthly_owner_google_identity.mjs'
      - 'qa/qa_monthly_owner_gas_provision_fallback.test.mjs'
      - '.github/workflows/monthly-owner-gas-provision.yml'
      - 'gas/monthly-owner-report/**'
  push:
    branches: [main]
    paths:
      - 'scripts/provision_monthly_owner_gas.mjs'
      - 'scripts/monthly_owner_google_identity.mjs'
      - '.github/workflows/monthly-owner-gas-provision.yml'
      - 'gas/monthly-owner-report/**'
permissions:
  contents: read
jobs:
  safety:
    # A labeled unrelated Issue must not spend a runner on monthly-owner QA.
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'labeled' && github.event.issue.number == 1435 && github.event.label.name == 'monthly-owner-gas-source-provision' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source, developer fixtures and no operating writes
        run: |
          node --check scripts/provision_monthly_owner_gas.mjs
          node qa/qa_monthly_owner_delivery_1435.test.mjs
          node --test qa/qa_monthly_owner_gas_provision_fallback.test.mjs
          node --test qa/qa_monthly_owner_label_scope.test.mjs
  provision-isolated-source:
    needs: safety
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[MONTHLY-OWNER-GAS-PROVISION]')) ||
      (github.repository == 'koith/attendance-proto' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.number == 1435 && github.event.label.name == 'monthly-owner-gas-source-provision' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # Keep OAuth credential families separate. Select only the one with
      # verified expected owner, client ID and exact OAuth scopes.
      # Wrong-owner credentials cannot write any Google project or file.
      QA1243_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_ID }}
      QA1243_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.QA1243_GOOGLE_OAUTH_CLIENT_SECRET }}
      QA1243_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.QA1243_GOOGLE_OAUTH_REFRESH_TOKEN }}
      LEGACY_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      LEGACY_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      LEGACY_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Create/reuse and independently read back only the disabled monthly mailer code
        run: node scripts/provision_monthly_owner_gas.mjs
      - name: Record exact deployment boundary
        if: success()
        run: echo "Isolated Google Apps Script source only. No owner mail, no trigger, no script secrets or payroll reads." >> "$GITHUB_STEP_SUMMARY"
