name: Security exposure inventory (read only)
on:
  pull_request:
    paths:
      - 'scripts/security_inventory_readonly.mjs'
      - 'scripts/security_published_content_readonly.mjs'
      - '.github/workflows/security-inventory-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan all reachable history, current source and secret candidates (no values output)
        run: node scripts/security_inventory_readonly.mjs --history --require-no-credential-hits
      - name: Scan actual published same-origin Pages HTML/JS/CSS (read-only)
        run: node scripts/security_published_content_readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-exposure-inventory-${{ github.sha }}
          path: security-inventory-summary.json
          retention-days: 7
          if-no-files-found: warn
