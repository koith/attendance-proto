name: QA1243 live hosted Auth and SMTP config read-only audit
on:
  pull_request:
    paths:
      - 'scripts/qa1243_readonly_auth_config.mjs'
      - 'scripts/qa1243_auth_config_verdict.mjs'
      - 'scripts/qa1243_auth_config_verdict.test.mjs'
      - 'qa1243_approved_sheet_route_guard.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-operational-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa1243_readonly_auth_config.mjs'
      - 'scripts/qa1243_auth_config_verdict.mjs'
      - 'scripts/qa1243_auth_config_verdict.test.mjs'
      - 'qa1243_approved_sheet_route_guard.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-operational-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-hosted-auth-smtp:
    name: Live read-only Supabase Auth/SMTP config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit code syntax (GET only; no account mutations)
        run: |
          node --check scripts/qa1243_readonly_auth_config.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('scripts/qa1243_readonly_auth_config.mjs','utf8');if(/method:\s*['\"](?:POST|PATCH|PUT|DELETE)['\"]/.test(s))process.exit(1);console.log('PASS read-only verbs only')"
      - name: Check Hosted config, activation URLs and actual page failure paths (isolated VM)
        run: node scripts/qa1243_auth_config_verdict.test.mjs
      - name: Check explicitly approved QA route and production write isolation (static harness)
        run: node qa1243_approved_sheet_route_guard.mjs
      - name: Request hosted Auth and SMTP configuration using GET only
        if: github.event_name != 'pull_request'
        run: node scripts/qa1243_readonly_auth_config.mjs
      - name: Explicit scope and live evidence limitation
        if: always()
        run: |
          echo 'Requires project-scoped Auth Config Read (auth_config_read / OAuth auth:read). No settings write permission required.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dedicated read token is preferred; existing Management secret is reused only when it is absent. Tokens and SMTP values are never printed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR tests do not contact Hosted Auth or prove real mail delivery; main/manual audit performs GET only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'URL audit checks production Site URL and the actual invitation/recovery activation callback. Missing values remain unverified; no URL configuration is changed.' >> "$GITHUB_STEP_SUMMARY"
