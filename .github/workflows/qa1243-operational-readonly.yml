name: QA1243 live hosted Auth and SMTP config read-only audit
on:
  pull_request:
    paths:
      - 'scripts/qa1243_readonly_auth_config.mjs'
      - 'scripts/qa1243_auth_config_verdict.mjs'
      - 'scripts/qa1243_auth_config_verdict.test.mjs'
      - 'qa1243_approved_sheet_route_guard.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-operational-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa1243_readonly_auth_config.mjs'
      - 'scripts/qa1243_auth_config_verdict.mjs'
      - 'scripts/qa1243_auth_config_verdict.test.mjs'
      - 'qa1243_approved_sheet_route_guard.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/index.ts'
      - '.github/workflows/qa1243-operational-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-audit-code:
    name: Verify read-only audit preparation (no management credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit code syntax (GET only; no account mutations)
        run: |
          node --check scripts/qa1243_readonly_auth_config.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for(const path of ['scripts/qa1243_readonly_auth_config.mjs','scripts/qa1243_auth_config_verdict.mjs']){
            const source=readFileSync(path,'utf8');
            if(/method:\s*['"](?:POST|PATCH|PUT|DELETE)['"]/.test(source))throw Error('AUTH_AUDIT_WRITE_VERB_FORBIDDEN');
          }
          console.log('PASS read-only verbs only');
          JS
      - name: Check Hosted config, activation URLs and actual page failure paths (isolated VM)
        run: node scripts/qa1243_auth_config_verdict.test.mjs
      - name: Check explicitly approved QA route and production write isolation (static harness)
        run: node qa1243_approved_sheet_route_guard.mjs

  select-existing-read-context:
    name: Locate existing approved Auth read context (metadata only)
    needs: verify-audit-code
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      context: ${{ steps.route.outputs.context }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        uses: actions/github-script@v7
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const {selectHostedAuthReadContext}=await import(process.env.GITHUB_WORKSPACE+'/scripts/qa1243_auth_config_verdict.mjs');
            const dedicatedPresent=Boolean(String(process.env.SUPABASE_AUTH_READ_TOKEN||'').trim());
            const existingPresent=Boolean(String(process.env.SUPABASE_ACCESS_TOKEN||'').trim());
            let environmentRead=null;
            if(!dedicatedPresent&&!existingPresent){
              try{
                const response=await github.rest.repos.getEnvironment({...context.repo,environment_name:'production'});
                environmentRead={status:response.status,data:response.data};
              }catch(error){
                environmentRead={status:Number.isInteger(error.status)?error.status:null};
              }
            }
            const result=selectHostedAuthReadContext({dedicatedPresent,existingPresent,environmentRead});
            core.setOutput('context',result.context);
            core.info('QA1243_AUTH_READ_CONTEXT '+JSON.stringify(result));
            await core.summary.addHeading('Existing Auth read context').addRaw(JSON.stringify(result)).write();

  audit-repository-auth:
    name: Hosted Auth GET using existing repository credential
    needs: select-existing-read-context
    if: needs.select-existing-read-context.outputs.context == 'REPOSITORY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request hosted Auth and SMTP configuration using GET only
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/qa1243_readonly_auth_config.mjs

  audit-existing-production-auth:
    name: Hosted Auth GET using existing protected environment (no deployment)
    needs: select-existing-read-context
    if: needs.select-existing-read-context.outputs.context == 'EXISTING_PRODUCTION'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request hosted Auth and SMTP configuration using GET only
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/qa1243_readonly_auth_config.mjs
      - name: Explicit existing-permission and non-deployment boundary
        if: always()
        run: |
          echo 'Existing production environment only after metadata confirmation. Protection rules retained; no deployment object, settings change or mail.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only Auth Config Read (auth_config_read / auth:read) is required. Secrets are never printed; 401/403 never broadens credentials.' >> "$GITHUB_STEP_SUMMARY"

