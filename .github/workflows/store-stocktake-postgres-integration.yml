name: store-stocktake-postgres-integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261012210500_store_inventory_stocktake.sql'
      - 'qa_store_stocktake_postgres_integration.sql'
      - 'supabase/migrations/20261019082000_staff_stocktake_proposals.sql'
      - 'supabase/migrations/20261019084500_staff_stocktake_proposal_baseline.sql'
      - 'qa_staff_stocktake_proposals_postgres.sql'
      - 'qa_staff_stocktake_ui_v1.mjs'
      - 'qa_staff_stocktake_pin_race_v1.mjs'
      - 'operations_staff_stocktake_v1.js'
      - '.github/workflows/store-stocktake-postgres-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012210500_store_inventory_stocktake.sql'
      - 'qa_store_stocktake_postgres_integration.sql'
      - 'supabase/migrations/20261019082000_staff_stocktake_proposals.sql'
      - 'supabase/migrations/20261019084500_staff_stocktake_proposal_baseline.sql'
      - 'qa_staff_stocktake_proposals_postgres.sql'
      - 'qa_staff_stocktake_ui_v1.mjs'
      - 'qa_staff_stocktake_pin_race_v1.mjs'
      - 'operations_staff_stocktake_v1.js'
      - '.github/workflows/store-stocktake-postgres-integration.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: stocktake_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d stocktake_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_fixture_only
      PGDATABASE: stocktake_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Run the production SQL stocktake migration against an isolated inventory ledger
        run: psql -v ON_ERROR_STOP=1 -f qa_store_stocktake_postgres_integration.sql
      - name: Run actual employee proposal and manager approval migration against isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f qa_staff_stocktake_proposals_postgres.sql
      - name: Validate shipped staff/manager stocktake JavaScript and adapters
        run: node qa_staff_stocktake_ui_v1.mjs
      - name: Exercise live handlers against delayed PIN authentication responses
        run: node qa_staff_stocktake_pin_race_v1.mjs
