name: test-mode-isolation-v27-regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa_test_mode_isolation_v27.mjs
