name: actual-attendance-qa-baseline-patch
on:
  push:
    branches: [chatgpt-actual-attendance-v1]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[actual-qa-patched]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-actual-attendance-v1
      - name: Update intentional IA expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa_ux_v11.mjs')
          s=p.read_text()
          old="t('빠른 스케줄은 월간으로 진입',()=>{assert(idx.includes('document.getElementById(\"quickSchedule\").onclick=()=>{ location.href=\"monthly_schedule.html\"; };'))});"
          new="t('빠른 근무현황은 실제 출퇴근 현황으로 진입',()=>{assert(idx.includes('document.getElementById(\"quickSchedule\").onclick=()=>{ location.href=\"actual_attendance.html\"; };'));assert(idx.includes('<b>근무현황</b>'))});"
          assert old in s, 'old quick schedule QA marker missing'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/actual-attendance-qa-baseline-patch.yml
      - name: Commit
        run: |
          git config user.name koith
          git config user.email 48688331+koith@users.noreply.github.com
          git add qa_ux_v11.mjs .github/workflows/actual-attendance-qa-baseline-patch.yml
          git commit -m 'Update UX regression baseline for actual attendance [actual-qa-patched]'
          git push origin HEAD:chatgpt-actual-attendance-v1