name: index-startup-smoke-v1
on:
  pull_request:
    paths:
      - 'index.html'
      - 'qa_index_startup_smoke_v1.mjs'
      - '.github/workflows/index-startup-smoke-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa_index_startup_smoke_v1.mjs'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node qa_index_startup_smoke_v1.mjs
