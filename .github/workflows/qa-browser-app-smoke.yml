name: Mobile Desktop Browser Regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'actual_attendance.js'
      - 'actual_attendance.html'
      - 'qa_browser_app_smoke.mjs'
      - 'hq_owner_console.js'
      - 'hq_store_onboarding_ui.js'
      - 'tests/qa1243_hq_reinvite_browser.mjs'
      - 'tests/qa1243_hq_reinvite_actions.test.mjs'
      - 'qa_store_navigation_isolation_browser_1243.mjs'
      - 'tests/qa1243_store_navigation_isolation.test.mjs'
      - 'qa_operations_header_mobile_browser_v1.mjs'
      - 'operations_v1.js'
      - 'operations_v1.css'
      - 'qa_version_test_controls_browser_v1.mjs'
      - 'version_test_toggle_982.js'
      - 'test_mode_ui_v1.js'
      - 'qa_runtime_asset_syntax_v1.mjs'
      - 'scripts/qa_browser_static_preview.mjs'
      - '.github/workflows/qa-browser-app-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'actual_attendance.js'
      - 'actual_attendance.html'
      - 'qa_browser_app_smoke.mjs'
      - 'hq_owner_console.js'
      - 'hq_store_onboarding_ui.js'
      - 'tests/qa1243_hq_reinvite_browser.mjs'
      - 'tests/qa1243_hq_reinvite_actions.test.mjs'
      - 'qa_store_navigation_isolation_browser_1243.mjs'
      - 'tests/qa1243_store_navigation_isolation.test.mjs'
      - 'qa_operations_header_mobile_browser_v1.mjs'
      - 'operations_v1.js'
      - 'operations_v1.css'
      - '.github/workflows/qa-browser-app-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium mobile + desktop app smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every referenced JavaScript asset
        run: node qa_runtime_asset_syntax_v1.mjs
      - name: Verify actual representative reinvite button handlers
        run: node --test tests/qa1243_hq_reinvite_actions.test.mjs tests/qa1243_hq_reinvite_release.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          node -e 'Promise.all(["chromium","webkit"].map(async name=>{const browser=await require("playwright")[name].launch({headless:true});await browser.close()})).catch(error=>{console.error(error);process.exit(1)})'
      - name: HQ former-owner reinvite on Chromium and WebKit without real mail
        run: node tests/qa1243_hq_reinvite_browser.mjs
      - name: Store return and signed-in account isolation contracts
        run: |
          node tests/qa1243_store_navigation_isolation.test.mjs
          node tests/qa1243_store_isolation_release.test.mjs
      - name: Actual entry and attendance return isolation (Chromium and WebKit, no production requests)
        run: node qa_store_navigation_isolation_browser_1243.mjs
      - name: Verify operations title and one-line toolbar in six Chromium viewports
        run: node qa_operations_header_mobile_browser_v1.mjs
      - name: Upload isolated mobile layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-mobile-title-toolbar-v330
          path: qa-results/ops-header-414-mobile.png
          if-no-files-found: warn
      - name: Real test-mode overlay version-button regression (mobile/desktop)
        run: node qa_version_test_controls_browser_v1.mjs
      - name: Start isolated static preview
        run: |
          node scripts/qa_browser_static_preview.mjs >/tmp/attendance-preview.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4173/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/attendance-preview.log
          exit 1
      - name: Exercise responsive routes without modifying production
        run: node qa_browser_app_smoke.mjs
