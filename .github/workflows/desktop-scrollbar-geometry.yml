name: desktop-scrollbar-geometry
on:
  pull_request:
    paths: ['index.html','qa_desktop_scrollbar_geometry.mjs','.github/workflows/desktop-scrollbar-geometry.yml']
  push:
    branches: [main]
    paths: ['index.html','qa_desktop_scrollbar_geometry.mjs','.github/workflows/desktop-scrollbar-geometry.yml']
jobs:
  chromium-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node qa_desktop_scrollbar_geometry.mjs
