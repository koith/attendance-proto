name: actual-attendance-overnight-timezone-postgres
on:
  pull_request:
    paths:
      - 'actual_attendance.js'
      - 'qa_actual_attendance_overnight_pairing_v1.mjs'
      - 'qa_actual_attendance_overnight_timezone_postgres.sql'
      - 'qa_attendance_consumer_timezone_postgres.sql'
      - 'qa_attendance_payroll_consumer_parity_v1.mjs'
      - 'supabase/migrations/20261013195000_attendance_consumer_timezone_parity.sql'
      - 'supabase/functions/server-sync-sheet/engine.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/engine.mjs'
      - 'index.html'
      - 'supabase/migrations/20261013154500_attendance_correction_clock_boundary.sql'
      - '.github/workflows/actual-attendance-overnight-timezone-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'actual_attendance.js'
      - 'qa_actual_attendance_overnight_pairing_v1.mjs'
      - 'qa_actual_attendance_overnight_timezone_postgres.sql'
      - 'qa_attendance_consumer_timezone_postgres.sql'
      - 'qa_attendance_payroll_consumer_parity_v1.mjs'
      - 'supabase/migrations/20261013195000_attendance_consumer_timezone_parity.sql'
      - 'supabase/functions/server-sync-sheet/engine.mjs'
      - 'edge-release/supabase/functions/server-sync-sheet/engine.mjs'
      - 'index.html'
      - 'supabase/migrations/20261013154500_attendance_correction_clock_boundary.sql'
      - '.github/workflows/actual-attendance-overnight-timezone-postgres.yml'
permissions:
  contents: read
jobs:
  actual-attendance-overnight:
    name: Real SQL timezone, 26h hard stop, POS and manager readback (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: qa_attendance_overnight
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_attendance_overnight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_fixture_only
      PGDATABASE: qa_attendance_overnight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify midnight shift and redundant synthetic OUT are UI-safe
        run: node qa_actual_attendance_overnight_pairing_v1.mjs
      - name: Verify browser and live/native Edge payroll pairing agreement
        run: node qa_attendance_payroll_consumer_parity_v1.mjs
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Execute real production function definitions with synthetic employee fixtures
        run: psql -v ON_ERROR_STOP=1 -f qa_attendance_consumer_timezone_postgres.sql
