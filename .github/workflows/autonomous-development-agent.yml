name: autonomous-development-agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing GitHub issue number with approved development task'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write
concurrency:
  group: autonomous-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  develop:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not embed a repository-write credential into .git/config where
          # model-proposed JavaScript QA could read it before PR review.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved task and available GitHub-token provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$GITHUB_TOKEN" || { echo "::error::GitHub Actions token missing"; exit 1; }
          if [[ -n "$OPENAI_API_KEY" ]]; then echo "Using configured OpenAI aider provider"; else echo "No OpenAI secret: using GitHub Copilot CLI via GITHUB_TOKEN"; fi
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'agent-approved' || { echo "::error::Issue requires agent-approved label"; exit 1; }
          gh issue view "$ISSUE_NUMBER" --json state --jq .state | grep -qx OPEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Preserve original approved issue before coding
        run: node scripts/issue_intake_receipt.mjs
      - name: Install AI coding agent and browser QA dependencies
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            python -m pip install 'aider-chat==0.86.1'
          else
            npm install -g --no-audit --no-fund @github/copilot
          fi
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run bounded OpenAI or built-in GitHub Copilot repair loop and open review PR
        shell: bash
        run: bash scripts/autonomous_dev_agent.sh
      - name: Record bounded agent failure without claiming completion
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const number=Number(process.env.ISSUE_NUMBER);
            if(!Number.isSafeInteger(number)||number<=0)throw Error('Invalid approved task number');
            const marker='[agent-run:'+context.runId+']';
            const bridgeMarker='[agent-pr-bridge:'+context.runId+']';
            const comments=await github.paginate(github.rest.issues.listComments,{
              ...context.repo,issue_number:number,per_page:100});
            // Trust only GitHub Actions' own receipts, not user-supplied issue comments.
            const trusted=comments.filter(c=>c.user?.login==='github-actions[bot]');
            if(trusted.some(c=>(c.body||'').split(/\r?\n/).some(line=>line.trim()===marker)))return;
            const bridgePending=trusted.some(c=>
              (c.body||'').split(/\r?\n/).some(line=>line.trim()===bridgeMarker));
            const runUrl='https://github.com/'+context.repo.owner+'/'+
              context.repo.repo+'/actions/runs/'+context.runId;
            const lines=bridgePending ? [
              marker,
              'AI 코드 변경·기능별 QA·브랜치 푸시까지 통과했습니다.',
              'GitHub Actions의 PR 생성 정책으로 검토용 PR 생성만 제한되어 승인된 별도 연결 브리지를 기다립니다.',
              'PR 생성·전체 CI·병합·운영 배포는 아직 완료되지 않았습니다.',
              '확인된 인계 표시: '+bridgeMarker,
              '실행: '+runUrl
            ] : [
              marker,
              'AI 자동 개발 또는 QA 절차가 완료되지 않았습니다. 해당 실행 로그에서 실패 지점을 확인하세요.',
              '모델·기능별 QA·브랜치 푸시·PR 권한 중 어떤 단계인지 로그를 확인해야 합니다.',
              '변경사항을 운영 환경에 배포하지 않았습니다.',
              '실행: '+runUrl
            ];
            await github.rest.issues.createComment({
              ...context.repo,issue_number:number,body:lines.join('\n')});
