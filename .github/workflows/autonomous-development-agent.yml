name: autonomous-development-agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing GitHub issue number with approved development task'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write
concurrency:
  group: autonomous-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  develop:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved task and available GitHub-token provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$GITHUB_TOKEN" || { echo "::error::GitHub Actions token missing"; exit 1; }
          if [[ -n "$OPENAI_API_KEY" ]]; then echo "Using configured OpenAI aider provider"; else echo "No OpenAI secret: using GitHub Copilot CLI via GITHUB_TOKEN"; fi
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'agent-approved' || { echo "::error::Issue requires agent-approved label"; exit 1; }
          gh issue view "$ISSUE_NUMBER" --json state --jq .state | grep -qx OPEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install AI coding agent and browser QA dependencies
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            python -m pip install 'aider-chat==0.86.1'
          else
            npm install -g --no-audit --no-fund @github/copilot
          fi
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run bounded OpenAI or built-in GitHub Copilot repair loop and open review PR
        shell: bash
        run: bash scripts/autonomous_dev_agent.sh
      - name: Record bounded agent failure without claiming completion
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const number=Number(process.env.ISSUE_NUMBER);
            if(!Number.isSafeInteger(number)||number<=0)throw Error('Invalid approved task number');
            const marker='[agent-run:'+context.runId+']';
            const old=await github.paginate(github.rest.issues.listComments,{
              ...context.repo,issue_number:number,per_page:100});
            if(old.some(c=>(c.body||'').includes(marker)))return;
            await github.rest.issues.createComment({...context.repo,issue_number:number,
              body:[marker,'AI 자동 개발 또는 최대 5회 자동 수정·QA가 실패했습니다.',
                '변경사항을 운영 환경에 배포하지 않았습니다.',
                'API 키가 없으면 GitHub Actions 기본 토큰으로 Copilot CLI 대체 실행을 시도합니다.',
                '원인 및 재시도 기록: https://github.com/'+context.repo.owner+'/'+
                  context.repo.repo+'/actions/runs/'+context.runId,
                '자동 재시도 한계를 넘는 변경은 사람의 검토 또는 새로운 수정 전략이 필요합니다.'
              ].join('\\n')});
