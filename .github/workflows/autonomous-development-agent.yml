name: autonomous-development-agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing GitHub issue number with approved development task'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: autonomous-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  capture-intake:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-approved'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve approved Issue as a separate trusted receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/issue_intake_receipt.mjs

  develop:
    needs: capture-intake
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-approved'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not embed a repository-write credential into .git/config where
          # model-proposed JavaScript QA could read it before PR review.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved task and available GitHub-token provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$GITHUB_TOKEN" || { echo "::error::GitHub Actions token missing"; exit 1; }
          echo "Approved task will be executed under READ-only token and a provider selected after dependency install."
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'agent-approved' || { echo "::error::Issue requires agent-approved label"; exit 1; }
          gh issue view "$ISSUE_NUMBER" --json state --jq .state | grep -qx OPEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install AI provider without supplying the provider secret to package installers
        env:
          AIDER_ENABLED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$AIDER_ENABLED" == 'true' ]]; then
            python -m pip install 'aider-chat==0.86.1'
          else
            npm install -g --no-audit --no-fund @github/copilot
          fi
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Generate validated patch with READ-only token; do not push or create PR
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/autonomous_dev_agent.sh
      - name: Hand off only static patch data to separately authorized job
        uses: actions/upload-artifact@v4
        with:
          name: agent-validated-patch
          path: |
            ${{ runner.temp }}/agent-validated.patch
            ${{ runner.temp }}/agent-base-sha.txt
            ${{ runner.temp }}/agent-issue-number.txt
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: develop
    if: needs.develop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-validated-patch
          path: ${{ runner.temp }}/agent-patch
      - name: Reconfirm exact approved issue; never trust issue prompt as commands
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]{1,8}$ ]]
          gh issue view "$ISSUE_NUMBER" --json state --jq .state | grep -qx OPEN
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx agent-approved
      - name: Static patch validation and publish review-only branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/agent-patch/agent-base-sha.txt"
          patch="$RUNNER_TEMP/agent-patch/agent-validated.patch"
          issue="$RUNNER_TEMP/agent-patch/agent-issue-number.txt"
          test "$(git rev-parse HEAD)" = "$(cat "$base")"
          git apply --check -- "$patch"
          branch="agent/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git apply --index -- "$patch"
          node scripts/security/validate_agent_publish_patch.mjs "$patch" "$base" "$issue"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "agent: validated proposal for issue #$ISSUE_NUMBER"
          # No AI/QA code runs in this privileged job; push and PR creation only.
          gh auth setup-git
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "agent: approved issue #$ISSUE_NUMBER" --body "Static verified patch for approved #$ISSUE_NUMBER. AI/provider and QA ran in a separate READ-only token job. Requires human review, CI and separate release approval; no auto-merge or production deployment."

  report-failure:
    needs: [capture-intake, develop, publish]
    if: always() && (needs.capture-intake.result == 'failure' || needs.develop.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - name: Record incomplete AI run without claiming code/PR success
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          CAPTURE_RESULT: ${{ needs.capture-intake.result }}
          DEVELOP_RESULT: ${{ needs.develop.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const issue=Number(process.env.ISSUE_NUMBER);
            if(!Number.isSafeInteger(issue)||issue<1)throw Error('INVALID_ISSUE_NUMBER');
            const text=[
              '[agent-run:'+context.runId+']',
              'AI 자동 개발 또는 승인/PR 게시가 미완료입니다. 서비스 배포 성공을 의미하지 않습니다.',
              'capture='+process.env.CAPTURE_RESULT,
              'develop='+process.env.DEVELOP_RESULT,
              'publish='+process.env.PUBLISH_RESULT,
              '실행: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId
            ].join('\n');
            await github.rest.issues.createComment({...context.repo,issue_number:issue,body:text});
