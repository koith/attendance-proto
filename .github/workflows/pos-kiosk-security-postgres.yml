name: pos-kiosk-security-postgres
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261015161000_pos_kiosk_session_gate_v1.sql'
      - 'supabase/migrations/20261015194500_pos_v096_public_cards.sql'
      - 'qa_pos_v096_card_restore_postgres.sql'
      - 'qa_pos_kiosk_auth_postgres.sql'
      - '.github/workflows/pos-kiosk-security-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261015161000_pos_kiosk_session_gate_v1.sql'
      - 'supabase/migrations/20261015194500_pos_v096_public_cards.sql'
      - 'qa_pos_v096_card_restore_postgres.sql'
      - 'qa_pos_kiosk_auth_postgres.sql'
      - '.github/workflows/pos-kiosk-security-postgres.yml'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: kiosk_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiosk_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture_only
      PGDATABASE: kiosk_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Test kiosk credential gate and isolation
        run: psql -v ON_ERROR_STOP=1 -f qa_pos_kiosk_auth_postgres.sql
      - name: Verify public v0.96 card state, old private ACL and staged-store exclusion
        run: psql -v ON_ERROR_STOP=1 -f qa_pos_v096_card_restore_postgres.sql
