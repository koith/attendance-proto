name: adversarial-audit-v2-regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adversarial acceptance checks
        run: node qa_adversarial_audit_v2.mjs
      - name: Store scope checks
        run: node qa_pin_rpc_store_scope_v1.mjs
      - name: NULL PIN rejection regression
        run: node qa_null_pin_auth_fail_closed_v1.mjs
      - name: Substitution candidate and staged-store isolation
        run: node qa_substitution_candidate_store_guard_v1.mjs
      - name: Employee PIN creation validation
        run: node qa_create_employee_pin_required_v1.mjs

      - name: Onboarding PIN creation validation
        run: node qa_staff_creation_pin_required_v1.mjs
