name: ux-v11-targeted-patch
on:
  push:
    branches: [chatgpt-ux-v1.1-mobile-repair]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ux-v1.1-mobile-repair
          fetch-depth: 1
      - name: Patch legacy shell and navigation safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='if(h==="admin"){ const q=new URLSearchParams(location.search); if(!q.has("legacyAdmin")){ location.replace("admin_hub.html"); return; } setTab("admin"); requireAuth(async()=>{ if(q.get("returnHub")==="1"){ location.replace("admin_hub.html"); return; } await renderAdmin(); if(q.get("openSchedule")==="1") openScheduleModal(); else if(q.get("task")==="employees"||q.get("task")==="docs") document.getElementById("adEmps")?.scrollIntoView({block:"start"}); else if(q.get("task")==="today") document.getElementById("adList")?.scrollIntoView({block:"start"}); }); }'
          new='if(h==="admin"){ const q=new URLSearchParams(location.search); setTab("admin"); requireAuth(async()=>{ await renderAdmin(); if(q.get("task")==="employees"||q.get("task")==="docs") document.getElementById("adEmps")?.scrollIntoView({block:"start"}); else if(q.get("task")==="today") document.getElementById("adList")?.scrollIntoView({block:"start"}); }); }'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('admin route anchor missing')
          anchor='    <div id="adReqSection"></div>\n'
          quick='''    <section class="admin-quick" aria-label="빠른 메뉴">\n      <div class="admin-quick-title"><b>빠른 메뉴</b></div>\n      <div class="admin-quick-grid">\n        <button type="button" id="quickSchedule"><span>📅</span><b>스케줄</b></button>\n        <button type="button" id="quickEmployees"><span>👤</span><b>직원</b></button>\n        <button type="button" id="quickContracts"><span>💼</span><b>계약</b></button>\n        <button type="button" id="quickDocs"><span>📄</span><b>계약서</b></button>\n      </div>\n      <a class="admin-review-link" href="attendance_review.html">근태 확인 <span>›</span></a>\n    </section>\n    <div id="adReqSection"></div>\n'''
          if anchor in s: s=s.replace(anchor,quick,1)
          elif 'id="quickSchedule"' not in s: raise SystemExit('admin quick anchor missing')
          old='  document.getElementById("adSched").onclick=()=>openScheduleModal();'
          new='  document.getElementById("adSched").onclick=()=>{ location.href="daily_schedule.html"; };'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('daily schedule anchor missing')
          bind='''  document.getElementById("quickSchedule").onclick=()=>{ location.href="daily_schedule.html"; };\n  document.getElementById("quickEmployees").onclick=()=>document.getElementById("adEmps")?.scrollIntoView({behavior:"smooth",block:"start"});\n  document.getElementById("quickContracts").onclick=()=>{ location.href="employment_contracts.html"; };\n  document.getElementById("quickDocs").onclick=()=>document.getElementById("adEmps")?.scrollIntoView({behavior:"smooth",block:"start"});\n'''
          sched='  document.getElementById("adSchedMonth").onclick=()=>{ location.href="monthly_schedule.html"; };\n'
          if bind not in s:
            if sched not in s: raise SystemExit('quick bind anchor missing')
            s=s.replace(sched,sched+bind,1)
          old='''    div.innerHTML=`<div class="nm" style="flex:1">${e.name}</div>\n      <button class="btn btn-secondary btn-sm" data-docs="${e.id}">계약서</button>\n      <button class="btn btn-danger btn-sm" data-deact="${e.id}">비활성화</button>`;'''
          new='''    div.innerHTML=`<div class="nm" style="flex:1">${e.name}</div>\n      <button class="btn btn-secondary btn-sm" data-contract="${e.id}">계약</button>\n      <button class="btn btn-secondary btn-sm" data-docs="${e.id}">계약서</button>\n      <button class="btn btn-danger btn-sm" data-deact="${e.id}">비활성화</button>`;'''
          if old in s: s=s.replace(old,new,1)
          elif 'data-contract=' not in s: raise SystemExit('employee contract anchor missing')
          docs='    div.querySelector("[data-docs]").onclick=()=>openDocsModal(e);\n'
          con='    div.querySelector("[data-contract]").onclick=()=>{ location.href=`employment_contracts.html?employee=${e.id}`; };\n'
          if con not in s:
            if docs not in s: raise SystemExit('employee contract bind missing')
            s=s.replace(docs,con+docs,1)
          css='''\n  /* V1.1 admin landing / mobile Safari guards */\n  button,a,.btn,.emp,.att-card,.tabs a{touch-action:manipulation;}\n  .admin-quick{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:16px;}\n  .admin-quick-title{font-size:.82rem;color:var(--text-muted);margin-bottom:10px;}\n  .admin-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}\n  .admin-quick-grid button{min-width:0;min-height:64px;border:1px solid var(--border);border-radius:12px;background:var(--surface-muted);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 3px;}\n  .admin-quick-grid button span{font-size:1.15rem}.admin-quick-grid button b{font-size:.73rem;font-weight:650;}\n  .admin-review-link{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:8px;padding:0 4px;color:var(--brand-700);text-decoration:none;font-size:.84rem;}\n  .modal,.modal *{min-width:0;box-sizing:border-box}.modal .field input,.modal .field select,.modal .field textarea{width:100%;max-width:100%;min-width:0;}\n  @media(max-width:430px){.admin-quick-grid{gap:6px}.admin-quick-grid button{min-height:60px}.modal{max-width:calc(100vw - 24px)!important;margin-left:auto;margin-right:auto}.modal .field input[type=datetime-local],.modal .field input[type=date],.modal .field input[type=time]{width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;}}\n'''
          marker='  /* ---------- ADMIN ---------- */\n'
          if 'V1.1 admin landing / mobile Safari guards' not in s:
            if marker not in s: raise SystemExit('css admin marker missing')
            s=s.replace(marker,css+marker,1)
          p.write_text(s)

          p=Path('monthly_schedule.js'); s=p.read_text()
          old="function wizardPayload(){const emp=currentEmp();if(!emp)return[];const prefix=`${emp.id}|`;return draftPayload().filter(x=>String(x.employee_id)===String(emp.id))}"
          new="function wizardProjectedPayload(){const emp=currentEmp();if(!emp)return[];const temp=new Map();for(const[k,r]of S.draft)if(k.startsWith(`${emp.id}|`))temp.set(k,r);for(const d of S.selected){const k=rowKey(emp.id,d),o=S.original.get(k)||null,n=normRow(S.mode==='OFF'?{employee_id:emp.id,work_date:d,status:'OFF'}:{employee_id:emp.id,work_date:d,status:'WORK',planned_start:S.start,planned_end:S.end});if(sameRow(o,n))temp.delete(k);else temp.set(k,n)}return[...temp].map(([k,r])=>{const[e,d]=k.split('|');return r?{op:'SET',employee_id:Number(e),work_date:d,status:r.status,planned_start:r.planned_start,planned_end:r.planned_end,memo:r.memo||null}:{op:'DELETE',employee_id:Number(e),work_date:d}})}function wizardPayload(){return wizardProjectedPayload()}"
          if old in s: s=s.replace(old,new,1)
          elif 'function wizardProjectedPayload()' not in s: raise SystemExit('wizard payload anchor missing')
          s=s.replace("${wizardPayload().length}건 일정 저장","${wizardProjectedPayload().length?`${wizardProjectedPayload().length}건 일정 저장`:'변경할 일정 없음'}",1)
          s=s.replace("document.getElementById('back').onclick=()=>location.href='admin_hub.html';","document.getElementById('back').onclick=()=>location.href='index.html#admin';",1)
          p.write_text(s)

          p=Path('employment_contracts_v3.js'); s=p.read_text()
          s=s.replace("el('back').onclick=()=>location.href='admin_hub.html';render()","const requested=Number(new URLSearchParams(location.search).get('employee'));el('back').onclick=()=>location.href='index.html#admin';if(requested&&S.employees.some(x=>Number(x.id)===requested)){el('employee').value=String(requested);el('employee').onchange()}else render()",1)
          p.write_text(s)

          p=Path('attendance_review.js'); s=p.read_text().replace("el('back').onclick=()=>location.href='admin_hub.html';","el('back').onclick=()=>location.href='index.html#admin';",1); p.write_text(s)
          PY
      - name: Verify targeted anchors
        run: |
          grep -n 'quickSchedule' index.html
          grep -n 'daily_schedule.html' index.html monthly_schedule.html || true
          grep -n 'wizardProjectedPayload' monthly_schedule.js
          grep -n "index.html#admin" monthly_schedule.js employment_contracts_v3.js attendance_review.js
          node --check daily_schedule.js
          node --check monthly_schedule.js
          node --check employment_contracts_v3.js
          node --check attendance_review.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+koith@users.noreply.github.com
          git add index.html monthly_schedule.js employment_contracts_v3.js attendance_review.js
          git commit -m 'fix: repair admin landing navigation and monthly save count'
          git push
