name: SEC recovery-autopilot isolation and policy QA
on:
  pull_request:
    paths:
      - 'security/autopilot/**'
      - 'SECURITY_STABILITY_LEDGER_20261103.md'
      - 'AI_AUTOMATION_SECURITY_LEDGER_20261104.md'
      - 'scripts/security/autopilot/**'
      - 'qa/security/autopilot/**'
      - '.github/workflows/sec-autonomous-recovery.yml'
      - '.github/workflows/sec-autopilot-contract-ci.yml'
permissions:
  contents: read
jobs:
  policy-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check trusted autodev tooling
        run: |
          node --check scripts/security/autopilot/select_task.mjs
          node --check scripts/security/autopilot/safe_edits.mjs
          node --check scripts/security/autopilot/propose.mjs
          for f in scripts/security/autopilot/*_guard.mjs; do node --check "$f"; done
      - name: Synthetic ledgers, injection defenses, recovery hooks and file guard tests
        run: node --test qa/security/autopilot/*.test.mjs
      - name: Prove runtime isolation for generated QA in a disposable container
        shell: bash
        run: |
          set -euo pipefail
          qa_job="$(sed -n '/^  qa:/,/^  publish:/p' .github/workflows/sec-autonomous-recovery.yml)"
          grep -F -- 'docker run --rm --network none --read-only --cap-drop ALL' <<< "$qa_job" >/dev/null
          grep -F -- '--security-opt no-new-privileges' <<< "$qa_job" >/dev/null
          grep -F -- '-v "$PWD":/src:ro' <<< "$qa_job" >/dev/null
          ! grep -Eq '(GH_TOKEN|OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY):' <<< "$qa_job"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --user 1000:1000 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -v "$PWD":/src:ro -w /src node:22-alpine \
            node qa/security/autopilot/isolation_canary.mjs
      - name: Verify no production secrets or operating files in this PR
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD | grep -E '^((\.github/workflows/sec-autonomous-recovery\.yml)|(\.github/workflows/sec-autopilot-contract-ci\.yml)|(security/autopilot/)|(SECURITY_STABILITY_LEDGER_20261103[.]md$)|(AI_AUTOMATION_SECURITY_LEDGER_20261104[.]md$)|(scripts/security/autopilot/)|(qa/security/autopilot/))' >/dev/null
          if git diff --name-only HEAD^ HEAD | grep -Ev '^((\.github/workflows/sec-autonomous-recovery\.yml)|(\.github/workflows/sec-autopilot-contract-ci\.yml)|(security/autopilot/)|(SECURITY_STABILITY_LEDGER_20261103[.]md$)|(AI_AUTOMATION_SECURITY_LEDGER_20261104[.]md$)|(scripts/security/autopilot/)|(qa/security/autopilot/))'; then
            echo 'SEC_AUTO_DISALLOWED_CHANGED_PATH'; exit 1
          fi
