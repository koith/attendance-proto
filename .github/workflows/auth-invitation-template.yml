name: Auth invitation Korean template QA and publication

on:
  pull_request:
    paths:
      - 'supabase/email-templates/invite.html'
      - 'scripts/apply_supabase_invite_email.mjs'
      - '.github/workflows/auth-invitation-template.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/email-templates/invite.html'
      - 'scripts/apply_supabase_invite_email.mjs'
      - '.github/workflows/auth-invitation-template.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Korean invitation HTML, branding, and invite link
        run: node scripts/apply_supabase_invite_email.mjs --dry-run
      - name: Publish template to hosted Supabase Auth (only on trusted main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: waluhdgqhwjjwmflhrle
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Supabase auth template pending::Management API credential SUPABASE_ACCESS_TOKEN is not configured; the Korean template was validated but has NOT been applied to outgoing Auth emails."
            echo "PENDING_AUTH_WRITE_ACCESS: live Auth mailer template unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/apply_supabase_invite_email.mjs --apply
          echo "APPLIED_VERIFIED: Korean template applied and read back from hosted Auth service." >> "$GITHUB_STEP_SUMMARY"
