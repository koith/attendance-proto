name: Live version-controls QA
on:
  pull_request:
    paths:
      - 'qa_live_version_test_controls_v1.mjs'
      - 'qa_live_guest_pos_readonly_browser_v384.mjs'
      - '.github/workflows/publish-pages.yml'
      - '.github/workflows/qa-live-test-controls-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script syntax and source version
        run: |
          node --check qa_live_version_test_controls_v1.mjs
          node --check version_test_toggle_982.js
      - name: Install Chromium and Safari-compatible WebKit
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Test actual published Pages LIVE/clock toggle
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_live_version_test_controls_v1.mjs
      - name: Production public POS and store access boundaries (read-only RPC)
        run: |
          node qa_pos_guest_live_rpc_v1.mjs
          node qa_production_store_boundary_v1.mjs
      - name: Live published POS cards and STAGED denial on Chromium/WebKit mobile and desktop
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_live_guest_pos_readonly_browser_v384.mjs
