name: QA1243 public Auth four-field review and existing write access inspection
on:
  pull_request:
    paths:
      - 'scripts/qa1243_auth_four_fields.mjs'
      - 'scripts/qa1243_auth_mail_branding.mjs'
      - 'scripts/qa1243_auth_mail_branding.test.mjs'
      - 'supabase/email-templates/invite.html'
      - 'supabase/email-templates/recovery.html'
      - 'scripts/qa1243_auth_four_fields.test.mjs'
      - '.github/workflows/qa1243-auth-four-fields.yml'
      - '.github/workflows/p0-pages-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa1243_auth_four_fields.mjs'
      - 'scripts/qa1243_auth_mail_branding.mjs'
      - 'scripts/qa1243_auth_mail_branding.test.mjs'
      - 'supabase/email-templates/invite.html'
      - 'supabase/email-templates/recovery.html'
      - 'scripts/qa1243_auth_four_fields.test.mjs'
      - '.github/workflows/qa1243-auth-four-fields.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Review only or apply the four user-authorized fields
        type: choice
        options: [REVIEW, APPLY]
        default: REVIEW
      before_sha256:
        description: Reviewed four-field preimage SHA256 (empty uses the recorded approved preimage)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: qa1243-auth-four-fields-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Four-field scope, no-secret review, concurrency and rollback QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/qa1243_auth_four_fields.mjs
      - run: node scripts/qa1243_auth_four_fields.test.mjs
      - run: node scripts/qa1243_auth_mail_branding.test.mjs
  repository:
    name: Review actual public four fields and existing repository access
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      inspect-production: ${{ steps.access.outputs.inspect-production }}
      operation: ${{ steps.access.outputs.operation }}
      before-sha: ${{ steps.access.outputs.before-sha }}
      write-context: ${{ steps.access.outputs.write-context }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: access
        name: Inspect known credential presence and existing environment metadata
        uses: actions/github-script@v7
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const {fourFieldExecution}=await import(process.env.GITHUB_WORKSPACE+'/scripts/qa1243_auth_four_fields.mjs');
            const execution=fourFieldExecution({eventName:context.eventName,ref:context.ref,
              message:context.payload.head_commit?.message,operation:context.payload.inputs?.operation,
              beforeSha:context.payload.inputs?.before_sha256});
            core.setOutput('operation',execution.mode);
            core.setOutput('before-sha',execution.beforeSha||'');
            core.info('QA1243_AUTH_FOUR_FIELD_EXECUTION '+JSON.stringify(execution));
            if(execution.mode==='BLOCKED'){core.setFailed(execution.reason);return;}
            const present=name=>Boolean(String(process.env[name]||'').trim());
            const read=present('SUPABASE_AUTH_READ_TOKEN'),write=present('SUPABASE_AUTH_WRITE_TOKEN'),legacy=present('SUPABASE_ACCESS_TOKEN');
            const report={scopedReadPresent:read,scopedWritePresent:write,legacyManagementPresent:legacy,writeCandidatePresent:write||legacy};
            core.setOutput('read-present',String(read||legacy));
            core.info('QA1243_AUTH_REPOSITORY_ACCESS_PRESENCE '+JSON.stringify(report));
            let environmentRead=null;
            if(!write&&!legacy){
              try{const r=await github.rest.repos.getEnvironment({...context.repo,environment_name:'production'});
                environmentRead={status:r.status,data:r.data};
              }catch(error){environmentRead={status:Number.isInteger(error.status)?error.status:null};}
            }
            const {selectHostedAuthReadContext}=await import(process.env.GITHUB_WORKSPACE+'/scripts/qa1243_auth_config_verdict.mjs');
            const route=selectHostedAuthReadContext({dedicatedPresent:write,existingPresent:legacy,environmentRead});
            core.setOutput('inspect-production',String(route.context==='EXISTING_PRODUCTION'));
            core.setOutput('write-context',route.context);
            core.info('QA1243_AUTH_EXISTING_WRITE_CONTEXT '+JSON.stringify(route));
      - name: GET and review only the four explicitly requested public values
        if: steps.access.outputs.read-present == 'true'
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/qa1243_auth_four_fields.mjs --review
      - name: Record execution boundary
        if: always()
        run: echo 'Repository stage is GET/presence only. Only explicit trusted-main four-field apply jobs below may PATCH the four authorized settings. SMTP, mail, accounts, SQL, READY, SEC01, Sheets and deployment remain outside scope.' >> "$GITHUB_STEP_SUMMARY"
  existing-production:
    name: Inspect existing protected production write credential presence only
    needs: repository
    if: always() && needs.repository.outputs.inspect-production == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const present=name=>Boolean(String(process.env[name]||'').trim());
            const scoped=present('SUPABASE_AUTH_WRITE_TOKEN'),legacy=present('SUPABASE_ACCESS_TOKEN');
            core.info('QA1243_AUTH_PRODUCTION_WRITE_PRESENCE '+JSON.stringify({scopedWritePresent:scoped,
              legacyManagementPresent:legacy,writeCandidatePresent:scoped||legacy,
              reason:scoped||legacy?'EXISTING_WRITE_CANDIDATE_REQUIRES_SCOPE_VERIFICATION':'EXISTING_WRITE_CREDENTIAL_ABSENT'}));
            await core.summary.addRaw('Presence only. Existing protected production context retained; no deployment or write.').write();
  apply-repository:
    name: Apply only the four approved Auth fields using existing repository access
    needs: repository
    if: needs.repository.result == 'success' && needs.repository.outputs.operation == 'APPLY' && needs.repository.outputs.write-context == 'REPOSITORY' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.apply.outputs.verified_fields }}
      attempted: ${{ steps.apply.outputs.patch_attempted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Approved preimage, four-key PATCH and GET verification (no SMTP or data writes)
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QA1243_AUTH_FOUR_FIELD_SCOPE: ISSUE_1243_APPROVED_FOUR_FIELDS
          QA1243_AUTH_EXPECTED_BEFORE_SHA256: ${{ needs.repository.outputs.before-sha }}
        run: node scripts/qa1243_auth_four_fields.mjs --apply --github-output
  apply-existing-production:
    name: Apply only the four approved Auth fields in the confirmed existing environment
    needs: [repository, existing-production]
    if: always() && needs.repository.result == 'success' && needs.existing-production.result == 'success' && needs.repository.outputs.operation == 'APPLY' && needs.repository.outputs.write-context == 'EXISTING_PRODUCTION' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.apply.outputs.verified_fields }}
      attempted: ${{ steps.apply.outputs.patch_attempted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Approved preimage, four-key PATCH and GET verification (no SMTP or data writes)
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QA1243_AUTH_FOUR_FIELD_SCOPE: ISSUE_1243_APPROVED_FOUR_FIELDS
          QA1243_AUTH_EXPECTED_BEFORE_SHA256: ${{ needs.repository.outputs.before-sha }}
        run: node scripts/qa1243_auth_four_fields.mjs --apply --github-output
  approved-mail-branding:
    name: Apply approved branded invite and recovery templates with existing Auth access
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[QA1243-AUTH-MAIL-BRANDING]')
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing credential check, four email fields only and independent GET readback
        env:
          SUPABASE_AUTH_READ_TOKEN: ${{ secrets.SUPABASE_AUTH_READ_TOKEN }}
          SUPABASE_AUTH_WRITE_TOKEN: ${{ secrets.SUPABASE_AUTH_WRITE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QA1243_AUTH_MAIL_BRANDING_APPROVED: ISSUE_1243_EMAIL_DESIGN_APPROVED
        run: node scripts/qa1243_auth_mail_branding.mjs --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-auth-mail-branding-receipt
          path: qa-results/auth-mail-branding


  refresh-readonly-audit:
    name: Dispatch the existing independent read-only audit after verified or attempted apply
    needs: [apply-repository, apply-existing-production]
    if: always() && github.ref == 'refs/heads/main' && (needs.apply-repository.outputs.verified == 'true' || needs.apply-existing-production.outputs.verified == 'true' || needs.apply-repository.outputs.attempted == 'true' || needs.apply-existing-production.outputs.attempted == 'true')
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,
              workflow_id:'qa1243-operational-readonly.yml',ref:'main'});
            core.info('Dispatched existing GET-only Auth audit; its workflow_run refreshes the existing opening gate. No mail/Auth8/Google/Pages workflow is dispatched.');
