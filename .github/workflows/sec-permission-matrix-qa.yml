name: SEC S05-S10 permission-matrix regression
on:
  pull_request:
    paths:
      - 'scripts/security/run_permission_matrix_qa.mjs'
      - '.github/workflows/sec-permission-matrix-qa.yml'
  push:
    branches: [main]
    paths: ['.github/workflows/sec-permission-matrix-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/security/run_permission_matrix_qa.mjs
      - name: Run role-specific source contracts with scrubbed environment
        run: node scripts/security/run_permission_matrix_qa.mjs
