name: QA1243 independent v0.354 owner READY Pages readback
on:
  workflow_run:
    workflows: ["p0-pages-deploy"]
    types: [completed]
permissions:
  contents: read
jobs:
  qa1243-owner-ready-independent:
    name: Independently check published HQ app version without operating writes
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[QA1243-APP-PAGES]') && contains(github.event.workflow_run.head_commit.message, '[QA1243-NO-OPERATING-WRITE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent HTTP readback of live index.html and owner-ready JS digest
        run: |
          if [[ "${{ contains(github.event.workflow_run.head_commit.message, '[INHA-STAFF-STOCKTAKE]') }}" == "true" ]]; then
            node scripts/inha_staff_stocktake_readback.mjs --independent
          elif [[ "${{ (contains(github.event.workflow_run.head_commit.message, '[QA1243-LEGACY-ENTRY]') || contains(github.event.workflow_run.head_commit.message, '[INHA-STAFF-STOCKTAKE]')) }}" == "true" ]]; then
            GITHUB_SHA="${{ github.event.workflow_run.head_sha }}" node scripts/qa1243_legacy_pages_readback.mjs
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-OWNER-REINVITE]') }}" == "true" ]]; then
            node scripts/qa1243_approved_opening_pages_smoke.mjs --independent --reinvite
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-OWNER-OPENING]') }}" == "true" ]]; then
            node scripts/qa1243_approved_opening_pages_smoke.mjs --independent
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-STORE-ISOLATION]') }}" == "true" ]]; then
            node scripts/qa1243_store_isolation_pages_smoke.mjs --independent
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-TEMP-OWNER-PAGES]') }}" == "true" ]]; then
            node scripts/qa1243_temp_owner_pages_smoke.mjs --independent
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-ACTIVATION-PAGES]') }}" == "true" ]]; then
            node scripts/qa1243_activation_pages_smoke.mjs --independent
          elif [[ "${{ contains(github.event.workflow_run.head_commit.message, '[QA1243-COST-PAGES]') }}" == "true" ]]; then
            node scripts/qa1243_material_cost_pages_smoke.mjs --independent
          else
            node scripts/qa1243_owner_ready_pages_smoke.mjs --independent
          fi
      - name: No operating Google or Supabase writes
        run: |
          echo 'Read-only HTTP: no operational Google Sheet or Supabase mutation.' >> "$GITHUB_STEP_SUMMARY"

  legacy-deployed-browsers:
    name: Legacy bookmarks on deployed Pages in WebKit and Chromium (read-only)
    needs: qa1243-owner-ready-independent
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (contains(github.event.workflow_run.head_commit.message, '[QA1243-LEGACY-ENTRY]') || contains(github.event.workflow_run.head_commit.message, '[INHA-STAFF-STOCKTAKE]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned existing browser runtime
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Open exact deployed old and new URLs, reload and restart both browsers
        run: |
          if [[ "${{ contains(github.event.workflow_run.head_commit.message, '[INHA-STAFF-STOCKTAKE]') }}" == "true" ]]; then
            node qa_inha_staff_stocktake_browser.mjs --live
          else
            node qa_legacy_entry_browser_v372.mjs --live
          fi
      - name: Preserve read-only actual deployed URL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-entry-deployed-proof
          path: qa-results/*live.json
          if-no-files-found: warn
