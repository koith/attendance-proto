name: p0-pages-deploy

on:
  pull_request:
    paths:
      - 'index.html'
      - 'qa_boot_syntax.mjs'
      - 'qa_index_startup_smoke_v1.mjs'
      - 'qa_adversarial_audit_v2.mjs'
      - 'qa_deep_audit_v1.mjs'
      - 'qa_runtime_wiring_v1.mjs'
      - 'qa_sheet_auto_resize_contract.mjs'
      - 'qa_sheet_display_values.mjs'
      - 'qa_sheet_new_month_format_contract.mjs'
      - 'qa_server_owned_sheet_v1.mjs'
      - 'supabase/functions/server-sync-sheet/**'
      - '.github/workflows/p0-pages-deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_gate_failure:
        description: 'Intentionally fail P0 gate to prove deploy is blocked'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  p0-gate:
    name: P0 deployment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: boot-syntax-regression
        run: node qa_boot_syntax.mjs
      - name: index-startup-smoke-v1
        run: node qa_index_startup_smoke_v1.mjs
      - name: cross-domain adversarial audit
        run: node qa_adversarial_audit_v2.mjs
      - name: cross-domain deep audit
        run: node qa_deep_audit_v1.mjs
      - name: runtime wiring regression
        run: node qa_runtime_wiring_v1.mjs
      - name: Sheet report contracts
        run: |
          node qa_sheet_display_values.mjs
          node qa_sheet_auto_resize_contract.mjs
          node qa_sheet_new_month_format_contract.mjs
          node qa_server_owned_sheet_v1.mjs
      - name: Intentional gate failure proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_gate_failure }}
        run: |
          echo "Intentional P0 gate failure: deployment must remain blocked."
          exit 1

  build-pages:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    needs: p0-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [p0-gate, build-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy only after P0 gate passed
        id: deployment
        uses: actions/deploy-pages@v4
