permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  p0-gate:
    name: P0 deployment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A merged Edge code change must never publish its dependent Pages client
      # until the canonical server-sync-sheet deployment has an explicit receipt.
      - name: Require matching production Edge deployment receipt for changed Edge source
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const before = context.payload.before || '';
            if (!/^[0-9a-f]{40}$/.test(before) || /^0+$/.test(before)) {
              throw new Error('Cannot verify Edge deployment delta: push.before missing');
            }
            const comparison = await github.rest.repos.compareCommits({
              ...context.repo, base:before, head:context.sha
            });
            const changed = comparison.data.files || [];
            if (changed.length >= 300) {
              throw new Error('Cannot safely assess Edge deployment: commit diff truncated');
            }
            const needsEdge = changed.some(file =>
              file.filename.startsWith('supabase/functions/server-sync-sheet/') ||
              file.filename.startsWith('edge-release/supabase/functions/server-sync-sheet/'));
            if (!needsEdge) {
              core.info('No server-sync-sheet source change; Edge deployment not required.');
              return;
            }
            for (let attempt = 1; attempt <= 48; attempt++) {
              const response = await github.rest.repos.getCombinedStatusForRef({
                ...context.repo, ref:context.sha
              });
              const receipt = response.data.statuses.find(status =>
                status.context === 'edge/server-sync-sheet-deploy');
              if (receipt?.state === 'success') {
                core.info('Matching production Edge deployment receipt: ' + receipt.target_url);
                return;
              }
              if (receipt?.state === 'failure' || receipt?.state === 'error') {
                throw new Error('Production Edge deployment failed; Pages release blocked: ' +
                  (receipt.target_url || 'missing details'));
              }
              if (attempt < 48) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No successful production Edge receipt for commit ' + context.sha +
              '; refuse to publish Pages against an unverified server build.');
      - name: Verify production Edge receipt gate behavior
        run: node qa_pages_edge_receipt_gate_v1.mjs
      - name: Bounded release recovery policy and autonomous agent shell safety
        run: |
          node qa_release_recovery_policy.mjs
          node qa_release_recovery_workflow_contract.mjs
          node qa_release_asset_selection_contract_v1.mjs
          node qa_autonomous_structured_edits_v1.mjs
          node qa_autonomous_agent_bridge_receipt_v1.mjs
          bash -n scripts/autonomous_dev_agent.sh
      - name: boot-syntax-regression
        run: node qa_boot_syntax.mjs
      - name: HQ readiness and operations failure integrity
        run: node qa_operational_readiness_fail_closed_v1.mjs
      - name: Inventory renderer syntax and editor wiring guard
        run: |
          node --check operations_reference_ui_v208.js
          node --check operations_v1.js
          node qa_inventory_editor_wiring_v1.mjs
      - name: POS asynchronous route guard
        run: node qa_pos_route_async_guard_v1.mjs
      - name: Manual attendance creation and midnight/partial failure regression
        run: node qa_actual_attendance_manual_add_v1.mjs
      - name: Overnight IN/OUT pairing and redundant 26-hour closure
        run: node qa_actual_attendance_overnight_pairing_v1.mjs
      - name: POS white screen and stalled mobile store lookup regression
        run: node qa_pos_startup_network_timeout_v1.mjs
      - name: index-startup-smoke-v1
        run: node qa_index_startup_smoke_v1.mjs
      - name: cross-domain adversarial audit
        run: node qa_adversarial_audit_v2.mjs
      - name: cross-domain deep audit
        run: node qa_deep_audit_v1.mjs
      - name: runtime wiring regression
        run: node qa_runtime_wiring_v1.mjs
      - name: HQ dashboard authorization regression
        run: node qa_hq_dashboard_entry_auth.mjs
      - name: HQ to store dedicated navigation regression
        run: node qa_hq_store_dedicated_navigation.mjs
      - name: Parse HQ owner console before any Pages publication
        run: node --check hq_owner_console.js
      - name: Install HQ browser acceptance harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: 2026 unified province and independently sourced store addresses
        run: node qa_hq_region_2026_source_v1.mjs
      - name: HQ owner real-browser acceptance (mobile and desktop)
        run: |
          node qa_hq_quicknav_escape_contract_v1.mjs
          node qa_hq_owner_browser_acceptance.mjs
      - name: Actual attendance store isolation regression
        run: node qa_actual_attendance_store_scope_v1.mjs
      - name: Store employee contract status authorization regression
        run: node qa_employee_contract_status_store_scope_v1.mjs
      - name: Mobile store identity regression
        run: node qa_store_mobile_header_identity.mjs
      - name: Sheet report contracts
        run: |
          node qa_sheet_display_values.mjs
          node qa_sheet_auto_resize_contract.mjs
          node qa_sheet_new_month_format_contract.mjs
          node qa_server_owned_sheet_v1.mjs
          node qa_deployment_sheet_transient_retry_v1.mjs
          node qa_server_payroll_parity_v1.mjs
          node qa_server_payroll_fixture_parity_v1.mjs
          node qa_sheet_working_payable_parity_v1.mjs
