          node qa_server_sheet_test_exclusion_v1.mjs
      - name: Store payroll isolation QA
        run: node qa_multistore_payroll_isolation_v1.mjs
      - name: Live public store READY and HQ permission boundary
        run: node qa_production_store_boundary_v1.mjs
      - name: HQ store onboarding and invitation authorization regression
        run: |
          node --check hq_store_onboarding_ui.js
          node --check owner_activation.js
          node qa_hq_store_onboarding_v1.mjs
      - name: Nationwide HQ search and confirmed owner share regression
        run: node qa_hq_store_search_owner_activation_v1.mjs
      - name: Audited real-store review gate regression
        run: node qa_store_provenance_gate_v1.mjs
      - name: Confirmed owner and HQ authorization regression
        run: node qa_confirmed_owner_permission_v1.mjs
      - name: Verified active admin context gate regression
        run: node qa_admin_context_active_gate_v1.mjs
      - name: Staff recipe READY-only store authorization regression
        run: node qa_staff_recipe_ready_guard_v1.mjs
      - name: Staff recipe on-shift PIN and no public bypass
        run: |
          node --check recipe_access_v220.js
          node qa_recipe_staff_shift_only_v1.mjs
      - name: Source recipe must not ship in the anonymous Pages bundle
        run: |
          node --check operations_reference_ui_v208.js
          node qa_recipe_no_static_instruction_leak_v1.mjs
      - name: Attendance correction reason audit regression
        run: node qa_event_correction_reason_guard_v1.mjs
      - name: READY-only dedicated store route regression
        run: node qa_store_entry_ready_lock_v1.mjs
      - name: STAGED store active flag consistency regression
        run: node qa_staged_store_active_consistency_v1.mjs
      - name: Sample roster activation denial and HQ-only visibility regression
        run: node qa_hq_sample_roster_activation_guard_v1.mjs
      - name: Store-isolated sales and CSV import regression
        run: |
          node qa_store_operations_isolation_v1.mjs
          node qa_store_operations_reconciliation_ui_v1.mjs
          node qa_operations_real_ledger_export_v1.mjs
          node qa_operations_demo_metrics_guard_v1.mjs
      - name: Multi-store inventory ledger regression
        run: |
          node qa_store_inventory_isolation_v1.mjs
          node qa_store_stocktake_ui_v1.mjs
      - name: Legacy global admin RPC HQ scope regression
        run: node qa_global_admin_rpc_hq_boundary_v1.mjs
      - name: Store owner revocation and activation security regression
        run: node qa_store_owner_revocation_hardening_v1.mjs
      - name: Multi-store payroll isolation regression
        run: node qa_store_payroll_isolation_v1.mjs
      - name: Payroll close and reopen server authority regression
        run: node qa_payroll_close_server_authority_v1.mjs
      - name: Browser month-close pending shift preflight regression
        run: node qa_payroll_contract_authority_v1.mjs
      - name: Weekly approval authorization QA
        run: |
          node qa_payroll_weekly_integration_v1.mjs
          node qa_weekly_approval_rpc_guard_v1.mjs
          node qa_weekly_approval_service_boundary_v1.mjs
          node qa_weekly_decision_end_to_end_v1.mjs
          node qa_weekly_cross_month_close_guard_v1.mjs
          node qa_weekly_scoped_close_lock_v1.mjs
          node qa_weekly_store_isolation_close_guard_v1.mjs
          node qa_payroll_policy_scenarios_v1.mjs
          node qa_payroll_week_boundary_behavior_v1.mjs
          node qa_payroll_month_boundary_v1.mjs
          node qa_attendance_correction_tiebreak_v1.mjs
          node qa_payroll_no_future_month_salary_v1.mjs
          node qa_payroll_unfinished_month_boundary_v1.mjs
          node qa_payroll_monday_month_no_local_work_v1.mjs
          node qa_payroll_inactive_monday_month_v1.mjs
          node qa_payroll_approval_engine_fixture_v1.mjs
          node qa_night_pay_seconds_v1.mjs
          node qa_break_not_considered_alias_v1.mjs
          node qa_monthly_contract_salary_authority_v1.mjs
          node qa_monthly_current_accrual_v1.mjs
          node qa_payroll_contract_transition_fail_closed_v1.mjs
          node qa_monthly_segments_report_parity_v1.mjs
          node qa_hourly_segments_sheet_parity_v1.mjs
          node qa_payroll_won_truncation_v1.mjs
          node qa_payroll_weekly_substitution_boundary_v1.mjs
          node qa_server_night_single_premium_v1.mjs
      - name: Verify deploy smoke scripts parse
        run: |
          node --check qa_production_deployment_health_v1.mjs
          node --check qa_browser_app_smoke.mjs
      - name: Intentional gate failure proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_gate_failure }}
        run: |
          echo "Intentional P0 gate failure: deployment must remain blocked."
          exit 1

  build-pages:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    needs: p0-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  notify-deployment-result:
    name: Same-run Pages validation (final alert only after independent verification)
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [p0-gate, build-pages, deploy-pages]
    runs-on: ubuntu-latest
    concurrency:
      group: verified-deployment-alert-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve merged request changes for live verification
        id: request_changes
        if: ${{ needs['p0-gate'].result == 'success' && needs['build-pages'].result == 'success' && needs['deploy-pages'].result == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const prs=await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,commit_sha:context.sha});
            const merged=prs.data.filter(p=>p.merged_at);
            let files=[];
            if(merged.length){
              for(const pr of merged){
                const list=await github.paginate(github.rest.pulls.listFiles,{
                  ...context.repo,pull_number:pr.number,per_page:100});
                if(list.length>=300)throw Error('Truncated PR changed files');
                files.push(...list.map(f=>f.filename));
              }
            }else{
              const commit=await github.rest.repos.getCommit({...context.repo,ref:context.sha});
              files=(commit.data.files||[]).map(f=>f.filename);
            }
            if(!files.length)throw Error('No request changes found');
            fs.writeFileSync('/tmp/release-request-files.json',JSON.stringify([...new Set(files)]));
            core.info('Request change evidence: '+files.join(', '));
      - name: Compare changed public files against actual published bytes
        id: request_live
        if: steps.request_changes.outcome == 'success'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          CHANGED_RELEASE_FILES="$(cat /tmp/release-request-files.json)" node qa_release_changed_assets_live.mjs
      - name: Double-check live Pages version and guarded payroll endpoint
        id: final_health
        if: steps.request_live.outcome == 'success'
        run: |
          # Pages CDN propagation can briefly lag a successful deployment.
          # Retry only the read-only live verification, never writes or deployments.
          for attempt in 1 2 3 4 5; do
            if node qa_production_deployment_health_v1.mjs; then
              echo "Live health verified on attempt ${attempt}/5"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Live health failed after 5 attempts; release remains unverified"
              exit 1
            fi
            sleep $((attempt * 15))
          done


  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [p0-gate, build-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy only after P0 gate passed
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout tested Pages release
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live public deployment and payroll access boundary
        id: public_health
        run: |
          # Pages CDN propagation can briefly lag a successful deployment.
          # Retry only the read-only live verification, never writes or deployments.
          for attempt in 1 2 3 4 5; do
            if node qa_production_deployment_health_v1.mjs; then
              echo "Live health verified on attempt ${attempt}/5"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Live health failed after 5 attempts; release remains unverified"
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Install Chromium acceptance harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise actual published mobile and desktop routes
        id: browser_health
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_browser_app_smoke.mjs
      - name: Verify public Pages recipe asset contains no manufacturing instructions
        id: recipe_asset_health
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_public_recipe_asset_health_v1.mjs
      - name: Publish live webapp verification result
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const healthy = '${{ steps.public_health.outcome }}' === 'success' &&
                            '${{ steps.browser_health.outcome }}' === 'success' &&
                            '${{ steps.recipe_asset_health.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha:context.sha,
              state:healthy?'success':'failure',
              context:'webapp/pages-live-qa',
              target_url:'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              description:healthy?'Live Pages version, Edge authorization, mobile/desktop and recipe source QA passed':
                'Live Pages acceptance failed: inspect workflow run'
            });
      - name: Confirm immediate Sheet refresh after Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Preserve the mandatory Sheet write+column-resize proof. Google Apps Script
            // occasionally returns a transient non-JSON HTML response under load;
            // the Supabase writer explicitly signals that as SHEET_NON_JSON_RESPONSE.
            // Retry only this known transient or the database sync lease conflict.
            const audience = 'https://waluhdgqhwjjwmflhrle.supabase.co/functions/v1/server-sync-sheet';
            const token = await core.getIDToken(audience);
            let result, response, confirmed = false;
            for (let attempt = 1; attempt <= 8; attempt++) {
              response = await fetch(audience, {
                method: 'POST',
                headers: {'Content-Type':'application/json', Authorization:'Bearer ' + token},
                body: JSON.stringify({mode:'deployment'})
              });
              result = await response.json();
              if (response.ok && result.ok === true && result.written === true &&
                  result.spreadsheet_id && result.column_resize_applied === true) {
                core.info('Sheet refreshed after deployment: ' + result.ym + ' (' + result.spreadsheet_id + ')');
                confirmed = true;
                break;
              }
              const transient = (response.status === 409 && result?.error === 'SHEET_SYNC_BUSY') ||
                (response.status === 502 && result?.error === 'SHEET_NON_JSON_RESPONSE');
              if (!transient || attempt === 8) {
                throw new Error('Deployment Sheet write unconfirmed: ' + JSON.stringify(result));
              }
              const delay = result?.error === 'SHEET_SYNC_BUSY' ? 15000 : 30000;
              core.warning('Transient Sheet sync response ' + result?.error +
                '; retry ' + attempt + '/8 after ' + delay / 1000 + 's');
              await new Promise(resolve => setTimeout(resolve, delay));
            }
            if (!confirmed) throw new Error('Deployment Sheet write missing mandatory proof');

