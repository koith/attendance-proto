name: SEC backup capture isolated
on:
  # Protected recurring owner backup at 01:47 KST; no production DML.
  schedule:
    - cron: '47 16 * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      capture_scope:
        description: 'Production read-only backup; operator-triggered, never on push'
        type: choice
        required: true
        options: ['AUTH_DB_STORAGE_ENCRYPTED_ONLY']
permissions:
  contents: read
concurrency:
  group: sec-live-backup-single-run
  cancel-in-progress: false
jobs:
  sealed-capture:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.capture_scope == 'AUTH_DB_STORAGE_ENCRYPTED_ONLY')
        ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          github.event.issue.number == 1492 &&
          github.event.comment.user.login == 'koith' &&
          github.event.comment.body == '[SEC-LIVE-BACKUP-ONCE:20261107]')
      )
    runs-on: ubuntu-24.04
    environment: production-backup
    timeout-minutes: 20
    env:
      # AISEC-07 staged separation: dedicated backup-only credentials (stored
      # only as production-backup ENVIRONMENT secrets) win when present; the
      # legacy names keep the daily backup running until the owner switches.
      BACKUP_DB_READONLY_URL: ${{ secrets.BACKUP_DB_READONLY_URL }}
      BACKUP_AUTH_CONFIG_TOKEN: ${{ secrets.BACKUP_AUTH_CONFIG_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: https://waluhdgqhwjjwmflhrle.supabase.co
      PGSSLMODE: require
      SEC_BACKUP_OUT: ${{ github.workspace }}/attendance-live.sealed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure required backup connection is configured
        shell: bash
        run: |
          # Owner already opted into this protected, read-only backup by cron or
          # authenticated workflow_dispatch/Issue #1492 command. Avoid an
          # unconfigured redundant flag preventing legitimate protected backups.
          # Never bypass the real DB, Storage, or Auth credential requirements.
          ready=1
          test -n "$BACKUP_DB_READONLY_URL$SUPABASE_DB_URL" || { echo "BACKUP_BLOCKED_DB_CONNECTION"; ready=0; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "BACKUP_BLOCKED_STORAGE_CREDENTIAL"; ready=0; }
          test -n "$BACKUP_AUTH_CONFIG_TOKEN$SUPABASE_ACCESS_TOKEN" || { echo "BACKUP_BLOCKED_AUTH_CONFIG_CREDENTIAL"; ready=0; }
          # Names only, never values: which credential family this run uses.
          echo "BACKUP_DB_CREDENTIAL_SOURCE=$([ -n "$BACKUP_DB_READONLY_URL" ] && echo dedicated_readonly || echo legacy)"
          echo "BACKUP_AUTH_CREDENTIAL_SOURCE=$([ -n "$BACKUP_AUTH_CONFIG_TOKEN" ] && echo dedicated || echo legacy)"
          test "$ready" = 1 || { echo "BACKUP_BLOCKED_MISSING_REQUIRED_CREDENTIAL"; exit 1; }
          echo 'BACKUP_PROTECTED_CREDENTIALS_PRESENT=true'
      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
      - name: Read, seal and attest full archive
        run: |
          node scripts/security/capture.mjs
          test -s "$SEC_BACKUP_OUT"
      - name: Verify encrypted archive header and ciphertext checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SEC_BACKUP_OUT"
          test "$(head -c 15 "$SEC_BACKUP_OUT")" = 'BACKUP-SEALED-1'
          sha256sum "$SEC_BACKUP_OUT" | cut -d' ' -f1 | sed 's/^/SEALED_BACKUP_SHA256=/'
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-attendance-recovery
          path: ${{ github.workspace }}/attendance-live.sealed
          retention-days: 30
          if-no-files-found: error

  notify-failure:
    name: Notify owner if daily encrypted backup failed
    if: >-
      always() &&
      (needs.sealed-capture.result == 'failure' || needs.sealed-capture.result == 'cancelled')
    needs: sealed-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update one protected backup alert note without new comment per day
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_RESULT: ${{ needs.sealed-capture.result }}
        run: node scripts/security/backup_alert.mjs
