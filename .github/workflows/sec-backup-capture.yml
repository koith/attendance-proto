name: SEC backup capture isolated
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/security/capture.mjs', '.github/workflows/sec-backup-capture.yml']
permissions:
  contents: read
jobs:
  sealed-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: https://waluhdgqhwjjwmflhrle.supabase.co
      PGSSLMODE: require
      SEC_BACKUP_OUT: ${{ github.workspace }}/attendance-live.sealed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure required backup connection is configured
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "BACKUP_BLOCKED_DB_CONNECTION"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "BACKUP_BLOCKED_STORAGE_CREDENTIAL"; exit 1; }
      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
      - name: Read, seal and attest full archive
        run: |
          node scripts/security/capture.mjs
          test -s "$SEC_BACKUP_OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-attendance-recovery
          path: ${{ github.workspace }}/attendance-live.sealed
          retention-days: 7
          if-no-files-found: error
