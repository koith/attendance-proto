name: HQ pending account credential provisioning QA
on:
  pull_request:
    paths:
      - 'supabase/functions/hq-pending-account-provision/**'
      - 'hq_admin_account_provision.html'
      - 'hq_password_setup.html'
      - 'hq_owner_console.js'
      - 'index.html'
      - 'qa_hq_password_recovery_v390.mjs'
      - 'tests/hq_pending_account_provision.test.mjs'
      - '.github/workflows/hq-pending-account-credential-qa.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/hq-pending-account-provision/**'
      - 'hq_admin_account_provision.html'
      - 'hq_password_setup.html'
      - 'hq_owner_console.js'
      - 'index.html'
      - 'tests/hq_pending_account_provision.test.mjs'
      - '.github/workflows/hq-pending-account-credential-qa.yml'
permissions:
  contents: read
jobs:
  secure-provisioning:
    name: Auth mutation permission, one-time confirmation, and UI regression
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hq_owner_console.js
      - run: node --test tests/hq_pending_account_provision.test.mjs
      - run: node qa_hq_password_recovery_v390.mjs
