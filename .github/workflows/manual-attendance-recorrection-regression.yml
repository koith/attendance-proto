name: manual-attendance-recorrection-regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'actual_attendance.js'
      - 'actual_attendance.html'
      - 'qa_manual_attendance_recorrection_v1.mjs'
      - 'qa_manual_attendance_recorrection_postgres.sql'
      - 'supabase/migrations/20261029134000_atomic_recorrect_admin_added_attendance.sql'
      - 'supabase/migrations/20261029135500_ignore_void_add_in_pos_state.sql'
      - 'qa_void_add_pos_state_patch_postgres.sql'
      - '.github/workflows/manual-attendance-recorrection-regression.yml'
  push:
    branches: [main]
    paths:
      - 'actual_attendance.js'
      - 'actual_attendance.html'
      - 'qa_manual_attendance_recorrection_v1.mjs'
      - 'qa_manual_attendance_recorrection_postgres.sql'
      - 'supabase/migrations/20261029134000_atomic_recorrect_admin_added_attendance.sql'
      - 'supabase/migrations/20261029135500_ignore_void_add_in_pos_state.sql'
      - 'qa_void_add_pos_state_patch_postgres.sql'
      - '.github/workflows/manual-attendance-recorrection-regression.yml'
permissions:
  contents: read
jobs:
  manual-recorrection:
    name: Browser projection and atomic SQL correction (disposable DB)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: qa_attendance_overnight
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_attendance_overnight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_fixture_only
      PGDATABASE: qa_attendance_overnight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Front-end syntax and actual effective shift projection
        run: |
          node --check actual_attendance.js
          node qa_manual_attendance_recorrection_v1.mjs
          node qa_actual_attendance_correction_v1.mjs
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Pre-existing timezone + manager corrected punch integration
        run: |
          psql -v ON_ERROR_STOP=1 -f qa_attendance_consumer_timezone_postgres.sql
          psql -v ON_ERROR_STOP=1 -f qa_admin_correction_save_readback_postgres.sql
      - name: Repeated manual correction 13:00 to 13:10 to 13:15 (audit, rollback, isolation)
        run: psql -v ON_ERROR_STOP=1 -f qa_manual_attendance_recorrection_postgres.sql
      - name: Verify POS state, punch, and two auto-close consumers ignore VOID_ADD
        run: |
          createdb qa_void_add_patch
          PGDATABASE=qa_void_add_patch psql -v ON_ERROR_STOP=1 -f qa_void_add_pos_state_patch_postgres.sql
