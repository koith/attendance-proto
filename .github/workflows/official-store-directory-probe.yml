name: official-store-directory-probe
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_official_store_directory.mjs
      - .github/workflows/official-store-directory-probe.yml
  pull_request:
    paths:
      - scripts/probe_official_store_directory.mjs
      - .github/workflows/official-store-directory-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa_official_store_location_parse_v1.mjs
      - run: node scripts/crawl_official_store_locations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-store-location-snapshot
          path: official-store-locations.json
          if-no-files-found: warn
