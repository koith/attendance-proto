name: capture-development-instructions
# On-demand source validation only. Original GitHub issues/comments are canonical;
# never mirror user content to new comments or trigger for every comment.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        type: string
        required: true
        description: 'Existing issue to validate by read-only fingerprint'
permissions:
  contents: read
  issues: read
concurrency:
  group: intake-${ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate nonduplicating intake policy
        run: node qa_issue_receipt_v1.mjs
      - name: Fingerprint existing source without creating another comment
        env:
          GITHUB_TOKEN: ${ github.token }}
        run: node scripts/issue_intake_receipt.mjs
