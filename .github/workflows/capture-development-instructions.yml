name: capture-development-instructions
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        type: string
        required: true
        description: 'Existing issue snapshot to preserve'
permissions:
  contents: read
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact GitHub source text as an append-only issue receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issue_intake_receipt.mjs
