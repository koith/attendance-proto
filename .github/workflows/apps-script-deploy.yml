name: Apps Script report deploy
# OAuth refresh retrigger: 2026-10-04

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps_script.gs
      - .github/workflows/apps-script-deploy.yml
  push:
    branches: [main]
    paths:
      - apps_script.gs
      - appsscript.json
      - tools/deploy_apps_script.mjs
      - tools/apps_script_secret.mjs
      - qa_apps_script_deploy_secret.mjs
      - .github/workflows/apps-script-deploy.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate report contract
        run: |
          node qa_sheet_payable_source.mjs
          node qa_sheet_report_design.mjs
          node qa_sheet_display_values.mjs
          node qa_sheet_auto_resize_contract.mjs
          node qa_sheet_new_month_format_contract.mjs
          node qa_apps_script_deploy_secret.mjs
      - name: Push source and redeploy existing web app
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::Apps Script deployment credentials are not configured; deployment cannot be claimed."
            exit 1
          fi
          node tools/deploy_apps_script.mjs

      - name: Confirm Sheet refresh after Apps Script deployment
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // A one-minute background Sheet sync can own the lease when deployment starts.
            // Retry only that transient conflict; never silently accept failed writes.
            const audience = 'https://waluhdgqhwjjwmflhrle.supabase.co/functions/v1/server-sync-sheet';
            const token = await core.getIDToken(audience);
            let result, response;
            for (let attempt = 1; attempt <= 8; attempt++) {
              response = await fetch(audience, {
                method: 'POST',
                headers: {'Content-Type':'application/json', Authorization:'Bearer ' + token},
                body: JSON.stringify({mode:'deployment'})
              });
              result = await response.json();
              if (response.ok && result.ok === true && result.written === true &&
                  result.spreadsheet_id && result.column_resize_applied === true) {
                core.info('Sheet refreshed after deployment: ' + result.ym + ' (' + result.spreadsheet_id + ')');
                break;
              }
              if (response.status !== 409 || result.error !== 'SHEET_SYNC_BUSY' || attempt === 8) {
                throw new Error('Deployment Sheet write unconfirmed: ' + JSON.stringify(result));
              }
              core.warning('Concurrent Sheet sync lease; retry ' + attempt + '/8 in 15 seconds');
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
