name: payroll-elapsed-weeks-v1-regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt-payroll-elapsed-weeks-v1]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check payroll_elapsed_weeks_v1.js
          node --check qa_payroll_elapsed_weeks_v1.mjs
      - name: Elapsed week QA
        run: node qa_payroll_elapsed_weeks_v1.mjs
      - name: Integration assertions
        run: |
          grep -q 'payroll_elapsed_weeks_v1.js' index.html
          grep -q '__payrollElapsedWeeksV1.completedWeeksInMonth(ym,kstNow())' index.html
