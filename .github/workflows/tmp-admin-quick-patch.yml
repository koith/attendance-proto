name: tmp-admin-quick-patch
on:
  push:
    branches: [chatgpt-admin-monthly-ux-cleanup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-admin-monthly-ux-cleanup
      - name: Patch admin quick menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.admin-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}'
          new='.admin-quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old='''        <button type="button" id="quickContracts"><span>💼</span><b>계약</b></button>\n        <button type="button" id="quickDocs"><span>📄</span><b>계약서</b></button>'''
          new='''        <button type="button" id="quickContracts"><span>💼</span><b>계약</b></button>'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old='''  document.getElementById("quickDocs").onclick=()=>document.getElementById("adEmps")?.scrollIntoView({behavior:"smooth",block:"start"});\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,'')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: keep three equal admin quick actions"
          git push origin HEAD:chatgpt-admin-monthly-ux-cleanup
