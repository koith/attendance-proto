name: SEC AISEC-07 workflow secret lifecycle guard
# Static, secretless check of which secret NAMES reach which jobs. It never
# reads secret values and never calls GitHub/Supabase/Google APIs.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/security/workflow_secret_inventory.mjs'
      - 'scripts/security/workflow_secret_inventory.test.mjs'
      - 'security/aisec07_secret_classes.json'
      - 'security/aisec07_secret_policy_baseline.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/security/workflow_secret_inventory.mjs'
      - 'scripts/security/workflow_secret_inventory.test.mjs'
      - 'security/aisec07_secret_classes.json'
      - 'security/aisec07_secret_policy_baseline.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic guard QA (positive and negative cases)
        run: node --test scripts/security/workflow_secret_inventory.test.mjs
      - name: Ratchet check against frozen baseline
        run: node scripts/security/workflow_secret_inventory.mjs --check
      - name: Name-only inventory summary (no values)
        run: node scripts/security/workflow_secret_inventory.mjs --inventory >> "$GITHUB_STEP_SUMMARY"
