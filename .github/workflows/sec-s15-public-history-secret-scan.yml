name: SEC-S15 public Git history secret redaction audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/security/scan_public_secret_history.mjs'
      - 'qa/security/scan_public_secret_history.test.mjs'
      - '.github/workflows/sec-s15-public-history-secret-scan.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed detector with synthetic credentials
        run: |
          node --check scripts/security/scan_public_secret_history.mjs
          node --test qa/security/scan_public_secret_history.test.mjs
      - name: Scan tracked files and all reachable Git blobs without printing secrets
        run: node scripts/security/scan_public_secret_history.mjs --history
      - name: Reuse existing redacted PII inventory for HEAD and history independently
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security_inventory_readonly.mjs
          node -e "const r=require('./security-inventory-summary.json'); console.log('HEAD_PII_CANDIDATE_PATHS='+JSON.stringify(r.sample_paths))"
          node scripts/security_inventory_readonly.mjs --history
          node -e "const r=require('./security-inventory-summary.json'); console.log('HISTORY_PII_CANDIDATE_PATHS='+JSON.stringify(r.sample_paths))"
