name: verified-pages-deployment-notification

on:
  workflow_run:
    workflows: [p0-pages-deploy]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  deployments: read

concurrency:
  group: verified-deployment-alert-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-and-notify:
    # Never send success for a PR-only gate (no Pages publishing).
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_RUN: ${{ github.event.workflow_run.id }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PUBLISHED_URL: https://koith.github.io/attendance-proto/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify failed release and retry only safe pre-write deployment faults
        id: recovery
        if: env.DEPLOY_CONCLUSION == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const {decideRecovery}=require(process.cwd()+'/scripts/release_recovery_policy.cjs');
            const runId=Number(process.env.DEPLOY_RUN);
            const details=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            const main=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
              ...context.repo,run_id:runId,per_page:100});
            const decision=decideRecovery({
              conclusion:details.data.conclusion,sha:details.data.head_sha,
              mainSha:main.data.object.sha,attempt:details.data.run_attempt,jobs});
            core.setOutput('reason',decision.reason);
            core.info('Release recovery: '+decision.action+' (attempt '+details.data.run_attempt+'/5): '+decision.reason);
            if(decision.action==='retry'){
              try{
                await github.rest.actions.reRunWorkflowFailedJobs({...context.repo,run_id:runId});
                // Never suppress final failure reporting until the API has accepted a retry.
                core.setOutput('action','retry');
                core.info('GitHub Actions accepted a bounded failed-jobs rerun.');
              }catch(error){
                core.setOutput('action','terminal');
                core.setOutput('reason','GitHub retry API rejected recovery: '+String(error.message).slice(0,200));
                core.warning('Retry could not be scheduled; final failure alert remains enabled.');
              }
            }else{
              core.setOutput('action',decision.action);
            }
      - name: Dispatch guarded Pages-only rollback after production acceptance failure
        id: rollback
        if: steps.recovery.outputs.action == 'rollback_candidate'
        uses: actions/github-script@v7
        with:
          script: |
            const {isStaticOnlyRelease}=require(process.cwd()+'/scripts/release_recovery_policy.cjs');
            const runId=Number(process.env.DEPLOY_RUN),failedSha=process.env.DEPLOY_SHA;
            const ref=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(ref.data.object.sha!==failedSha)throw Error('Newer release exists: reject stale rollback');
            const related=await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,commit_sha:failedSha});
            const prs=related.data.filter(p=>p.merged_at);
            let files=[];
            if(prs.length){
              for(const p of prs){
                const changed=await github.paginate(github.rest.pulls.listFiles,{
                  ...context.repo,pull_number:p.number,per_page:100});
                if(changed.length>=300)throw Error('Truncated diff; no automatic rollback');
                files.push(...changed.map(f=>f.filename));
              }
            }else{
              const commit=await github.rest.repos.getCommit({...context.repo,ref:failedSha});
              files=(commit.data.files||[]).map(f=>f.filename);
            }
            if(!isStaticOnlyRelease([...new Set(files)]))
              throw Error('Rollback denied: release includes non-static, server, or unknown changes');
            const issues=await github.paginate(github.rest.issues.listForRepo,{
              ...context.repo,state:'all',per_page:100});
            let target=null;
            for(const issue of issues){
              const body=issue.body||'';
              if(issue.user?.login!=='github-actions[bot]' ||
                  !body.includes('GitHub Pages 배포 결과: 성공'))continue;
              const sha=body.match(/- (?:배포 )?커밋: ([a-f0-9]{40})/)?.[1];
              const priorId=Number(body.match(/\[deployment-run:(\d+)\]/)?.[1]);
              if(!sha||sha===failedSha||!Number.isSafeInteger(priorId))continue;
              const previous=await github.rest.actions.getWorkflowRun({...context.repo,run_id:priorId});
              if(previous.data.head_sha!==sha||previous.data.conclusion!=='success')continue;
              const compare=await github.rest.repos.compareCommits({
                ...context.repo,base:sha,head:failedSha});
              if(compare.data.status!=='ahead')continue;
              target=sha;break;
            }
            if(!target)throw Error('No independently confirmed previous healthy release; rollback unavailable');
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,workflow_id:'safe-pages-rollback.yml',ref:'main',
              inputs:{failed_sha:failedSha,target_sha:target,failed_run_id:String(runId)}
            });
            core.setOutput('dispatched','true');
            core.info('Guarded static Pages rollback dispatched to last verified release '+target);
      - name: Check deployment event, Pages commit and expected version
        id: verify_commit
        if: env.DEPLOY_CONCLUSION == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('index.html','utf8').match(/const APP_VERSION="(v[0-9.]+)"/)?.[1];
            if (!version) throw new Error('APP_VERSION not found in exact deployed commit');
            core.setOutput('version', version);
            const runId = Number(process.env.DEPLOY_RUN);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
            const job = jobs.find(j=>j.name === 'Deploy GitHub Pages');
            if (!job || job.conclusion !== 'success') throw new Error('Pages deploy job did not succeed');
            const deployments = await github.rest.repos.listDeployments({...context.repo,environment:'github-pages',per_page:15});
            const matched = deployments.data.some(d=>d.sha === process.env.DEPLOY_SHA);
            if (!matched) throw new Error('No GitHub Pages deployment receipt for SHA ' + process.env.DEPLOY_SHA);
            core.info('Verified deployment commit '+process.env.DEPLOY_SHA+' version '+version);
      - name: Require passed predeploy QA and identify changed request files
        id: release_evidence
        if: steps.verify_commit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const runId=Number(process.env.DEPLOY_RUN);
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
              ...context.repo,run_id:runId,per_page:100});
            const gate=jobs.find(j=>j.name==='P0 deployment gate');
            if(!gate||gate.conclusion!=='success')
              throw new Error('Predeploy QA gate not successful for this deployment');
            const pr=await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,commit_sha:process.env.DEPLOY_SHA});
            const mergePrs=pr.data.filter(p=>p.merged_at);
            let changed=[];
            if(mergePrs.length){
              for(const p of mergePrs){
                const files=await github.paginate(github.rest.pulls.listFiles,{
                  ...context.repo,pull_number:p.number,per_page:100});
                if(files.length>=300)throw new Error('PR change list truncated: refuse verification');
                changed.push(...files.map(f=>f.filename));
              }
            }else{
              const commit=await github.rest.repos.getCommit({
                ...context.repo,ref:process.env.DEPLOY_SHA});
              changed=(commit.data.files||[]).map(f=>f.filename);
            }
            changed=[...new Set(changed)];
            if(!changed.length)throw new Error('No request change files linked to deployed SHA');
            fs.writeFileSync('/tmp/changed-release-files.json',JSON.stringify(changed));
            core.info('Passed predeploy gate; release files: '+JSON.stringify(changed));
            const app=changed.filter(f=>/^(index\.html|[a-zA-Z0-9_-]+\.(?:js|html|css))$/.test(f));
            if(!app.length)core.info('No public root assets changed; existing live smoke still required.');
      - name: Verify every changed public asset against live Pages bytes
        id: changed_assets
        if: steps.release_evidence.outcome == 'success'
        run: |
          echo "CHANGED_RELEASE_FILES=$(cat /tmp/changed-release-files.json)" >> "$GITHUB_ENV"
          node qa_release_changed_assets_live.mjs
      - name: Validate actual Pages response, displayed version and protected API
        id: production_health
        if: steps.changed_assets.outcome == 'success'
        run: |
          # Retry only read-only verification to tolerate transient Pages CDN propagation.
          # Never interpret a failed attempt as successful publication.
          for attempt in 1 2 3 4 5; do
            if node qa_production_deployment_health_v1.mjs; then
              echo "Production health verified on attempt ${attempt}/5"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Production health verification exhausted five attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Install Chromium for actual live route smoke
        id: install_browser
        if: steps.production_health.outcome == 'success'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check actual published mobile and desktop pages
        id: browser_health
        if: steps.install_browser.outcome == 'success'
        env:
          APP_SMOKE_HOST: https://koith.github.io/attendance-proto
        run: node qa_browser_app_smoke.mjs
      - name: Announce final verified result once by GitHub issue notification
        if: ${{ always() && steps.recovery.outputs.action != 'retry' && steps.rollback.outputs.dispatched != 'true' }}
        uses: actions/github-script@v7
        env:
          OPTIONAL_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          VERIFY_COMMIT: ${{ steps.verify_commit.outcome }}
          VERIFY_REQUEST_QA: ${{ steps.release_evidence.outcome }}
          VERIFY_CHANGED_ASSETS: ${{ steps.changed_assets.outcome }}
          VERIFY_PUBLIC: ${{ steps.production_health.outcome }}
          VERIFY_BROWSER: ${{ steps.browser_health.outcome }}
          VERIFIED_VERSION: ${{ steps.verify_commit.outputs.version }}
          RECOVERY_REASON: ${{ steps.recovery.outputs.reason }}
        with:
          script: |
            const runId = Number(process.env.DEPLOY_RUN);
            const marker = '[deployment-run:' + runId + ']';
            let isSuccess = process.env.DEPLOY_CONCLUSION === 'success' &&
              process.env.VERIFY_COMMIT === 'success' &&
              process.env.VERIFY_REQUEST_QA === 'success' &&
              process.env.VERIFY_CHANGED_ASSETS === 'success' &&
              process.env.VERIFY_PUBLIC === 'success' &&
              process.env.VERIFY_BROWSER === 'success';
            // A superseded commit must never be announced as the active verified release.
            const main=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            const superseded=main.data.object.sha!==process.env.DEPLOY_SHA;
            if(superseded)isSuccess=false;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
              ...context.repo,run_id:runId,per_page:100
            });
            const isIntentionalQaFailure = process.env.DEPLOY_CONCLUSION === 'failure' &&
              jobs.some(job=>(job.steps||[]).some(step=>
                step.name === 'Intentional gate failure proof' && step.conclusion === 'failure'));
            const state = isIntentionalQaFailure ? '실패(의도적 QA)' :
              process.env.DEPLOY_CONCLUSION === 'cancelled' ? '취소' : superseded ? '교체됨' : isSuccess ? '성공' : '실패';
            const stage = superseded ? '더 최신 main 커밋이 있어 이전 배포의 최종 성공 알림을 차단함' :
              isIntentionalQaFailure ? '의도적인 P0 검사 실패 테스트 — 운영 배포를 실행하지 않음' :
              process.env.DEPLOY_CONCLUSION !== 'success' ? 'GitHub Pages workflow: '+process.env.DEPLOY_CONCLUSION :
              process.env.VERIFY_COMMIT !== 'success' ? '배포 커밋/버전 검증' :
              process.env.VERIFY_REQUEST_QA !== 'success' ? '수정 요청 연결 및 사전 QA 검증' :
              process.env.VERIFY_CHANGED_ASSETS !== 'success' ? '실제 배포된 수정 파일 일치 검증' :
              process.env.VERIFY_PUBLIC !== 'success' ? '운영 URL·버전·API 검증' :
              process.env.VERIFY_BROWSER !== 'success' ? '모바일/데스크톱 운영 스모크 테스트' : '전체 검증 완료';
            const version = process.env.VERIFIED_VERSION ||
              require('fs').readFileSync('index.html','utf8').match(/const APP_VERSION="(v[0-9.]+)"/)?.[1] || '확인 불가';
            const runUrl = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+runId;
            const sha = process.env.DEPLOY_SHA;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo,commit_sha:sha}).then(r=>r.data.map(p=>'#'+p.number).join(', ')||'없음').catch(()=>'조회 실패');
            const receipt=isSuccess?'[independent-verified-run:'+context.runId+']':
              '[independent-verification-non-success:'+context.runId+']';
            const body = [marker,receipt,'@'+context.repo.owner, '### GitHub Pages 배포 결과: '+state,
              '- 앱 버전: **'+version+'**','- 시각(UTC): '+new Date().toISOString(),'- 커밋: '+sha,
              '- 관련 PR: '+prs,'- 운영 URL: '+process.env.PUBLISHED_URL,
              '- 검증 단계: '+stage, '- 복구 판정: '+(process.env.RECOVERY_REASON||'해당 없음'),'- 요청별 사전 QA: '+process.env.VERIFY_REQUEST_QA,
              '- 수정 파일 운영 반영: '+process.env.VERIFY_CHANGED_ASSETS,'- 운영 HTTP 및 버전: '+process.env.VERIFY_PUBLIC,
              '- 브라우저 스모크: '+process.env.VERIFY_BROWSER,'- [배포 실행 및 오류 로그]('+runUrl+')',
              isIntentionalQaFailure?'**검증용 실패 이벤트입니다. 운영 웹앱 배포 실패가 아닙니다.**':
              !isSuccess?'**운영 배포 성공으로 판정하지 않습니다. 로그를 확인하세요.**':'**운영 검증 통과**'
            ].join('\n');
            // Read all issue pages, including closed issues, to prevent duplicate alerts;
            // do not use eventually consistent issue search indexing.
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'all',per_page:100});
            const previous=issues.find(i=>(i.body||'').includes(marker));
            if(previous){
              // Upgrade older same-run results to the real independent final result.
              await github.rest.issues.update({...context.repo,issue_number:previous.number,
                title:'배포 '+state+' · '+version+' · run '+runId,body});
              core.info('Existing receipt finalized by independent verifier: '+previous.html_url);
            }else{
              const created=await github.rest.issues.create({...context.repo,
                title:'배포 '+state+' · '+version+' · run '+runId,body,assignees:[context.repo.owner]});
              core.info('Independent final verification notification: '+created.data.html_url);
            }
            // Optional event-driven phone/email alert through a user-configured webhook.
            // Never log its URL or secret.
            if (process.env.OPTIONAL_ALERT_WEBHOOK) {
              const response=await fetch(process.env.OPTIONAL_ALERT_WEBHOOK,{
                method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({text:'백억커피 배포 '+state+' '+version+' '+runUrl,version,state,commit:sha,url:process.env.PUBLISHED_URL}),
                signal:AbortSignal.timeout(10000)
              });
              if(!response.ok) throw new Error('Optional external alert failed with HTTP '+response.status);
              core.info('Optional webhook accepted status '+response.status);
            }
