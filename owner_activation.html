<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>백억커피 점주 계정 활성화</title>
<link rel="stylesheet" href="owner_onboarding_v1.css?v=20261028v374">
</head>
<body>
<main><header class="owner-brand"><img src="logo_combine.jpg" width="218" height="71" alt="백억커피"><span>백억커피 업무자동화 · 지점 관리자</span></header><div class="owner-content"><span class="owner-eyebrow">지점 관리자 계정</span>
<h1>관리자 계정 활성화</h1><ol class="owner-steps" aria-label="계정 설정 순서"><li><span>1</span>메일 확인</li><li><span>2</span>비밀번호 설정</li><li><span>3</span>매장 입장</li></ol>
<p>본사에서 대표 관리자로 초대받았다면 이메일 인증·비밀번호 설정 후 대표 권한이 자동으로 확정되며, 해당 지점 관리 페이지로 이동합니다. 보조 관리자 초대는 기존 권한만 활성화됩니다.</p>
<form id="activateForm">
<label for="password">새 비밀번호 (12자 이상)</label>
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="repeat">새 비밀번호 확인</label>
<input id="repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button id="confirm" type="submit">비밀번호 설정 및 지점 입장</button>
</form>
<form id="recoveryResendForm" hidden>
<h2>인증 메일 다시 받기</h2><p>이메일 주소를 입력하면 새 인증 링크를 보내드립니다.</p><label for="recoveryEmail">이메일</label>
<input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" placeholder="점주 이메일" required>
<button id="resendRecovery" type="submit">새 인증 메일 보내기</button>
<small>받은편지함이나 스팸함에서 가장 최근 메일을 열어주세요.</small>
</form>
<div id="status" role="status" aria-live="polite"></div>
</div><footer class="owner-footer"><span>백억커피 업무자동화</span><a href="./index.html#dashboard">로그인 화면으로</a></footer></main>
<script src="owner_activation.js?v=20261028password1"></script>
</body>
</html>
