<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>백억커피 점주 계정 활성화</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#172019;background:#f4f7f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{background:white;border:1px solid #dbe4de;border-radius:18px;padding:24px;max-width:440px;width:100%;box-shadow:0 5px 18px #183a2310}
h1{font-size:1.3rem;margin:0 0 10px;color:#16482d}p{line-height:1.5;color:#66736a;font-size:.9rem}
label{display:block;margin:16px 0 7px;font-size:.9rem;font-weight:600}
input{width:100%;border:1px solid #becfc3;border-radius:9px;padding:13px;font-size:16px}
button{width:100%;background:#1d5d3a;color:white;font-weight:700;border:0;border-radius:9px;padding:14px;margin-top:18px;font-size:1rem}
button:disabled{opacity:.55}#status{margin-top:14px;font-size:.85rem;white-space:pre-wrap;color:#985f00}
[hidden]{display:none!important}#recoveryResendForm{margin-top:18px;border-top:1px solid #e3eae5;padding-top:16px}
#recoveryResendForm label{display:block;color:#354f3c}#recoveryResendForm small{display:block;margin-top:8px;color:#69786f}
</style>
</head>
<body>
<main>
<h1>백억커피 점주 계정 활성화</h1>
<p>본사에서 대표 관리자로 초대받았다면 이메일 인증·비밀번호 설정 후 대표 권한이 자동으로 확정되며, 해당 지점 관리 페이지로 이동합니다. 보조 관리자 초대는 기존 권한만 활성화됩니다.</p>
<form id="activateForm">
<label for="password">새 비밀번호 (12자 이상)</label>
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="repeat">새 비밀번호 확인</label>
<input id="repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button id="confirm" type="submit">비밀번호 설정 및 지점 입장</button>
</form>
<form id="recoveryResendForm" hidden>
<label for="recoveryEmail">인증 메일이 만료됐나요? 이메일 주소를 입력해 새 링크를 받으세요.</label>
<input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" placeholder="점주 이메일" required>
<button id="resendRecovery" type="submit">새 인증 메일 보내기</button>
<small>받은편지함이나 스팸함에서 가장 최근 메일을 열어주세요.</small>
</form>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script src="owner_activation.js?v=20261026v362"></script>
</body>
</html>
