<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>백억커피 본사 관리자 계정 설정</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#20372b;background:#f4f8f5}
*{box-sizing:border-box}body{margin:0;padding:26px 16px}main{max-width:460px;margin:36px auto;padding:28px 24px;background:#fff;border:1px solid #d7e8dc;border-radius:17px;box-shadow:0 6px 28px #173d2610}
h1{font-size:1.35rem;line-height:1.5;margin:8px 0 14px}p{line-height:1.6;color:#476453;font-size:.91rem}
label{display:block;margin:16px 0 5px;font-size:.91rem;font-weight:700}input{width:100%;min-height:48px;border:1px solid #aebeb3;border-radius:9px;padding:11px 12px;font-size:16px}
button{width:100%;min-height:48px;margin-top:18px;background:#245e40;color:white;border:0;border-radius:9px;font-size:1rem;font-weight:750;cursor:pointer}
button:disabled{opacity:.5;cursor:default}#status{min-height:36px;white-space:pre-line;overflow-wrap:anywhere}
a{color:#245e40}form[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>백억커피 · 본사 관리자 계정 설정</h1>
<p>본사 관리자 계정의 이메일을 인증한 뒤 새 비밀번호를 설정합니다. 채팅방에 공개된 비밀번호는 사용하지 마세요.</p>
<form id="requestForm">
<label for="email">본사 관리자 이메일</label>
<input id="email" type="email" autocomplete="username" placeholder="본사 관리자 이메일" required maxlength="254">
<button id="requestBtn" type="submit">이메일 인증 링크 받기</button>
</form>
<form id="passwordForm" hidden>
<p id="verifiedEmail"></p>
<label for="password">새 비밀번호 (12자 이상)</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="repeat">새 비밀번호 확인</label>
<input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button id="passwordBtn" type="submit">비밀번호 설정 및 로그인 확인</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="./index.html#dashboard">본사 로그인 화면으로</a></p>
</main>
<script>
(async function(){
"use strict";
const pendingKey="baekeok_hq_account_recovery_v1";
const requestForm=document.getElementById("requestForm"),passwordForm=document.getElementById("passwordForm");
const status=document.getElementById("status");
const setStatus=msg=>{status.textContent=String(msg)};
let config=null,active=null;
async function getConfig(){
 if(config)return config;
 const response=await fetch("./index.html",{cache:"no-store"});
 if(!response.ok)throw Error("APP_CONFIG_UNAVAILABLE");
 const source=await response.text();
 const url=source.match(/SUPABASE_URL:\s*"(https:\/\/[^"]+)"/)?.[1];
 const key=source.match(/SUPABASE_ANON_KEY:\s*"([^"]+)"/)?.[1];
 if(url!=="https://waluhdgqhwjjwmflhrle.supabase.co"||!key)throw Error("APP_CONFIG_INVALID");
 config={url,key};return config;
}
async function api(path,method,data,token){
 const {url,key}=await getConfig();
 const response=await fetch(url+path,{method,headers:{
  apikey:key,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})
 },...(data===undefined?{}:{body:JSON.stringify(data)})});
 const body=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(String(body.code||body.error_code||body.message||response.status));
 return body;
}
async function checkHq(access){
 const user=await api("/auth/v1/user","GET",undefined,access);
 if(!user?.id||!user?.email)throw Error("USER_NOT_VERIFIED");
 const scope=await api("/rest/v1/rpc/admin_context","POST",{},access);
 if(scope?.role!=="HQ"||scope?.store_id!==null||String(scope?.email||"").toLowerCase()!==String(user.email).toLowerCase())
  throw Error("HQ_ACCOUNT_REQUIRED");
 return user;
}
try{
 const saved=JSON.parse(sessionStorage.getItem(pendingKey)||"null");
 if(saved?.session?.access_token&&saved?.session?.refresh_token&&
    Date.now()-Number(saved.created_at)<10*60*1000&&Date.now()>=Number(saved.created_at)){
  const user=await checkHq(saved.session.access_token);
  if(user.id!==saved.user_id)throw Error("RECOVERY_IDENTITY_MISMATCH");
  active={email:String(user.email).toLowerCase(),id:user.id,token:saved.session.access_token};
  requestForm.hidden=true;passwordForm.hidden=false;
  document.getElementById("verifiedEmail").textContent="인증 완료: "+active.email;
  setStatus("본사 관리자 확인이 완료됐습니다. 새 비밀번호를 설정하세요.");
 } else sessionStorage.removeItem(pendingKey);
}catch(e){
 sessionStorage.removeItem(pendingKey);
 setStatus("인증 링크가 만료됐거나 확인되지 않았습니다. 새 메일을 요청하세요.");
}
requestForm.addEventListener("submit",async event=>{
 event.preventDefault();
 const email=document.getElementById("email").value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||email.length>254){setStatus("이메일을 확인하세요.");return;}
 const button=document.getElementById("requestBtn");button.disabled=true;
 try{
  const redirect="https://koith.github.io/attendance-proto/owner_activation.html";
  await api("/auth/v1/recover?redirect_to="+encodeURIComponent(redirect),"POST",{email});
  setStatus("인증 메일 요청이 접수됐습니다. 메일함에서 가장 최근 링크를 열어주세요. 메일 수신 여부는 별도로 확인해야 합니다.");
 }catch(e){setStatus("메일 요청 실패: "+String(e.message||e));button.disabled=false;}
});
passwordForm.addEventListener("submit",async event=>{
 event.preventDefault();
 const pass=document.getElementById("password").value,repeat=document.getElementById("repeat").value;
 if(pass.length<12||pass.length>128||pass!==repeat){setStatus("12자 이상인 동일한 새 비밀번호를 두 번 입력하세요.");return;}
 if(!active){setStatus("이메일 인증을 먼저 완료하세요.");return;}
 const button=document.getElementById("passwordBtn");button.disabled=true;
 try{
  await checkHq(active.token);
  await api("/auth/v1/user","PUT",{password:pass},active.token);
  const login=await api("/auth/v1/token?grant_type=password","POST",{email:active.email,password:pass});
  if(login?.user?.id!==active.id||!login?.access_token||!login?.refresh_token)throw Error("PASSWORD_LOGIN_NOT_CONFIRMED");
  await checkHq(login.access_token);
  localStorage.setItem("baekeok_auth",JSON.stringify(login));
  sessionStorage.removeItem(pendingKey);
  document.getElementById("password").value="";document.getElementById("repeat").value="";
  setStatus("본사 관리자 로그인 확인 완료. 대시보드로 이동합니다.");
  location.replace("./index.html#dashboard");
 }catch(e){setStatus("비밀번호 설정 또는 로그인 확인 실패: "+String(e.message||e));button.disabled=false;}
});
})();
</script>
</body></html>
