<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>백억커피 근태 확인</title><link rel="stylesheet" href="employment_contracts.css"><script src="no_double_tap_zoom.js" defer></script>
</head><body><div class="wrap"><header class="top"><button class="back" id="back">‹ 관리</button><div><h1>근태 확인</h1><p>예정 근무와 출퇴근 기록을 확인합니다.</p></div></header><section class="card"><div class="grid2"><div class="field"><label>날짜</label><input id="date" type="date"></div><div class="field"><label>직원</label><select id="employee"><option value="">직원 선택</option></select></div></div><div id="status" class="hint">직원과 날짜를 선택해주세요.</div></section><section class="card"><h2>판정</h2><div class="seg"><button data-decision="NEEDS_REVIEW" class="on">확인 필요</button><button data-decision="NOT_UNEXCUSED">대타·승인 변경</button><button data-decision="UNEXCUSED">무단결근</button></div><div class="field"><label>메모</label><textarea id="note" rows="3" placeholder="대타, 승인된 변경 등 필요한 내용만 기록"></textarea></div><button class="btn primary full" id="save">판정 저장</button></section></div><div class="toast" id="toast"></div><script src="attendance_review.js"></script></body></html>
