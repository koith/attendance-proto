<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>백억커피 근태</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --ink:#f2f4f8; --sub:#98a0ad; --muted:#6b7280;
    --in:#22c55e; --in-d:#16a34a; --out:#f97316; --out-d:#ea580c;
    --warn:#f43f5e; --accent:#5b8cff; --chip:#232834;
    --r:16px; --tap:64px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  .wrap{max-width:760px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(15,17,21,.92); backdrop-filter:blur(8px); z-index:5;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand b{font-size:1.05rem; letter-spacing:-.02em;}
  .brand span{font-size:.78rem; color:var(--sub);}
  .clock{font-variant-numeric:tabular-nums; font-size:1rem; color:var(--sub); letter-spacing:.01em;}
  .tabs{display:flex; gap:6px;}
  .tabs a{
    font-size:.82rem; color:var(--sub); text-decoration:none;
    padding:7px 12px; border-radius:999px; border:1px solid var(--line);
  }
  .tabs a.on{color:var(--ink); background:var(--chip); border-color:var(--accent);}
  main{flex:1; padding:18px; display:flex; flex-direction:column;}

  /* connection banner */
  .conn{font-size:.74rem; padding:8px 14px; text-align:center; border-bottom:1px solid var(--line);}
  .conn.local{background:#3a2a12; color:#f4c37a;}
  .conn.live{background:#0f2a1a; color:#7ee2a8;}

  /* ---------- POS ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .emp{
    min-height:var(--tap); border:1px solid var(--line); background:var(--panel);
    border-radius:var(--r); padding:14px 12px; display:flex; flex-direction:column; gap:6px;
    justify-content:center; cursor:pointer; transition:transform .06s, border-color .15s;
  }
  .emp:active{transform:scale(.97);}
  .emp .nm{font-size:1.1rem; font-weight:600; letter-spacing:-.01em;}
  .emp .st{font-size:.78rem; color:var(--sub); display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block;}
  .emp.working{border-color:var(--in-d);}
  .emp.working .dot{background:var(--in); box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .emp.working .st{color:var(--in);}

  /* PIN pad */
  .pad-veil{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:20;}
  .pad-veil.show{display:flex;}
  .pad{
    width:100%; max-width:760px; margin:0 auto; background:var(--panel);
    border-radius:22px 22px 0 0; border-top:1px solid var(--line);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:rise .18s ease-out;
  }
  @keyframes rise{from{transform:translateY(20px); opacity:.6;} to{transform:none; opacity:1;}}
  .pad h3{margin:2px 0 2px; font-size:1.15rem;}
  .pad .who{color:var(--sub); font-size:.85rem; margin-bottom:14px;}
  .dots{display:flex; gap:14px; justify-content:center; margin:6px 0 18px;}
  .dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line);}
  .dots i.f{background:var(--accent); border-color:var(--accent);}
  .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .keys button{
    height:60px; font-size:1.5rem; border-radius:14px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); font-variant-numeric:tabular-nums; cursor:pointer;
  }
  .keys button:active{background:var(--chip);}
  .keys .ghost{background:transparent; border-color:transparent;}
  .keys .act{font-size:1rem; color:var(--sub);}
  .pad .cancel{width:100%; margin-top:12px; height:48px; background:transparent; color:var(--sub);
    border:1px solid var(--line); border-radius:12px; font-size:.95rem;}

  /* toast */
  .toast{
    position:fixed; left:50%; top:22%; transform:translateX(-50%) translateY(-8px);
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:18px 22px; border-radius:16px; font-size:1.05rem; z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5); min-width:220px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.in{border-color:var(--in-d);} .toast.out{border-color:var(--out-d);} .toast.err{border-color:var(--warn);}
  .toast .big{font-size:1.5rem; font-weight:700; margin-bottom:4px;}
  .toast .sub{font-size:.85rem; color:var(--sub);}

  /* ---------- ADMIN ---------- */
  .section-t{font-size:.8rem; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin:4px 2px 10px;}
  .row{
    display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;
  }
  .row .nm{font-weight:600; font-size:1.02rem; flex:1;}
  .row .times{font-size:.85rem; color:var(--sub); font-variant-numeric:tabular-nums; text-align:right;}
  .row .times b{color:var(--ink); font-weight:600;}
  .badge{font-size:.7rem; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--sub);}
  .badge.work{color:var(--in); border-color:var(--in-d);}
  .badge.issue{color:var(--warn); border-color:var(--warn);}
  .empty{color:var(--muted); text-align:center; padding:40px 0; font-size:.9rem;}
  .addbtn{
    width:100%; height:52px; border-radius:14px; border:1px dashed var(--line);
    background:transparent; color:var(--sub); font-size:.95rem; margin-top:4px; cursor:pointer;
  }
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .field label{font-size:.8rem; color:var(--sub);}
  .field input{
    height:50px; border-radius:12px; border:1px solid var(--line); background:var(--panel2);
    color:var(--ink); padding:0 14px; font-size:1rem;
  }
  .btn-primary{
    width:100%; height:52px; border-radius:14px; border:none; background:var(--accent);
    color:#fff; font-size:1rem; font-weight:600; cursor:pointer;
  }
  .btn-primary:active{filter:brightness(.92);}
  .link-x{background:none; border:none; color:var(--muted); font-size:.8rem; cursor:pointer; padding:6px;}
  .modal-veil{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:30; padding:20px;}
  .modal-veil.show{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; width:100%; max-width:380px;}
  .modal h3{margin:0 0 16px; font-size:1.1rem;}
</style>
</head>
<body>
<div id="conn" class="conn local">로컬 모드 · 이 기기에만 저장됩니다 (Supabase 미연결)</div>
<div class="wrap">
  <header>
    <div class="brand"><b>백억커피</b><span id="storeName">인하대점</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <div style="padding:12px 18px 0"><div class="tabs">
    <a id="tabPos" href="#pos" class="on">출퇴근</a>
    <a id="tabAdmin" href="#admin">관리자</a>
    <a id="tabPay" href="#pay">급여</a>
  </div></div>
  <main id="view"></main>
</div>

<!-- PIN pad -->
<div class="pad-veil" id="padVeil">
  <div class="pad">
    <h3 id="padTitle">비밀번호 입력</h3>
    <div class="who" id="padWho"></div>
    <div class="dots" id="padDots"></div>
    <div class="keys" id="padKeys"></div>
    <button class="cancel" id="padCancel">취소</button>
  </div>
</div>

<!-- add employee modal -->
<div class="modal-veil" id="addVeil">
  <div class="modal">
    <h3>직원 등록</h3>
    <div class="field"><label>이름</label><input id="newName" autocomplete="off" placeholder="예: 이현진"></div>
    <div class="field"><label>비밀번호 (4자리)</label><input id="newPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="숫자 4자리"></div>
    <button class="btn-primary" id="newSave">등록</button>
    <button class="link-x" id="newCancel" style="width:100%;margin-top:8px">취소</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   백억커피 근태 V0.1  —  단일 파일 모바일 웹앱
   백엔드 어댑터: Supabase URL/키를 넣으면 자동으로 클라우드 모드,
   없으면 localStorage 로컬 모드로 완전 동작 (UI/동선 검증용).
   GPT 프로토타입의 검증된 로직 이식: IN/OUT 페어링, 자정넘김,
   8초 중복방지, 미완결 세션 감지, 서버(=KST)시각 저장.
   ========================================================================= */

const CONFIG = {
  SUPABASE_URL: "https://waluhdgqhwjjwmflhrle.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhbHVoZGdxaHdqandtZmxocmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTg4NjAsImV4cCI6MjEwMzE5NDg2MH0.-UugGE05V70Ecw__UdIZpWJr2mDYmLfV7mh_lR-U9Mw",
  STORE_NAME: "인하대점",
  DEVICE_ID: "POS_INHA_01",
  DUP_GUARD_SEC: 8,
};

/* ---------- 시각 유틸: 항상 Asia/Seoul 기준 ---------- */
function kstNow(){
  // 브라우저 로컬시각을 KST로 보정한 Date 문자열(ISO, 초단위)
  const d = new Date();
  // toLocaleString으로 KST 벽시계 값을 만든 뒤 Date로 되돌림
  const kst = new Date(d.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  return kst;
}
function iso(d){ // 초단위 ISO (타임존 표기 없이 KST 벽시계)
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fromIso(s){ return new Date(s); }
function hhmm(d){ const p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function hms(d){ const p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function fmtDur(sec){
  const m=Math.max(0,Math.floor(sec/60)); const h=Math.floor(m/60), mm=m%60;
  if(h&&mm) return `${h}시간 ${mm}분`; if(h) return `${h}시간`; return `${mm}분`;
}
// 급여용: 초 → 정확한 시간(소수, 반올림 없음). 계산에 사용.
function secToHours(sec){ return sec/3600; }
// 표시용: 초 → "H시간 M분" (분 단위 절삭 표기, 계산과 무관)
function fmtHM(sec){ const m=Math.floor(sec/60); const h=Math.floor(m/60), mm=m%60;
  if(h&&mm) return `${h}시간 ${mm}분`; if(h) return `${h}시간`; return `${mm}분`; }
/* ---- 엑셀 ROUND/ROUNDDOWN 정확 재현 (Sprint2 replay 검증 통과) ---- */
function xround(x,n){ // ROUND(x,10^-n): n=-1 → 10원 반올림
  const step=Math.pow(10,-n); return Math.round(x/step)*step;
}
function xrounddown(x,n){ const step=Math.pow(10,-n); return Math.floor(x/step)*step; }
/* ---- 월 급여 계산: emp속성 + 월실근무시간 → 급여내역 ---- */
function calcPayroll(emp, monthHours, weeks){
  const wage=emp.wage||0;
  const base=xround(wage*monthHours,-1);              // 기본급 10원 반올림
  let juhyu=0, weekly=0;
  const jh=emp.juhyu_hours||0;
  if(jh>0){
    weekly = (emp.juhyu_round!=null) ? xround(wage*jh, emp.juhyu_round) : wage*jh;
    juhyu = weekly*(weeks||0);
  }
  const gross=Math.round(base+juhyu);
  const rate=(emp.tax_rate!=null)?emp.tax_rate:0.033;
  const net=xrounddown(gross*(1-rate),-1);            // 세후 10원 버림
  return {base, weekly, juhyu, gross, net, rate};
}

/* ============================ 백엔드 어댑터 ============================ */
/* 두 구현이 같은 인터페이스를 제공:
   listEmployees(), createEmployee(name,pin), deactivateEmployee(id),
   verifyPin(id,pin), lastEvent(id), insertEvent(id,type),
   todayEvents()  →  모두 Promise 반환 */

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

/* ---- PIN 해시 (WebCrypto PBKDF2-SHA256, GPT판과 동일 방식) ---- */
async function pbkdf2(pin, saltB64){
  const enc=new TextEncoder();
  let salt;
  if(saltB64){ salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0)); }
  else { salt=crypto.getRandomValues(new Uint8Array(16)); }
  const key=await crypto.subtle.importKey("raw",enc.encode(pin),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},key,256);
  const digest=btoa(String.fromCharCode(...new Uint8Array(bits)));
  const sB64=btoa(String.fromCharCode(...salt));
  return {encoded:`pbkdf2_sha256$${sB64}$${digest}`, saltB64:sB64, digest};
}
async function pinMatches(pin, encoded){
  try{ const [,sB64]=encoded.split("$"); const {encoded:re}=await pbkdf2(pin,sB64); return re===encoded; }
  catch(e){ return false; }
}

/* ---------------------- LocalStorage 구현 ---------------------- */
const LocalBE = (()=>{
  const K="baekeok_att_v1";
  function load(){ try{return JSON.parse(localStorage.getItem(K))||seed();}catch(e){return seed();} }
  function save(s){ localStorage.setItem(K,JSON.stringify(s)); }
  function seed(){ const s={emps:[],events:[],seq:1}; localStorage.setItem(K,JSON.stringify(s)); return s; }
  return {
    async listEmployees(){ return load().emps.filter(e=>e.active).sort((a,b)=>a.name.localeCompare(b.name,"ko")); },
    async allEmployees(){ return load().emps.sort((a,b)=>a.name.localeCompare(b.name,"ko")); },
    async createEmployee(name,pin){
      const s=load();
      if(s.emps.some(e=>e.active&&e.name===name.trim())) throw new Error("같은 이름의 활성 직원이 이미 있습니다.");
      const {encoded}=await pbkdf2(pin);
      s.emps.push({id:s.seq++, name:name.trim(), pin_hash:encoded, active:true});
      save(s);
    },
    async deactivateEmployee(id){ const s=load(); const e=s.emps.find(x=>x.id===id); if(e)e.active=false; save(s); },
    async verifyPin(id,pin){ const e=load().emps.find(x=>x.id===id&&x.active); if(!e)return false; return pinMatches(pin,e.pin_hash); },
    async lastEvent(id){ const ev=load().events.filter(x=>x.employee_id===id).sort((a,b)=>a.event_at<b.event_at?1:-1); return ev[0]||null; },
    async insertEvent(id,type){ const s=load(); const now=iso(kstNow());
      s.events.push({id:s.seq++, employee_id:id, event_type:type, event_at:now, server_received_at:now, device_id:CONFIG.DEVICE_ID}); save(s); },
    async todayEvents(){ const s=load(); const t=kstNow(); const p=n=>String(n).padStart(2,"0");
      const day=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
      return s.events.filter(x=>x.event_at.slice(0,10)===day); },
    async monthEvents(ym){ // 경계 포함: 전월 말일~익월 1일까지 여유 조회 후 세션화는 호출측에서
      const s=load(); const [y,m]=ym.split("-").map(Number);
      const start=new Date(y,m-1,1); start.setDate(start.getDate()-1);   // 전월 말일
      const end=new Date(y,m,1); end.setDate(end.getDate()+1);           // 익월 1일 다음
      const p=n=>String(n).padStart(2,"0");
      const sd=`${start.getFullYear()}-${p(start.getMonth()+1)}-${p(start.getDate())}`;
      const ed=`${end.getFullYear()}-${p(end.getMonth()+1)}-${p(end.getDate())}`;
      return s.events.filter(x=>{const d=x.event_at.slice(0,10); return d>=sd && d<=ed;}); },
    async updateEmployee(id,fields){ const s=load(); const e=s.emps.find(x=>x.id===id); if(e)Object.assign(e,fields); save(s); },
    async getEmployee(id){ return load().emps.find(x=>x.id===id)||null; },
    // --- RPC 호환 인터페이스 (Supabase와 동일 시그니처) ---
    async listEmployeesState(){ const s=load();
      return s.emps.filter(e=>e.active).sort((a,b)=>a.name.localeCompare(b.name,"ko")).map(e=>{
        const ev=s.events.filter(x=>x.employee_id===e.id).sort((a,b)=>a.event_at<b.event_at?1:-1)[0];
        return {id:e.id,name:e.name,working:!!(ev&&ev.event_type==="IN")};
      }); },
    async punch(id,pin){ const s=load(); const e=s.emps.find(x=>x.id===id&&x.active);
      if(!e) return {ok:false,error:"NO_EMPLOYEE"};
      if(!await pinMatches(pin,e.pin_hash)) return {ok:false,error:"BAD_PIN"};
      const last=s.events.filter(x=>x.employee_id===id).sort((a,b)=>a.event_at<b.event_at?1:-1)[0];
      const now=kstNow();
      if(last && (now-fromIso(last.event_at))/1000<8) return {ok:false,error:"TOO_SOON"};
      const type=(last&&last.event_type==="IN")?"OUT":"IN";
      const iso_now=iso(now);
      s.events.push({id:s.seq++,employee_id:id,event_type:type,event_at:iso_now,server_received_at:iso_now,device_id:CONFIG.DEVICE_ID}); save(s);
      return {ok:true,type,at:iso_now,name:e.name}; },
    async rangeEvents(fromStr,toStr){ const s=load();
      return s.events.filter(x=>x.event_at>=fromStr && x.event_at<toStr); },
  };
})();

/* ---------------------- Supabase 구현 (준비만) ---------------------- */
/* Supabase 프로젝트 생성 후 CONFIG 채우면 이 경로가 활성화됩니다.
   테이블 스키마는 README/SQL 참고. 여기서는 REST(PostgREST) 직접 호출. */
/* Supabase Auth 세션 (관리자 로그인) */
const Auth = {
  token:null,
  load(){ try{ this.token=JSON.parse(localStorage.getItem("baekeok_auth"))?.access_token||null; }catch(e){ this.token=null; } return this.token; },
  save(session){ localStorage.setItem("baekeok_auth",JSON.stringify(session)); this.token=session.access_token; },
  clear(){ localStorage.removeItem("baekeok_auth"); this.token=null; },
  async login(email,password){
    const r=await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:"POST", headers:{apikey:CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description||d.msg||"로그인 실패");
    this.save(d); return d;
  },
  isLoggedIn(){ return !!this.token; },
};

const SupaBE = (()=>{
  const rpc=async(fn,args={},useAuth=false)=>{
    const headers={apikey:CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json",
      "Authorization":`Bearer ${useAuth&&Auth.token?Auth.token:CONFIG.SUPABASE_ANON_KEY}`};
    const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers,body:JSON.stringify(args)});
    if(!r.ok){ throw new Error(await r.text()); }
    const t=await r.text(); if(!t) return null;
    try{ return JSON.parse(t); }catch(e){ return null; }
  };
  return {
    // --- POS (anon) ---
    async listEmployeesState(){ return rpc("list_employees_state"); },
    async punch(id,pin){ return rpc("punch",{p_employee_id:id,p_pin:pin,p_device:CONFIG.DEVICE_ID}); },
    // --- 관리자 (authenticated) ---
    async allEmployees(){ return rpc("admin_list_employees",{},true); },
    async createEmployee(name,pin){ return rpc("admin_create_employee",{p_name:name.trim(),p_pin:pin},true); },
    async deactivateEmployee(id){ return rpc("admin_deactivate_employee",{p_id:id},true); },
    async updateEmployee(id,fields){ return rpc("admin_update_employee",{p_id:id,p_fields:fields},true); },
    async rangeEvents(fromIso,toIso){ return rpc("admin_events",{p_from:fromIso,p_to:toIso},true); },
    // --- M4: 정정/수정 ---
    async myEvents(id,pin,fromIso,toIso){ return rpc("my_events",{p_employee_id:id,p_pin:pin,p_from:fromIso,p_to:toIso}); },
    async requestCorrection(id,pin,kind,eventId,reqAt,reqType,note){ return rpc("request_correction",{p_employee_id:id,p_pin:pin,p_kind:kind,p_event_id:eventId,p_requested_at:reqAt,p_requested_type:reqType,p_note:note}); },
    async pendingRequests(){ return rpc("admin_pending_requests",{},true); },
    async resolveRequest(reqId,approve,reason){ return rpc("admin_resolve_request",{p_request_id:reqId,p_approve:approve,p_reject_reason:reason||null},true); },
    async correctEvent(action,eventId,empId,newAt,newType,reason){ return rpc("admin_correct_event",{p_action:action,p_event_id:eventId,p_employee_id:empId,p_new_at:newAt,p_new_type:newType,p_reason:reason},true); },
    async eventsWithCorrections(fromIso,toIso){ return rpc("admin_events_with_corrections",{p_from:fromIso,p_to:toIso},true); },
    async todayEvents(){ const t=kstNow(); const p=n=>String(n).padStart(2,"0");
      const day=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
      return this.rangeEvents(`${day}T00:00:00`,`${day}T23:59:59`); },
    async monthEvents(ym){ const [y,m]=ym.split("-").map(Number); const p=n=>String(n).padStart(2,"0");
      const start=new Date(y,m-1,1); start.setDate(start.getDate()-1);
      const end=new Date(y,m,1); end.setDate(end.getDate()+2);
      const sd=`${start.getFullYear()}-${p(start.getMonth()+1)}-${p(start.getDate())}`;
      const ed=`${end.getFullYear()}-${p(end.getMonth()+1)}-${p(end.getDate())}`;
      return this.rangeEvents(`${sd}T00:00:00`,`${ed}T00:00:00`); },
  };
})();

/* ============================ 공통 로직 ============================ */
// GPT판 pair_events 이식: IN/OUT 세션화 + 미완결/고아 감지
// 원본 이벤트 + 보정 → 유효 이벤트 목록 (원본 불변, 최신 보정 우선)
function applyCorrections(events, corrections){
  const corrByEvent={}; const added=[];
  for(const c of (corrections||[])){
    if(c.action==="ADD"){ added.push(c); continue; }
    // 같은 event_id의 보정 중 최신만 유효
    if(c.event_id!=null){ const prev=corrByEvent[c.event_id];
      if(!prev || new Date(c.created_at)>new Date(prev.created_at)) corrByEvent[c.event_id]=c; }
  }
  const eff=[];
  for(const e of (events||[])){
    const c=corrByEvent[e.id];
    if(c){
      if(c.action==="VOID") continue; // 무효화된 이벤트 제외
      eff.push({ id:e.id, employee_id:e.employee_id,
        event_type: c.action==="EDIT_TYPE"&&c.new_event_type ? c.new_event_type : e.event_type,
        event_at: c.action==="EDIT_TIME"&&c.new_event_at ? c.new_event_at : e.event_at,
        corrected:true });
    } else {
      eff.push({ id:e.id, employee_id:e.employee_id, event_type:e.event_type, event_at:e.event_at });
    }
  }
  // 관리자가 추가(ADD)한 누락분
  for(const c of added){
    eff.push({ id:"add_"+c.id, employee_id:c.employee_id, event_type:c.new_event_type,
      event_at:c.new_event_at, corrected:true, addedByAdmin:true });
  }
  return eff;
}
function pairEvents(rows){
  const s=[...rows].sort((a,b)=> a.event_at<b.event_at?-1:1);
  const out=[]; let openIn=null;
  for(const r of s){
    const when=fromIso(r.event_at);
    if(r.event_type==="IN"){
      if(openIn!==null) out.push({in:openIn,out:null,sec:null,status:"INCOMPLETE"});
      openIn=when;
    }else if(r.event_type==="OUT"){
      if(openIn!==null){ out.push({in:openIn,out:when,sec:(when-openIn)/1000,status:"COMPLETE"}); openIn=null; }
      else out.push({in:null,out:when,sec:null,status:"ORPHAN_OUT"});
    }
  }
  if(openIn!==null) out.push({in:openIn,out:null,sec:null,status:"WORKING"});
  return out;
}
async function empState(id){
  const last=await BE.lastEvent(id);
  if(last && last.event_type==="IN") return {state:"WORKING",last};
  return {state:"OFF",last};
}

const padVeil=document.getElementById("padVeil");
let padBuf="", padEmp=null, padState=null, padBusy=false;
function openPad(emp,state){
  padEmp=emp; padState=state; padBuf="";
  document.getElementById("padTitle").textContent = state==="WORKING"?"퇴근 — 비밀번호 입력":"출근 — 비밀번호 입력";
  document.getElementById("padWho").textContent = emp.name+(state==="WORKING"?" · 현재 근무중":"");
  buildKeys(); drawDots(); padVeil.classList.add("show");
}
function closePad(){ padVeil.classList.remove("show"); padBuf=""; padBusy=false; }
document.getElementById("padCancel").onclick=closePad;
padVeil.addEventListener("click",e=>{ if(e.target===padVeil) closePad(); });
function drawDots(){
  const d=document.getElementById("padDots"); d.innerHTML="";
  for(let i=0;i<4;i++){ const s=document.createElement("i"); if(i<padBuf.length)s.className="f"; d.appendChild(s); }
}
function buildKeys(){
  const k=document.getElementById("padKeys"); k.innerHTML="";
  const layout=["1","2","3","4","5","6","7","8","9","del","0","ok"];
  for(const key of layout){
    const b=document.createElement("button");
    if(key==="del"){ b.textContent="←"; b.className="act"; b.onclick=()=>{ if(padBusy)return; padBuf=padBuf.slice(0,-1);drawDots(); }; }
    else if(key==="ok"){ b.textContent="확인"; b.className="act"; b.onclick=submitPad; }
    else { b.textContent=key; b.onclick=()=>{ if(padBusy)return; if(padBuf.length<4){padBuf+=key;drawDots(); if(padBuf.length===4) submitPad();} }; }
    k.appendChild(b);
  }
}
async function submitPad(){
  if(padBusy) return;
  if(padBuf.length<4){ return; }
  padBusy=true;
  document.getElementById("padTitle").textContent="처리 중…";
  const pin=padBuf;
  try{
    const res=await BE.punch(padEmp.id,pin);
    if(!res||!res.ok){
      const msg={NO_EMPLOYEE:"직원을 찾을 수 없습니다.",BAD_PIN:"비밀번호가 올바르지 않습니다.",TOO_SOON:"방금 처리되었습니다. 잠시 후 다시."}[res&&res.error]||"처리 실패";
      closePad(); toast("err",(res&&res.error==="BAD_PIN")?"비밀번호 오류":"오류",msg); return;
    }
    closePad();
    const now=kstNow();
    if(res.type==="IN") toast("in",`${res.name||padEmp.name}님 출근`,`${hhmm(now)} 기록됨`);
    else toast("out",`${res.name||padEmp.name}님 퇴근`,`${hhmm(now)} 기록됨`);
    renderPos();
  }catch(e){
    closePad(); toast("err","처리 실패","네트워크를 확인하고 다시 시도해주세요.");
  }finally{
    padBusy=false;
  }
}

function renderMyResult(empId,pin,events,requests){
  const el=document.getElementById("mrResult");
  const sess=pairEvents(events);
  let html=`<div class="section-t">최근 2주</div>`;
  if(!sess.length) html+=`<div style="color:var(--muted);font-size:.85rem">기록이 없습니다.</div>`;
  else{
    for(const s of sess){
      const d=s.in||s.out; const date=d?`${d.getMonth()+1}/${d.getDate()}`:"-";
      let label,warn="";
      if(s.status==="COMPLETE") label=`출근 ${hhmm(s.in)} · 퇴근 ${hhmm(s.out)}`;
      else if(s.status==="WORKING") label=`출근 ${hhmm(s.in)} · 근무중`;
      else if(s.status==="INCOMPLETE"){ label=`출근 ${hhmm(s.in)} · 퇴근 누락`; warn="MISSING_OUT"; }
      else if(s.status==="ORPHAN_OUT"){ label=`퇴근 ${hhmm(s.out)} · 출근 누락`; warn="MISSING_IN"; }
      html+=`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem">
        <span style="color:var(--sub);min-width:44px">${date}</span>
        <span style="flex:1${warn?';color:var(--warn)':''}">${label}</span>
        <button class="link-x" data-fixreq="${warn||'WRONG_TIME'}" data-at="${(s.in||s.out).toISOString()}">정정요청</button>
      </div>`;
    }
  }
  if(requests&&requests.length){
    html+=`<div class="section-t" style="margin-top:14px">내 정정요청</div>`;
    const st={PENDING:"대기중",APPROVED:"승인됨",REJECTED:"반려됨"};
    for(const r of requests.slice(0,5)){
      html+=`<div style="font-size:.82rem;color:var(--sub);padding:4px 0">${r.created_at.slice(5,10)} · ${st[r.status]||r.status} ${r.note?'· '+r.note:''}</div>`;
    }
  }
  el.innerHTML=html;
  el.querySelectorAll("[data-fixreq]").forEach(b=>b.onclick=()=>{
    const kind=b.getAttribute("data-fixreq");
    openReqForm(empId,pin,kind);
  });
}
function openReqForm(empId,pin,kind){
  const el=document.getElementById("mrResult");
  const kindLabel={MISSING_OUT:"퇴근 누락",MISSING_IN:"출근 누락",WRONG_TIME:"시각 정정"}[kind]||"정정";

    <div class="section-t">${kindLabel} 요청</div>
    <div class="field"><label>올바른 시각</label><input id="reqTime" type="datetime-local"></div>

    <button class="btn-primary" id="reqSend">요청 보내기</button>`;

    if(!tv){ alert("시각을 입력하세요."); return; }
    const at=tv.length===16?tv+":00":tv;

  };

async function renderPendingRequests(){

  const kindLabel={MISSING_OUT:"퇴근 누락",MISSING_IN:"출근 누락",WRONG_TIME:"시각 정정",OTHER:"기타"};
  sec.innerHTML=`<div class="section-t">⚠ 정정요청 ${reqs.length}건 대기</div>`;
  for(const r of reqs){
    const when=r.requested_at?hhmm(fromIso(r.requested_at))+` (${r.requested_at.slice(5,10)})`:"-";
    const div=document.createElement("div"); div.className="row"; div.style.flexDirection="column"; div.style.alignItems="stretch"; div.style.gap="8px";
    div.innerHTML=`
      <div style="display:flex;gap:8px;align-items:center">
        <div class="nm" style="flex:1">${r.employee_name} · ${kindLabel[r.kind]||r.kind}</div>
      </div>
      <div style="font-size:.85rem;color:var(--sub)">요청시각 <b style="color:var(--ink)">${when}</b>${r.requested_type?` (${r.requested_type==="IN"?"출근":"퇴근"})`:""}</div>
      ${r.note?`<div style="font-size:.82rem;color:var(--muted)">사유: ${r.note}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-primary" style="height:42px;flex:1" data-ap="${r.id}">승인</button>
        <button class="link-x" style="border:1px solid var(--line);border-radius:12px;flex:1" data-rj="${r.id}">반려</button>
      </div>`;
    div.querySelector("[data-ap]").onclick=async()=>{
      if(!confirm(`${r.employee_name}님의 ${kindLabel[r.kind]} 요청을 승인할까요?`)) return;
      const res=await BE.resolveRequest(r.id,true,null);
      if(res&&res.ok){ toast("in","승인됨","정정이 반영되었습니다."); renderAdmin(); }
      else toast("err","실패",(res&&res.error)||"오류");
    };
    div.querySelector("[data-rj]").onclick=async()=>{
      const reason=prompt("반려 사유(선택):")||"";
      const res=await BE.resolveRequest(r.id,false,reason);
      if(res&&res.ok){ toast("out","반려됨",""); renderAdmin(); }
      else toast("err","실패",(res&&res.error)||"오류");
    };
    sec.appendChild(div);
  }
}

// 관리자 직접 수정 모달
function openAdminFix(emp, effRows){
  const v=document.getElementById("addVeil");
  const modal=v.querySelector(".modal");
  const rowsHtml = effRows.length
    ? effRows.map(r=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
        <span style="flex:1">${r.event_type==="IN"?"출근":"퇴근"} ${hhmm(fromIso(r.event_at))}${r.corrected?' <span style="color:var(--accent);font-size:.7rem">(보정됨)</span>':''}</span>
        <button class="link-x" data-void="${r.id}" data-emp="${emp.id}">무효화</button>
      </div>`).join("")
    : `<div style="color:var(--muted);font-size:.85rem">오늘 기록 없음</div>`;
  modal.innerHTML=`
    <h3>${emp.name} · 근태 수정</h3>
    <div style="margin-bottom:14px">${rowsHtml}</div>
    <div class="section-t">누락분 추가</div>
    <div class="field"><label>종류</label>
      <select id="fixType" style="height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 12px">
        <option value="IN">출근</option><option value="OUT">퇴근</option></select></div>
    <div class="field"><label>시각</label><input id="fixTime" type="datetime-local"></div>
    <div class="field"><label>사유</label><input id="fixReason" placeholder="예: 퇴근 누락 보정"></div>
    <button class="btn-primary" id="fixAdd">추가</button>
    <button class="link-x" id="fixCancel" style="width:100%;margin-top:8px">닫기</button>`;
  v.classList.add("show");
  modal.querySelectorAll("[data-void]").forEach(b=>b.onclick=async()=>{
    if(!confirm("이 기록을 무효화할까요? (원본은 보존됩니다)")) return;
    const reason=prompt("무효화 사유:")||"관리자 무효화";
    const eid=b.getAttribute("data-void"); const empId=b.getAttribute("data-emp");
    if(String(eid).startsWith("add_")){ toast("err","불가","추가된 항목은 무효화 대신 다시 추가로 관리하세요."); return; }
    const res=await BE.correctEvent("VOID",Number(eid),Number(empId),null,null,reason);
    if(res!=null){ toast("out","무효화됨",""); v.classList.remove("show"); restoreAddModal(); renderAdmin(); }
  });
  modal.querySelector("#fixCancel").onclick=()=>{ v.classList.remove("show"); restoreAddModal(); };
  modal.querySelector("#fixAdd").onclick=async()=>{
    const type=document.getElementById("fixType").value;
    const tv=document.getElementById("fixTime").value; // "YYYY-MM-DDTHH:MM"
    const reason=document.getElementById("fixReason").value.trim()||"관리자 추가";
    if(!tv){ alert("시각을 입력하세요."); return; }
    const at=tv.length===16?tv+":00":tv;
    const res=await BE.correctEvent("ADD",null,emp.id,at,type,reason);
    if(res!=null){ toast("in","추가됨","누락분이 반영되었습니다."); v.classList.remove("show"); restoreAddModal(); renderAdmin(); }
    else toast("err","실패","");
  };
}

/* 직원 등록 모달 */
function bindAddModal(){
  document.getElementById("newCancel").onclick=()=>document.getElementById("addVeil").classList.remove("show");
  document.getElementById("newSave").onclick=async()=>{
    const name=document.getElementById("newName").value.trim();
    const pin=document.getElementById("newPin").value.trim();
    if(!name){ alert("이름을 입력하세요."); return; }
    if(!/^\d{4}$/.test(pin)){ alert("비밀번호는 숫자 4자리입니다."); return; }
    try{ await BE.createEmployee(name,pin); }catch(e){ alert(e.message); return; }
    document.getElementById("newName").value=""; document.getElementById("newPin").value="";
    document.getElementById("addVeil").classList.remove("show");
    renderAdmin();
  };
}
document.getElementById("addVeil").addEventListener("click",e=>{ if(e.target.id==="addVeil") e.currentTarget.classList.remove("show"); });
bindAddModal();

/* ---------------------- 급여 화면 (Sprint 2) ---------------------- */
// 월 내 각 직원의 완결세션 합계시간 + 근무주수(주휴 계산용) 산출
function weeksInMonth(ym){
  // 해당 월에 걸친 주(월요일 시작) 수를 근사 — 엑셀 관행상 보통 4주 사용
  return 4; // V0.1: 매장 관행(4주 기준). 추후 실제 근무주 계산으로 확장.
}
async function renderPay(){
  const now=kstNow(); const p=n=>String(n).padStart(2,"0");
  const curYm=`${now.getFullYear()}-${p(now.getMonth()+1)}`;
  view.innerHTML=`
    <div class="section-t">급여 정산</div>
    <div class="field" style="max-width:200px">
      <label>정산 월</label>
      <input id="payMonth" type="month" value="${curYm}">
    </div>
    <div style="font-size:.75rem;color:var(--muted);margin:-4px 2px 14px">
      ⚠ 세후(3.3%)·주휴 처리는 현재 매장 관행값입니다. 실제 신고는 회계사 확인 후.
    </div>
    <div id="payList"></div>`;
  document.getElementById("payMonth").addEventListener("change",e=>drawPay(e.target.value));
  drawPay(curYm);
}
async function drawPay(ym){
  const el=document.getElementById("payList");
  el.innerHTML=`<div class="empty">계산 중…</div>`;
  let emps=[], events=[];
  try{
    emps=await BE.allEmployees();
    if(LIVE){
      const [y,m]=ym.split("-").map(Number); const p=n=>String(n).padStart(2,"0");
      const start=new Date(y,m-1,1); start.setDate(start.getDate()-1);
      const end=new Date(y,m,1); end.setDate(end.getDate()+2);
      const sd=`${start.getFullYear()}-${p(start.getMonth()+1)}-${p(start.getDate())}`;
      const ed=`${end.getFullYear()}-${p(end.getMonth()+1)}-${p(end.getDate())}`;
      const data=await BE.eventsWithCorrections(`${sd}T00:00:00`,`${ed}T00:00:00`);
      events=applyCorrections(data.events, data.corrections);
    } else {
      events=await BE.monthEvents(ym);
    }
  }
  catch(e){ el.innerHTML=`<div class="empty">불러오기 실패: ${e.message}</div>`; return; }
  const active=emps.filter(e=>e.is_active!==false && e.active!==false);
  if(!active.length){ el.innerHTML=`<div class="empty">직원이 없습니다.</div>`; return; }
  const weeks=weeksInMonth(ym);
  el.innerHTML="";
  let totalNet=0;
  for(const e of active){
    const rows=events.filter(x=>x.employee_id===e.id);
    const allSess=pairEvents(rows); // 경계 포함 데이터로 세션 먼저 완성
    // 귀속 규칙(V0.1): 근무세션을 "출근일" 기준으로 정산월에 귀속
    const sess=allSess.filter(s=>{
      const anchor = s.in || s.out;            // IN 없으면(고아 OUT) OUT일 기준
      if(!anchor) return false;
      const p=n=>String(n).padStart(2,"0");
      const ymOf=`${anchor.getFullYear()}-${p(anchor.getMonth()+1)}`;
      return ymOf===ym;
    });
    const sec=sess.filter(s=>s.status==="COMPLETE").reduce((a,s)=>a+(s.sec||0),0);
    const hours=secToHours(sec); // 반올림 없이 정확한 시간(소수)으로 계산
    const issues=sess.filter(s=>s.status==="INCOMPLETE"||s.status==="ORPHAN_OUT").length;
    const hasWage = e.wage!=null && e.wage>0;
    const pay = hasWage ? calcPayroll(e, hours, weeks) : null;
    if(pay) totalNet+=pay.net;
    const card=document.createElement("div");
    card.className="row"; card.style.flexDirection="column"; card.style.alignItems="stretch"; card.style.gap="10px";
    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px">
        <div class="nm" style="flex:1">${e.name}
          ${issues?`<span class="badge issue" style="margin-left:6px">확인필요 ${issues}</span>`:''}
        </div>
        <button class="link-x" data-edit="${e.id}">설정</button>
      </div>
      ${hasWage ? `
      <div style="font-size:.85rem;color:var(--sub);line-height:1.9">
        <div>실근무 <b style="color:var(--ink)">${fmtHM(sec)}</b> · 시급 ${e.wage.toLocaleString()}원</div>
        <div>기본급 <b style="color:var(--ink)">${pay.base.toLocaleString()}</b>
          ${pay.juhyu?` · 주휴 <b style="color:var(--ink)">${pay.juhyu.toLocaleString()}</b>`:''}</div>
        <div style="margin-top:4px;padding-top:8px;border-top:1px solid var(--line)">
          세전 <b style="color:var(--ink)">${pay.gross.toLocaleString()}</b>
          → 세후(${(pay.rate*100).toFixed(1)}%) <b style="color:var(--in);font-size:1.05rem">${pay.net.toLocaleString()}원</b></div>
        ${e.memo?`<div style="color:var(--muted);font-size:.78rem;margin-top:4px">📝 ${e.memo}</div>`:''}
      </div>` : `
      <div style="font-size:.82rem;color:var(--muted)">실근무 ${fmtHM(sec)} · 시급 미설정 — [설정]에서 시급을 입력하세요</div>`}
    `;
    card.querySelector("[data-edit]").onclick=()=>openPayEdit(e);
    el.appendChild(card);
  }
  const sum=document.createElement("div");
  sum.className="row"; sum.style.marginTop="6px"; sum.style.borderColor="var(--accent)";
  sum.innerHTML=`<div class="nm" style="flex:1">세후 합계</div><div class="nm" style="color:var(--in)">${totalNet.toLocaleString()}원</div>`;
  el.appendChild(sum);
}
function openPayEdit(emp){
  const v=document.getElementById("addVeil");
  const modal=v.querySelector(".modal");
  modal.innerHTML=`
    <h3>${emp.name} · 급여 설정</h3>
    <div class="field"><label>시급 (원)</label><input id="peWage" inputmode="numeric" value="${emp.wage||''}" placeholder="예: 12000"></div>
    <div class="field"><label>주당 주휴시간 (0=주휴없음)</label><input id="peJh" inputmode="decimal" value="${emp.juhyu_hours||0}" placeholder="예: 4.4"></div>
    <div class="field"><label>주휴 주당액 반올림 (-3=1000원, 비움=반올림안함)</label><input id="peJr" inputmode="numeric" value="${emp.juhyu_round??''}" placeholder="예: -3"></div>
    <div class="field"><label>원천징수율 (0.033 = 3.3%)</label><input id="peTax" inputmode="decimal" value="${emp.tax_rate??0.033}"></div>
    <div class="field"><label>메모 (예외 사유)</label><input id="peMemo" value="${emp.memo||''}" placeholder="예: 15h미만 1주 차감"></div>
    <button class="btn-primary" id="peSave">저장</button>
    <button class="link-x" id="peCancel" style="width:100%;margin-top:8px">취소</button>`;
  v.classList.add("show");
  modal.querySelector("#peCancel").onclick=()=>{ v.classList.remove("show"); restoreAddModal(); };
  modal.querySelector("#peSave").onclick=async()=>{
    const fields={
      wage: parseInt(document.getElementById("peWage").value)||null,
      juhyu_hours: parseFloat(document.getElementById("peJh").value)||0,
      juhyu_round: document.getElementById("peJr").value===''?null:parseInt(document.getElementById("peJr").value),
      tax_rate: parseFloat(document.getElementById("peTax").value)||0.033,
      memo: document.getElementById("peMemo").value.trim()||null,
    };
    try{ await BE.updateEmployee(emp.id,fields); }catch(e){ alert(e.message); return; }
    v.classList.remove("show"); restoreAddModal();
    drawPay(document.getElementById("payMonth").value);
  };
}
function restoreAddModal(){
  const modal=document.getElementById("addVeil").querySelector(".modal");
  modal.innerHTML=`
    <h3>직원 등록</h3>
    <div class="field"><label>이름</label><input id="newName" autocomplete="off" placeholder="예: 이현진"></div>
    <div class="field"><label>비밀번호 (4자리)</label><input id="newPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="숫자 4자리"></div>
    <button class="btn-primary" id="newSave">등록</button>
    <button class="link-x" id="newCancel" style="width:100%;margin-top:8px">취소</button>`;
  bindAddModal();
}

document.getElementById("storeName").textContent=CONFIG.STORE_NAME;

if(LIVE){ connEl.className="conn live"; connEl.textContent="클라우드 연결됨 · Supabase"; }

tick(); setInterval(tick,1000);
if(LIVE) Auth.load();
route();
</script>
