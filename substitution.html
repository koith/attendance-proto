<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대타 요청 · 백억커피</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;background:#f4f7f5;color:#172019}.wrap{max-width:720px;margin:auto;padding:18px}a{color:#1d5d3a}.card{background:#fff;border:1px solid #dbe4de;border-radius:14px;padding:16px;margin:12px 0}#testSubBanner{position:sticky;top:8px;z-index:5;margin:10px 0;padding:9px 12px;border-radius:999px;background:#5b35d5;color:#fff;text-align:center;font-size:.78rem;font-weight:800}label{display:block;font-size:.85rem;color:#66736a;margin:10px 0 4px}select,input,textarea,button{width:100%;box-sizing:border-box;font-size:16px;min-height:44px;border:1px solid #dbe4de;border-radius:10px;padding:10px;background:#fff}button{background:#1d5d3a;color:#fff;font-weight:700;margin-top:12px}.secondary{background:#fff;color:#1d5d3a}.danger{background:#fff;color:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.req{border-top:1px solid #e7ece9;padding:12px 0}.req:first-child{border:0}.meta{font-size:.82rem;color:#66736a}.status{font-weight:700}.actions{display:flex;gap:8px}.actions button{margin-top:8px}.msg{padding:10px;border-radius:10px;background:#eef6f1}.err{background:#fff0ef;color:#b42318}</style></head><body><div class="wrap"><a href="index.html">← 근태 화면</a><div id="testSubBanner" hidden></div><h1>대타 요청</h1><div class="card"><p>본인 직원번호와 PIN으로 요청·승인합니다. 승인만으로 근무 완료가 되지 않으며 실제 출퇴근이 최종 근무 기록입니다.</p><label>내 직원</label><select id="me"></select><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button id="load" class="secondary">내 요청 불러오기</button></div><div class="card"><h2>새 대타 요청</h2><label>대타 직원</label><select id="sub"></select><div class="row"><div><label>시작</label><input id="start" type="datetime-local"></div><div><label>종료</label><input id="end" type="datetime-local"></div></div><label>메모</label><textarea id="note" maxlength="200"></textarea><button id="create">요청 보내기</button></div><div id="msg"></div><div class="card"><h2>요청 내역</h2><div id="list" class="meta">본인 확인 후 표시됩니다.</div></div></div><script src="substitution_test_attendance_bridge_v1.js?v=20260916a"></script><script src="substitution_v1.js?v=20260916c"></script></body></html>
