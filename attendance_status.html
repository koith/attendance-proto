<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>백억커피 실근무 현황</title>
<link rel="stylesheet" href="attendance_status.css">
<script src="no_double_tap_zoom.js" defer></script>
<script src="ios_navigation_resilience.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><button id="back">‹ 관리</button><h1>실근무 현황</h1><span></span></header>
  <section class="card" id="monthCard">
    <div class="nav"><button id="prev" aria-label="이전 달">‹</button><b id="monthTitle"></b><button id="next" aria-label="다음 달">›</button></div>
    <div class="hint" style="text-align:center;margin-bottom:10px">실제 출퇴근 기록 기준 · 날짜를 누르면 일별 상세</div>
    <div class="month-grid" id="calendar"></div>
    <div class="legend"><span><i></i>완료 근무</span><span><i class="o"></i>진행 중</span><span><i class="x"></i>확인 필요</span></div>
  </section>
  <section class="card" id="dayCard" hidden>
    <div class="day-head"><button class="back-month" id="backMonth">‹ 월간</button><h2 id="dayTitle"></h2><span></span></div>
    <div class="axis-wrap"><div class="axis" id="timeline"></div></div>
  </section>
  <section class="card empty-state" id="loading">불러오는 중…</section>
</div>
<script src="attendance_status.js"></script>
</body>
</html>
